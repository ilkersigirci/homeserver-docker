services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3-openvino@sha256:43b6b964c6cc458b624ec9b7ed2af0231e19e3bcfaaa68fba8a2668353c48251
    mem_limit: 1G
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      OMP_NUM_THREADS: 8
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri:/dev/dri
