services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6-openvino@sha256:035c30de002da9d4d4ae3872107bb9d8e195ead1c1f9fd470a2b0149ed37aec1
    mem_limit: 1G
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      OMP_NUM_THREADS: 8
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri:/dev/dri
