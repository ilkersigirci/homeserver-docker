services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.6-cuda@sha256:2c2721c54c5e245b095eea3eb0cda743d112a3f537555b39e2e9a112879a50c1
    cpus: "4.0"
    mem_limit: 2G
    environment:
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
