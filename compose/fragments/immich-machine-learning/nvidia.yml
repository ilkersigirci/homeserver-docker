services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda@sha256:82d3f6a093455964508052e0b3bc55a91075b48b65be35e78b40774a72c1ebb3
    cpus: "4.0"
    mem_limit: 2G
    environment:
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
