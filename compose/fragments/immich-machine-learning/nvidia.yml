services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.1-cuda@sha256:e5b2e693c5531e5794d96213409f0ce122eccd25feec91a9cd74b99eba183d65
    cpus: "4.0"
    mem_limit: 2G
    environment:
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
