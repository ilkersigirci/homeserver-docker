services:
  immich-redis:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  immich-postgres:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  immich-server:
    ports:
      - "2283:2283"
    volumes: !override
      - type: bind
        source: $IMMICH_THUMBS_PATH
        target: /data/thumbs
        bind:
          create_host_path: false
      - type: bind
        source: $IMMICH_DATA_PATH
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: $DIR_PHOTOS/Pictures
        target: /mnt/hdd/Photos/Pictures
        bind:
          create_host_path: false
      - type: bind
        source: $DIR_PHOTOS/Videos
        target: /mnt/hdd/Photos/Videos
        read_only: true
        bind:
          create_host_path: false
