services:
  linkwarden-db:
    container_name: linkwarden-db
    image: postgres:16-alpine
    restart: $OTHERS_RESTART_POLICY
    networks:
      - t3_proxy
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - $DATADIR/linkwarden-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles:
      - reading

  linkwarden:
    container_name: linkwarden
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: $OTHERS_RESTART_POLICY
    depends_on:
      linkwarden-db:
        condition: service_healthy
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DATADIR/linkwarden:/data/data
    environment:
      STORAGE_FOLDER: /data
      NEXTAUTH_URL: https://linkwarden.$DOMAINNAME/api/v1/auth
      NEXTAUTH_SECRET: $LINKWARDEN_NEXTAUTH_SECRET
      DATABASE_URL: postgresql://postgres:postgres@linkwarden-db:5432/postgres
      NEXT_PUBLIC_DISABLE_REGISTRATION: true
      NEXT_PUBLIC_CREDENTIALS_ENABLED: true
      ## OIDC
      NEXT_PUBLIC_KEYCLOAK_ENABLED: true
      KEYCLOAK_CUSTOM_NAME: PocketID
      KEYCLOAK_ISSUER: https://pocketid.$BASE_DOMAINNAME
      KEYCLOAK_CLIENT_ID: $LINKWARDEN_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET: $LINKWARDEN_CLIENT_SECRET
    labels:
      tinyauth.ip.bypass: $LOCAL_IPS
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.linkwarden-rtr.entrypoints: "websecure"
      traefik.http.routers.linkwarden-rtr.rule: "Host(`linkwarden.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.linkwarden-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.linkwarden-rtr.service: "linkwarden-svc"
      traefik.http.services.linkwarden-svc.loadbalancer.server.port: "3000"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Linkwarden"
      homepage.icon: "linkwarden.webp"
      homepage.href: "https://linkwarden.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Bookmark Manager"
      homepage.widget.type: "linkwarden"
      homepage.widget.url: "http://linkwarden:3000"
      homepage.widget.key: "$LINKWARDEN_ACCESS_KEY"
    profiles:
      - reading
