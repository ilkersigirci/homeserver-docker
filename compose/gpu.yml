name: gpu

networks:
  default:
    driver: bridge
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  socket_proxy_read:
    name: socket_proxy_read
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  socket_proxy_write:
    name: socket_proxy_write
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.92.0/24
  socket_proxy_exec:
    name: socket_proxy_exec
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.93.0/24
  crowdsec_lapi:
    name: crowdsec_lapi
    driver: bridge
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp18s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

