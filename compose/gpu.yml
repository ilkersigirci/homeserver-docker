name: gpu

networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp18s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - ../apps/arcane-agent.yml
  - ../apps/homepage.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/egress-proxy.yml
  - path:
      - ../apps/otel-collector-agent.yml
      - ./fragments/otel-collector-agent/immich.yml
  ###### MAINTENANCE ####
  - ../apps/whoami.yml
  #### MEDIA ####
  - ../apps/bichon.yml
  - ../apps/pinchflat.yml
  # - ../apps/splitpro.yml
  # - ../apps/strava-statistics.yml
  # - ../apps/ytptube.yml # TODO: restart always
  #### MONITORING ####
  - ../apps/gatus-container-health.yml
  #### PHOTO ####
  - ../apps/immich.yml
  - ../apps/immich-public-proxy.yml
  #### READING ####
  # - ../apps/hypothesis.yml
  # - ../apps/karakeep.yml
  - ../apps/rsshub.yml
  #### OTHERS ####
  - ../apps/bambuddy.yml
