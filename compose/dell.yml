name: dell

networks:
  default:
    driver: bridge
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### SERVICES
  #### CORE ####
  - ../apps/homepage.yml
  - ../apps/filebrowser.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/otel-collector-agent.yml
  ###### MAINTENANCE ####
  - ../apps/home-assistant.yml
  - ../apps/watchyourlan.yml
  - ../apps/whoami.yml
  #### MEDIA ####
  - ../apps/immich.yml
  - ../apps/immich-gpu-intel.yml
