name: dell

networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - ../apps/adguardhome-host.yml
  - ../apps/homepage.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/otel-collector-agent.yml
  ###### MAINTENANCE ####
  # - ../apps/home-assistant.yml
  - ../apps/watchyourlan.yml
  - ../apps/whoami.yml
  #### MEDIA ####
  - path:
      - ../apps/immich.yml
      - ./fragments/immich/dell.yml
  - path:
      - ../apps/immich-machine-learning.yml
      - ./fragments/immich-machine-learning/intel.yml
  - path:
      - ../apps/frigate.yml
      - ./fragments/frigate/intel.yml
  - ../apps/mosquitto.yml
  #### MONITORING ####
  - ../apps/gatus-container-health.yml
