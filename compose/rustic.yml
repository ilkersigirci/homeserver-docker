# Use with: drun rustic <COMMAND>
# Commands:
#  - init: Initialize a new remote repository
#      init -r /repos/TestRepo
#  - backup: Backup the local repository to the remote repository
#  - restore: Restore the remote repository to a local directory
#       -r /repos/TestRepo restore latest /restores/RestoreTest
#  - snapshots: List all snapshots in the remote repository
services:
  rustic:
    container_name: rustic
    hostname: ${MY_HOSTNAME}
    image: ghcr.io/rustic-rs/rustic:latest
    # user: $PUID:$PGID
    # build:
    #   context: $DOCKERDIR/Dockerfiles/Rustic
    #   args:
    #     RUSTIC_VERSION: v0.9.5
    # restart: $MAINTENANCE_RESTART_POLICY
    restart: "no"
    command: help
    profiles:
      # - maintenance # NOTE: Commented out so that docker-manage script excludes it
      - custom-tool
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $CONFIGDIR/rustic/rustic.toml:/etc/rustic/rustic.toml:ro
      - $DOCKERDIR/logs/rustic:/logs:rw
      # - $CONFIGDIR/rclone:/root/.config/rclone:rw
      - $BACKUPDIR/RUSTIC/Repos/TestRepo:/repos/TestRepo:rw
      - $BACKUPDIR/RUSTIC/Restores:/restores:rw
      - $BACKUPDIR/RUSTIC/BackupTest:/backups/BackupTest:ro
      - $DATADIR/vaultwarden-backup:/backups/Vaultwarden:ro
      # - $CONFIGDIR:/backups/docker_configs:ro
      # - $NOTESDIR/Markdown:/backups/Markdown:ro
    environment:
      TZ: $TZ
      RUSTIC_PASSWORD: /run/secrets/rustic_password
      # - RCLONE_CONFIG=/root/.config/rclone/rclone.conf
    secrets:
      - rustic_password