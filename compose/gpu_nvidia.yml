name: gpu_nvidia

networks:
  default:
    driver: bridge
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp18s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### SERVICES
  #### CORE ####
  - ../apps/arcane-agent.yml
  - ../apps/socket-proxy.yml
  #### DESKTOP APPS ####
  # - ../apps/bambustudio.yml
  # - ../apps/krita.yml
  # - ../apps/firefox.yml
  # - ../apps/gimp.yml
  # - ../apps/obsidian.yml
  - ../apps/sealskin.yml
  # - ../apps/thunderbird.yml # TODO
  #### PHOTO ####
  - ../apps/immich-gpu.yml