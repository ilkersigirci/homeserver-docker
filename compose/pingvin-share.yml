services:
  pingvin-share:
    image: ghcr.io/stonith404/pingvin-share:latest
    container_name: pingvin-share
    restart: $MEDIA_RESTART_POLICY
    profiles:
      - media
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - "$CONFIGDIR/pingvin-share/config.yaml:/opt/app/config.yaml" # Add this line, if you want to configure pingvin-share via config file and not via UI
      - "$DOCKERDIR/appdata/pingvin-share/data:/opt/app/backend/data"
      - "$DOCKERDIR/appdata/pingvin-share/data/images:/opt/app/frontend/public/img"
    environment:
      PUID: $PUID
      PGID: $PGID
      TRUST_PROXY: true
    labels:
      tinyauth.domain: fileshare.$DOMAINNAME
      tinyauth.ip.bypass: $LOCAL_IPS
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.pingvin-share-rtr.entrypoints: websecure
      traefik.http.routers.pingvin-share-rtr.rule: Host(`fileshare.$DOMAINNAME`)
      ## Middlewares
      traefik.http.routers.pingvin-share-rtr.middlewares: chain-no-auth@file
      ## HTTP Services
      traefik.http.routers.pingvin-share-rtr.service: pingvin-share-svc
      traefik.http.services.pingvin-share-svc.loadbalancer.server.port: "3000"
      ####### HOMEPAGE #######
      homepage.group: Media
      homepage.name: pingvin-share
      homepage.icon: pingvin-share.png
      homepage.href: https://fileshare.$DOMAINNAME
      homepage.target: _blank
      homepage.description: A self-hosted file sharing platform
      ####### GLANCE #######
      glance.name: pingvin-share
      glance.icon: sh:pingvin-share
      glance.url: https://fileshare.$DOMAINNAME
      glance.description: A self-hosted file sharing platform