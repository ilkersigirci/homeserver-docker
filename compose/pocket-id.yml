# In initial setup, go to /login/setup
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: $BASE_RESTART_POLICY
    profiles:
      - core
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/pocket-id:/app/backend/data
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - PUBLIC_APP_URL=https://pocketid.$DOMAINNAME
      - TRUST_PROXY=yes
      # - HOST=0.0.0.0
      # - PORT=3000
      # - BACKEND_PORT=8080
    healthcheck:
        test: "curl -f http://localhost/health"
        interval: 1m30s
        timeout: 5s
        start_period: 10s
        retries: 2
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.pocket-id-rtr.entrypoints=websecure"
      - "traefik.http.routers.pocket-id-rtr.rule=Host(`pocketid.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.pocket-id-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.pocket-id-rtr.service=pocket-id-svc"
      - "traefik.http.services.pocket-id-svc.loadbalancer.server.port=80"
      ####### HOMEPAGE #######
      - homepage.group=Core
      - homepage.name=pocket-id
      - homepage.icon=pocket-id.svg
      - homepage.href=https://pocketid.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=OIDC provider that allows users to authenticate with their passkeys
      ####### GLANCE #######
      - glance.name=pocket-id
      - glance.icon=sh:pocket-id-dark
      - glance.url=https://pocketid.$DOMAINNAME
      - glance.description=OIDC provider that allows users to authenticate with their passkeys