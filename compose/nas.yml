  # authelia_session_secret:
  #   file: $REPO_PATH/secrets/authelia_session_secret
  # authelia_storage_encryption_key:
  #   file: $REPO_PATH/secrets/authelia_storage_encryption_key
  cf_dns_api_token:
    file: $REPO_PATH/secrets/cf_dns_api_token
  # firefly_app_key:
  #   file: $REPO_PATH/secrets/firefly_app_key
  # mysql_root_password:
  #   file: $REPO_PATH/secrets/mysql_root_password
  # mysql_password:
  #   file: $REPO_PATH/secrets/mysql_password
  rustic_password:
    file: $REPO_PATH/secrets/rustic_password

