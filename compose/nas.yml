name: nas

networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: ens18
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - path:
      - ../apps/arcane-agent.yml
      - ./fragments/arcane-agent/lxc.yml
  - ../apps/homepage.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/otel-collector-agent.yml
  ###### MAINTENANCE ####
  # - ../apps/syncthing.yml
  - ../apps/whoami.yml
  #### MEDIA ####
  # - ../apps/filebrowser.yml
  - ../apps/filestash.yml
  - ../apps/sabnzbd.yml
  - ../apps/transmission.yml
  - ../apps/versitygw.yml
  #### MONITORING ####
  - ../apps/gatus-container-health.yml
  #### READING ####
  - ../apps/silverbullet.yml
