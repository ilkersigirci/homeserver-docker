services:
  # NEEDS ipv6 to be enabled currently.
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: $BASE_RESTART_POLICY
    profiles:
      - core
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.91
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    volumes:
      - $CONFIGDIR/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      - PORT=51821
      - HOST=0.0.0.0
      # - INSECURE=false
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.wg-easy-rtr.entrypoints=websecure"
      - "traefik.http.routers.wg-easy-rtr.rule=Host(`wireguard.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.wg-easy-rtr.middlewares=chain-tinyauth@file"
      ## HTTP Services
      - "traefik.http.routers.wg-easy-rtr.service=wg-easy-svc"
      - "traefik.http.services.wg-easy-svc.loadbalancer.server.port=51821"
      ####### HOMEPAGE #######
      - homepage.group=Core
      - homepage.name=Wireguard
      - homepage.icon=wireguard.svg
      - homepage.href=https://wireguard.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=The easiest way to run WireGuard VPN and UI

  # To get WG_DEVICE, run this inside the container: ip route get 8.8.8.8 | awk '{print $5}'
  wg-easy-14:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy-14
    restart: $BASE_RESTART_POLICY
    profiles:
      - not-used
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.91
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - $CONFIGDIR/wg-easy-14:/etc/wireguard
    environment:
      - WG_HOST=www.$DOMAINNAME # The public hostname of your VPN server. Shouldn't be proxied by Cloudflare.
      - WG_DEVICE=eth0 # Internal network interface inside docker. DO NOT use host device network name.
      # Optional:
      # - PASSWORD_HASH=$WIREGUARD_PASSWORD # Comment out if don't want to use a password. Remember to add extra $ for the hash.
      - WG_PORT=51820 # The public UDP port of your VPN server. WireGuard will always listen on 51820 inside the Docker container.
      # - WG_DEFAULT_ADDRESS=10.8.0.x # Clients IP address range.
      # - WG_DEFAULT_DNS=1.1.1.1 # DNS server clients will use.
      # - WG_MTU=1420 # The MTU the clients will use. Server uses default WG MTU.
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24 # Allowed IPs clients will use.
      # - WG_PRE_UP=echo "Pre Up" > /etc/wireguard/pre-up.txt
      # - WG_POST_UP=echo "Post Up" > /etc/wireguard/post-up.txt
      # - WG_PRE_DOWN=echo "Pre Down" > /etc/wireguard/pre-down.txt
      # - WG_POST_DOWN=echo "Post Down" > /etc/wireguard/post-down.txt
      - WG_PERSISTENT_KEEPALIVE=25
      - UI_TRAFFIC_STATS=true
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.wg-easy-14-rtr.entrypoints=websecure"
      - "traefik.http.routers.wg-easy-14-rtr.rule=Host(`wireguard.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.wg-easy-14-rtr.middlewares=chain-tinyauth-relaxed@file" # NOTE: relaxed used for preventing CSP issues
      ## HTTP Services
      - "traefik.http.routers.wg-easy-14-rtr.service=wg-easy-14-svc"
      - "traefik.http.services.wg-easy-14-svc.loadbalancer.server.port=51821"
      ####### HOMEPAGE #######
      - homepage.group=Core
      - homepage.name=Wireguard
      - homepage.icon=wireguard.svg
      - homepage.href=https://wireguard.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=The easiest way to run WireGuard VPN and UI