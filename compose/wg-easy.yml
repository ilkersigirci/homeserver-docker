services:
  wg-easy:
    image: weejewel/wg-easy
    container_name: wg-easy
    restart: $OTHERS_RESTART_POLICY
    networks:
      - t3_proxy
    volumes:
      - $DOCKERDIR/appdata/wg-easy:/etc/wireguard
    environment:
      - WG_HOST=$SERVER_IP
      # - PASSWORD=ilker
      # - WG_PORT=51820
      # - WG_DEFAULT_ADDRESS=10.8.0.x
      # - WG_DEFAULT_DNS=1.1.1.1
      # - WG_ALLOWED_IPS=192.168.15.0/24, 10.0.1.0/24
    ports:
      - "51820:51820/udp"
      # - "51821:51821/tcp"
    #    security_opt:
    # - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.wg-easy-rtr.entrypoints=websecure"
      - "traefik.http.routers.wg-easy-rtr.rule=Host(`wireguard.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.wg-easy-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.wg-easy-rtr.service=wg-easy-svc"
      - "traefik.http.services.wg-easy-svc.loadbalancer.server.port=51821"
      ####### HOMEPAGE #######
      - homepage.group=Others
      - homepage.name=Wireguard
      - homepage.icon=wireguard.svg
      - homepage.href=https://wireguard.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=VPN Server
    profiles:
      - others
