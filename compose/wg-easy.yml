services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: $BASE_RESTART_POLICY
    profiles:
      - core
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.91
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    volumes:
      - $CONFIGDIR/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      - PORT=51821
      - HOST=0.0.0.0
      # - INSECURE=false
    labels:
      - "traefik.enable=true"
      ## HTTP Routers Auth
      - "traefik.http.routers.wg-easy-rtr.entrypoints=websecure"
      - "traefik.http.routers.wg-easy-rtr.rule=Host(`wireguard.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.wg-easy-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.wg-easy-rtr.service=wg-easy-svc"
      - "traefik.http.services.wg-easy-svc.loadbalancer.server.port=51821"
      ####### HOMEPAGE #######
      - homepage.group=Core
      - homepage.name=Wireguard
      - homepage.icon=wireguard.svg
      - homepage.href=https://wireguard.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=The easiest way to run WireGuard VPN and UI
