x-deploy: &gpu-deploy
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility]
            # capabilities: [compute, utility]

services:
  stable-diffusion:
    container_name: stable-diffusion
    build: $GITHUBREPOSDIR/stable-diffusion-webui-docker/services/AUTOMATIC1111
    image: stablediff-auto:71
    restart: $ML_RESTART_POLICY
    <<: *gpu-deploy
    stop_signal: SIGINT
    tty: true
    networks:
      - t3_proxy
    volumes:
      - $GITHUBREPOSDIR/stable-diffusion-webui-docker/data:/data
      - $GITHUBREPOSDIR/stable-diffusion-webui-docker/output:/output
      # - $GITHUBREPOSDIR/stable-diffusion-webui-docker/services/AUTOMATIC1111/config.json:/stable-diffusion-webui/config.json
    environment:
      # - ATTN_PRECISION=fp16
      - CLI_ARGS=--allow-code --enable-insecure-extension-access --medvram-sdxl # --api --xformers --no-half-vae
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.stablediffusion-rtr.entrypoints=websecure"
      - "traefik.http.routers.stablediffusion-rtr.rule=Host(`stablediffusion.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.stablediffusion-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.stablediffusion-rtr.service=stablediffusion-svc"
      - "traefik.http.services.stablediffusion-svc.loadbalancer.server.port=7860"
    profiles:
      - ml
