name: remoteserver

networks:
  crowdsec_lapi:
    name: crowdsec_lapi
    driver: bridge
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp0s3
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

