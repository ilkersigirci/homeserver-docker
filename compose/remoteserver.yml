  - ../apps/crowdsec.yml
  - ../apps/gotify.yml
  - ../apps/headscale.yml
  - ../apps/homepage.yml
  # - ../apps/pocket-id.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/filebrowser-quantum.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ./fragments/traefik/crowdsec_network.yml
  - ../apps/otel-collector-agent.yml
  # - ../apps/webfinger.yml
  ###### MAINTENANCE ####
