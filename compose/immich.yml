x-deploy: &gpu-deploy
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# Env variables: https://immich.app/docs/install/environment-variables
services:
  immich-redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine@sha256:905c4ee67b8e0aa955331960d2aa745781e6bd89afc44a8584bfd13bc890f0ae
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t3_proxy
    healthcheck:
      test: redis-cli ping || exit 1
    profiles:
      - photo

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release-cuda
    restart: $MEDIA_RESTART_POLICY
    <<: *gpu-deploy
    networks:
      - t3_proxy
    healthcheck:
      disable: false
    volumes:
      - $DOCKERDIR/appdata/immich-ml/model-cache:/cache
    profiles:
      - photo
    environment:
      - MACHINE_LEARNING_CACHE_FOLDER=/cache

  immich-postgres:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    command: >-
      postgres
      -c shared_preload_libraries=vectors.so
      -c 'search_path="$$user", public, vectors'
      -c logging_collector=on
      -c max_wal_size=2GB
      -c shared_buffers=512MB
      -c wal_compression=on
    networks:
      - t3_proxy
    volumes:
      - $DOCKERDIR/appdata/immich-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      PG_DATA: /var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
        Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
        echo "checksum failure count is $$Chksum";
        [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    profiles:
      - photo

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    restart: $MEDIA_RESTART_POLICY
    <<: *gpu-deploy
    depends_on:
      - immich-redis
      - immich-postgres
    networks:
      - t3_proxy
    healthcheck:
      disable: false
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - ${MEDIADIR}/Photos/Pictures:/mnt/media/Photos/Pictures:ro
      - ${MEDIADIR}/Photos/Videos:/mnt/media/Photos/Videos:ro
      # - ${MEDIADIR}/Photos/Pictures:/mnt/media/Photos/Pictures
      # - ${MEDIADIR}/Photos/Videos:/mnt/media/Photos/Videos
    environment:
      - UPLOAD_LOCATION=${UPLOAD_LOCATION}
      - IMMICH_LOG_LEVEL=${IMMICH_LOG_LEVEL}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME}
      - DB_HOSTNAME=${DB_HOSTNAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-server-rtr.entrypoints=websecure"
      - "traefik.http.routers.immich-server-rtr.rule=Host(`photos.$DOMAINNAME`)"
      # - "traefik.http.routers.immich-server-rtr.rule=Host(`photos.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      - "traefik.http.routers.immich-server-rtr.middlewares=chain-authelia@file"
      # - "traefik.http.routers.immich-server-rtr.middlewares=add-api"
      # - "traefik.http.middlewares.add-api.stripprefix.prefixes=/api"
      ## HTTP Services
      - "traefik.http.routers.immich-server-rtr.service=immich-server-svc"
      - "traefik.http.services.immich-server-svc.loadbalancer.server.port=2283"
      ####### HOMEPAGE #######
      - homepage.group=Media
      - homepage.name=Immich
      - homepage.icon=immich.png
      - homepage.href=https://photos.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=Selfhosted Photo App
      - homepage.widget.type=immich
      - homepage.widget.url=http://immich-server:2283
      - homepage.widget.key=$IMMICH_API_KEY
      - homepage.widget.version=2
    profiles:
      - photo

  ##############################################
  # https://github.com/Salvoxia/immich-folder-album-creator
  immich-folder-album-creator:
    container_name: immich_folder_album_creator
    image: salvoxia/immich-folder-album-creator:latest
    restart: "no"
    networks:
      - t3_proxy
    environment:
      API_URL: http://immich-server:2283/api
      API_KEY: $IMMICH_API_KEY
      ROOT_PATH: /mnt/media/Photos/Pictures
      CRON_EXPRESSION: "0 * * * *"
      TZ: Europe/Istanbul
      ALBUM_LEVELS: 1
      LOG_LEVEL: INFO
      SYNC_MODE: "2" # Remove offline assets and delete empty albums after each run
      # RUN_IMMEDIATELY: "true" # Run the script immediately after start
    profiles:
      - photo