# NOTE: After the specified version, Minio Admin UI isn't available anymore.
# NOTE: For OIDC, in pocketid -> users -> custom claims -> Add key=policy value=consoleAdmin
#       Don't add Callback URLs in PocketID, they are added automatically by minio MINIO_BROWSER_REDIRECT_URL.
#       OIDC doesn't work when ui is in the subpath, the callback url is wrong with two backslashes, https://minio.$DOMAINNAME/ui//oauth_callback
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: $MAINTENANCE_RESTART_POLICY
    command: server /data --console-address ":9001"
    profiles:
      - maintenance
    networks:
      - t3_proxy
    expose:
      - 9000 # API
      - 9001 # Web UI
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/minio:/data
    environment:
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
      MINIO_BROWSER_REDIRECT_URL: https://minio.$DOMAINNAME/ui/
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Login with PocketID
      MINIO_IDENTITY_OPENID_CONFIG_URL: https://pocketid.$BASE_DOMAINNAME/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: $MINIO_CLIENT_ID
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: $MINIO_CLIENT_SECRET
      MINIO_IDENTITY_OPENID_SCOPES: "openid,email,profile"
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      ### API Labels ###
      ## HTTP Routers
      traefik.http.routers.minio-api-rtr.entrypoints: "websecure"
      traefik.http.routers.minio-api-rtr.rule: "Host(`minio.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.minio-api-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.minio-api-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.minio-api-rtr.service: "minio-api-svc"
      traefik.http.services.minio-api-svc.loadbalancer.server.port: "9000"
      ####### TINYAUTH #######
      tinyauth.apps.minio.config.domain: minio.$DOMAINNAME
      tinyauth.apps.minio.ip.bypass: $LOCAL_IPS
      ### Web UI Labels ###
      ## HTTP Routers
      traefik.http.routers.minio-ui-rtr.entrypoints: "websecure"
      traefik.http.routers.minio-ui-rtr.rule: "Host(`minio.$DOMAINNAME`) && PathPrefix(`/ui/`)"
      ## Middlewares
      traefik.http.routers.minio-ui-rtr.middlewares: "minio-stripprefix@docker"
      ## HTTP Services
      traefik.http.routers.minio-ui-rtr.service: "minio-ui-svc"
      traefik.http.services.minio-ui-svc.loadbalancer.server.port: "9001"
      ## Path rewriting middleware
      traefik.http.middlewares.minio-stripprefix.stripprefix.prefixes: "/ui/"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "minio"
      homepage.icon: "minio.png"
      homepage.href: "https://minio.$DOMAINNAME/ui/"
      homepage.target: "_blank"
      homepage.description: "MinIO is a high-performance, S3 compatible object store, open sourced under GNU AGPLv3 license."
      ####### GLANCE #######
      glance.name: "minio"
      glance.icon: "sh:minio"
      glance.url: "https://minio.$DOMAINNAME/ui/"
      glance.description: "MinIO is a high-performance, S3 compatible object store, open sourced under GNU AGPLv3 license."