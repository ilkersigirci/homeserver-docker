name: gpu_coding

networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp18s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - ../apps/arcane-agent-gpu.yml
  - ../apps/homepage.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/otel-collector-agent.yml
  ###### MAINTENANCE ####
  - ../apps/scanopy.yml
  - ../apps/whoami.yml
  #### PROGRAMMING ####
  - ../apps/doco-cd.yml
  - ../apps/forgejo.yml
  - ../apps/forgejo-runner.yml
  - ../apps/hatchet.yml
  - ../apps/langfuse.yml
  - ../apps/cloudbeaver.yml
  # - ../apps/pgweb.yml
  # - ../apps/pgadmin.yml # TODO
