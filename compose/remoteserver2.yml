name: remoteserver2

networks:
  crowdsec_lapi:
    name: crowdsec_lapi
    driver: bridge
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp0s3
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - ../apps/arcane-agent.yml
  - ../apps/crowdsec.yml
  - ../apps/gotify.yml
  - ../apps/homepage.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - path:
      - ../apps/traefik.yml
      - ./fragments/traefik/crowdsec_network.yml
  - ../apps/otel-collector-agent.yml
  ###### MAINTENANCE ####
  - ../apps/whoami.yml
