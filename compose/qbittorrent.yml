services:
  # Default user-pass: admin / adminadmin
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    restart: $MEDIA_RESTART_POLICY
    # network_mode: "service:gluetun"
    # depends_on:
    #   - gluetun
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/qbittorrent:/config
      - $MEDIADIR/Downloads:/data/downloads # Ensure that downloads folder is set to /data/downloads in qBittorrent
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBUI_PORT: 8080
    labels:
      tinyauth.ip.bypass: $LOCAL_IPS
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.qbittorrent-rtr.entrypoints: "websecure"
      traefik.http.routers.qbittorrent-rtr.rule: "Host(`qtorrent.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.qbittorrent-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.qbittorrent-rtr.service: "qbittorrent-svc"
      traefik.http.services.qbittorrent-svc.loadbalancer.server.port: "8080"
      # - traefik.http.services.qbittorrent-svc.loadbalancer.passhostheader=false # Not needed
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "qBittorrent"
      homepage.icon: "qbittorrent.svg"
      homepage.href: "https://qtorrent.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Download Client"
    profiles:
      - media
