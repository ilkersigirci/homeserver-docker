name: rpi0

networks:
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
# secrets:
#   cf_dns_api_token:
#     file: $REPO_PATH/secrets/cf_dns_api_token

include:
  ########################### NETWORKS
  - ./fragments/common-networks.yml
  ########################### SERVICES
  #### CORE ####
  - ../apps/arcane-agent.yml
  # - ../apps/bw-rest-api.yml
  - ../apps/glance.yml
  - ../apps/homepage.yml
  - ../apps/pocket-id.yml
  - ../apps/docker-socket-proxy.yml
  - ../apps/logrotate.yml
  - ../apps/tinyauth.yml
  - ../apps/traefik.yml
  - ../apps/otel-collector-agent.yml
  - ../apps/vaultwarden.yml
  ###### MAINTENANCE ####
  - ../apps/apprise.yml
  - ../apps/home-assistant.yml
  - ../apps/syncthing.yml
  - ../apps/watchyourlan.yml
  - ../apps/whoami.yml
  #### READING ####
  - ../apps/silverbullet.yml
