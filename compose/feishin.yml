services:
  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - jellyfin
    networks:
      - t3_proxy
    # ports:
    #   - "9180:9180"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.feishin-rtr.entrypoints=websecure"
      - "traefik.http.routers.feishin-rtr.rule=Host(`feishin.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.feishin-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.feishin-rtr.service=feishin-svc"
      - "traefik.http.services.feishin-svc.loadbalancer.server.port=9180"
      ####### HOMEPAGE #######
      - homepage.group=Media
      - homepage.name=Feishin
      - homepage.icon=feishin.webp
      - homepage.href=https://feishin.$DOMAINNAME
      - homepage.target=_blank
      - homepage.description=Music Streaming using Jellyfin
    profiles:
      - media
