  #     - "traefik.http.services.kasmvnc-svc.loadbalancer.server.port=6901"
  #     # NOTE: https://docs.linuxserver.io/faq#strict-proxy
  #     # - traefik.http.services.kasmvnc-svc.loadbalancer.serverstransport=ignorecert@file
  #     # - traefik.http.services.kasmvnc-svc.loadbalancer.server.scheme=https
  ################################################# KASM #################################################

  webtop:
    container_name: webtop
    image: lscr.io/linuxserver/webtop:latest
    restart: $DESKTOP_IMAGES_RESTART_POLICY
    shm_size: "1gb" #optional
    devices:  #optional
      - /dev/dri:/dev/dri
    # privileged: true
    # security_opt:
    #   - seccomp:unconfined #optional
    networks:
      - t3_proxy
    volumes:
      - $DOCKERDIR/appdata/webtop:/config
      # - /var/run/docker.sock:/var/run/docker.sock #optional
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - TITLE=Debian on the Browser
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.webtop-rtr.entrypoints=websecure"
      - "traefik.http.routers.webtop-rtr.rule=Host(`webtop.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.webtop-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.webtop-rtr.service=webtop-svc"
      - "traefik.http.services.webtop-svc.loadbalancer.server.port=3000"

  darktable:
    container_name: darktable
    image: lscr.io/linuxserver/darktable:latest
    restart: $DESKTOP_IMAGES_RESTART_POLICY
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $MEDIADIR/Photos:/photos
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.darktable-rtr.entrypoints=websecure"
      - "traefik.http.routers.darktable-rtr.rule=Host(`darktable.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.darktable-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.darktable-rtr.service=darktable-svc"
      - "traefik.http.services.darktable-svc.loadbalancer.server.port=3000"

  firefox:
    container_name: firefox
    image: firefox:latest
    build:
      context: $DESKTOPAPPDOCKERFILES/Firefox
      dockerfile: $DESKTOPAPPDOCKERFILES/Firefox/Dockerfile
    restart: $DESKTOP_IMAGES_RESTART_POLICY
    shm_size: "1gb"  #optional
    devices:  #optional
      - /dev/dri:/dev/dri
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/firefox:/config
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # For watchtower
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.firefox-rtr.entrypoints=websecure"
      - "traefik.http.routers.firefox-rtr.rule=Host(`firefox.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.firefox-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.firefox-rtr.service=firefox-svc"
      - "traefik.http.services.firefox-svc.loadbalancer.server.port=3000"

  # NOTE: Recent file location: /config/.local/share/okular/docdata/
  okular:
    container_name: okular
    image: okular:latest
    build:
      context: $DESKTOPAPPDOCKERFILES/Okular
      dockerfile: $DESKTOPAPPDOCKERFILES/Okular/Dockerfile
    restart: $DESKTOP_IMAGES_RESTART_POLICY
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/okular:/config
      - $MEDIADIR/Books:/books
      - $HARDDISKROOTDIR/School/Thesis/Papers:/thesis
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    labels:
      - "com.centurylinklabs.watchtower.enable=false" # For watchtower
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.okular-rtr.entrypoints=websecure"
      - "traefik.http.routers.okular-rtr.rule=Host(`okular.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.okular-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.okular-rtr.service=okular-svc"
      - "traefik.http.services.okular-svc.loadbalancer.server.port=3000"