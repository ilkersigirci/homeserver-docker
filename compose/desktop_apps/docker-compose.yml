  #   labels:
  #     - "traefik.enable=true"
  #     ## HTTP Routers
  #     - "traefik.http.routers.kasmvnc-rtr.entrypoints=websecure"
  #     - "traefik.http.routers.kasmvnc-rtr.rule=Host(`kasmvnc.$DOMAINNAME`)"
  #     ## Middlewares
  #     - "traefik.http.routers.kasmvnc-rtr.middlewares=chain-no-auth@file"
  #     - "traefik.http.middlewares.kasmauth.headers.customrequestheaders.Authorization=Basic a2FzbV91c2VyOnlvdXJtb3N0YXdlc29tZXBhc3N3b3JkaGVyZQ=="
