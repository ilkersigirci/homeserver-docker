name: dekstop_apps

networks:
  t3_proxy:
    external: true
  internal:
    name: internal
    driver: bridge

services:
  ################################################# KASM #################################################
  kasm:
    container_name: kasm
    image: lscr.io/linuxserver/kasm:latest
    restart: $DESKTOP_IMAGES_RESTART_POLICY
    privileged: true
    networks:
      - t3_proxy
    volumes:
      - $DOCKERDIR/appdata/kasm/opt:/opt
    #   - /path/to/profiles:/profiles #optional
    #   - /dev/input:/dev/input #optional
    #   - /run/udev/data:/run/udev/data #optional
    ports:
      - 3030:3000
      # - 4443:4443
    # expose:
    #   - 4443
    environment:
      - KASM_PORT=4433
      - TZ=$TZ
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.kasm-rtr.entrypoints=websecure"
      - "traefik.http.routers.kasm-rtr.rule=Host(`kasm.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.kasm-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.kasm-rtr.service=kasm-svc"
      - "traefik.http.services.kasm-svc.loadbalancer.server.port=4443"
      # NOTE: https://docs.linuxserver.io/faq#strict-proxy
      - traefik.http.services.kasm-svc.loadbalancer.serverstransport=ignorecert@file
      - traefik.http.services.kasm-svc.loadbalancer.server.scheme=https

