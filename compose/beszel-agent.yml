services:
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: $MAINTENANCE_RESTART_POLICY
    # network_mode: host
    networks:
      - t3_proxy
      - socket_proxy
    volumes:
      - $DOCKERDIR/appdata/beszel_agent:/var/lib/beszel-agent
    #   # monitor other disks / partitions by mounting a folder in /extra-filesystems
    #   # - /mnt/d:/extra-filesystems/sda1:ro
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      LISTEN: 45876
      HUB_URL: https://beszel.gpu.$BASE_DOMAINNAME
      TOKEN: $BESZEL_AGENT_TOKEN
      KEY: $BESZEL_KEY
    profiles:
      - monitoring
    healthcheck:
      test: ['CMD', '/agent', 'health']
      start_period: 5s
      interval: 1m
