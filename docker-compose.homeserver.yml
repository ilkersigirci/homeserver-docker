name: homeserver

networks:
  default:
    driver: bridge
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: enp18s0
    ipam:
      config:
        - subnet: "192.168.1.0/24"
          ip_range: "192.168.1.19/32"
          gateway: "192.168.1.1"

########################### SECRETS
secrets:
  # authelia_jwt_secret:
  #   file: $DOCKERDIR/secrets/authelia_jwt_secret
  # authelia_session_secret:
  #   file: $DOCKERDIR/secrets/authelia_session_secret
  # authelia_storage_encryption_key:
  #   file: $DOCKERDIR/secrets/authelia_storage_encryption_key
  cf_dns_api_token:
    file: $DOCKERDIR/secrets/cf_dns_api_token
  # firefly_app_key:
