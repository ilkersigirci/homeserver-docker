[rpis]
# Replace these IP addresses with the actual IPs of your Raspberry Pis
rpi1 ansible_host=192.168.1.101
rpi2 ansible_host=192.168.1.102
rpi3 ansible_host=192.168.1.103

[rpis:vars]
ansible_user=ilker
# Common variables
repo_url=git@github.com:ilkersigirci/homeserver-docker.git
compose_file=docker-compose.rpi.yml

# If you haven't set up SSH keys yet, you can uncomment the line below to ask for password
# ansible_ssh_pass=yourpassword
# Or use --ask-pass when running the playbook
