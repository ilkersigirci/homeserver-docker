---
- name: Read the mapped fields on the controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/read_fields.py"
    stdin: "{{ homeserver_rbw_env_default_mapping | combine(homeserver_rbw_env_custom_mapping) | to_json }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: homeserver_rbw_env_result
  no_log: true
  failed_when: false

- name: Report a vault lookup failure
  ansible.builtin.fail:
    msg: "{{ homeserver_rbw_env_result.stderr | default('Could not run the controller vault reader.', true) }}"
  when: homeserver_rbw_env_result.rc | default(1) != 0

- name: Resolve the managed user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Render the Compose environment
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ homeserver_rbw_env_file_path }}"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "{{ homeserver_rbw_env_file_mode }}"
  no_log: true
  diff: false
