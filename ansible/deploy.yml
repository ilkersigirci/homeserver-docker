---
- name: Deploy Docker Compose Updates
  hosts: all
  become: true
  become_user: "{{ user_name }}"
  vars:
    user_name: ilker
    repo_path: "/home/{{ user_name }}/docker"
    # Use inventory variable if defined, otherwise default to hostname-based file
    compose_file: "{{ hostvars[inventory_hostname].compose_file | default('docker-compose.' + inventory_hostname + '.yml') }}"

  tasks:
    - name: Pull latest changes from git
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: true
        accept_hostkey: true
      register: git_output

    - name: Display git result
      ansible.builtin.debug:
        msg: "Repo updated: {{ git_output.changed }}"

    - name: Update and Restart Docker Containers
      ansible.builtin.shell: |
        docker compose -f {{ compose_file }} up -d --remove-orphans
      args:
        chdir: "{{ repo_path }}"
      register: compose_output
      changed_when: "'Created' in compose_output.stderr or 'Recreated' in compose_output.stderr or 'Started' in compose_output.stderr"
