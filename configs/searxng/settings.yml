# see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings: true
server:
  secret_key: "searxng" # TODO: Find a way to use env var for this
  limiter: false  # enable this when running the instance for a public usage on the internet
  image_proxy: true
ui:
  static_use_hash: true
valkey:
  url: valkey://searxng-valkey:6379/0
# Custom
search:
  default_lang: all
  formats:
    - html
    - json
engines:
  - name: brave
    disabled: false
    weight: 2
  - name: gmx
    disabled: true
  - name: seznam
    disabled: false
    weight: 2
  - name: bing
    disabled: false
    weight: 0.5
  - name: duckduckgo
    disabled: true
  - name: google
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true
  - name: startpage
    disabled: true
