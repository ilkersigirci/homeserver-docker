# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/pyroscope-config.yaml
server:
  grpc_listen_port: 9097 # to avoid conflict with tempo

metastore:
  address: 127.0.0.1:9097
  min_ready_duration: 1s
  data_dir: /data/pyroscope/metastore/data
  raft:
    dir: /data/pyroscope/metastore/raft
    snapshots_dir: /data/pyroscope/metastore/raft

# Keep the legacy profile reader alongside the v2 storage components.
architecture_storage: v1-v2-dual

storage:
  backend: filesystem
  filesystem:
    dir: /data/pyroscope/shared

segment_writer:
  lifecycler:
    min_ready_duration: 1s

query_backend:
  address: 127.0.0.1:9097

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    min_ready_duration: 1s

pyroscopedb:
  data_path: "/data/pyroscope"

compactor:
  data_dir: /data/pyroscope/compactor

store_gateway:
  bucket_store:
    sync_dir: /data/pyroscope/sync
