# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/otelcol-config.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  deltatocumulative/chhoto_url:
    max_stale: 2160h
    max_streams: 50000
  filter/chhoto_url_redirect:
    error_mode: ignore
    logs:
      log_record:
        - not (attributes["ServiceName"] == "chhoto-url-svc@docker" and attributes["RequestMethod"] == "GET" and attributes["DownstreamStatus"] == 308 and IsMatch(attributes["RequestHost"], "^go(\\.[a-z0-9-]+)?\\.ilkerflix\\.com$") and IsMatch(attributes["RequestPath"], "^/[a-z0-9]{4}$"))
  interval/chhoto_url:
    interval: 30s
  transform/chhoto_url_slug:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["chhoto_url_hit"], true)
          - set(attributes["slug"], ExtractPatterns(attributes["RequestPath"], "^/(?P<slug>[a-z0-9]{4})$")["slug"])
          - set(attributes["request_host"], attributes["RequestHost"])

exporters:
  otlphttp/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

connectors:
  count/chhoto_url:
    logs:
      chhoto_url_hits_total:
        description: Count of Chhoto URL redirect hits by slug.
        conditions:
          - attributes["chhoto_url_hit"] == true
        attributes:
          - key: slug
          - key: request_host
            default_value: unknown

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
      #exporters: [otlphttp/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlphttp/metrics]
      #exporters: [otlphttp/metrics,debug/metrics]
    metrics/chhoto_url:
      receivers: [count/chhoto_url]
      processors: [deltatocumulative/chhoto_url, interval/chhoto_url, batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
      #exporters: [otlphttp/logs,debug/logs]
    logs/chhoto_url:
      receivers: [otlp]
      processors: [filter/chhoto_url_redirect, transform/chhoto_url_slug, batch]
      exporters: [count/chhoto_url]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]
