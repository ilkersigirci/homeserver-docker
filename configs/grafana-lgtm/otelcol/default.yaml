# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/otelcol-config.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"
  file_storage:
    directory: /data/otelcol
    create_directory: true
    timeout: 10s
    fsync: true
    # Cap each exporter database at 128 MiB; compaction needs extra disk space.
    max_size: 134217728
    compaction:
      directory: /data/otelcol/compaction
      on_rebound: true
      cleanup_on_start: true
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10
      check_interval: 5s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
  delta_to_cumulative/chhoto_url:
    max_stale: 2160h
    max_streams: 50000
  filter/chhoto_url_redirect:
    error_mode: ignore
    logs:
      log_record:
        - not (attributes["ServiceName"] == "chhoto-url-svc@docker" and attributes["RequestMethod"] == "GET" and attributes["DownstreamStatus"] == 308 and IsMatch(attributes["RequestHost"], "^go(\\.[a-z0-9-]+)?\\.ilkerflix\\.com$") and IsMatch(attributes["RequestPath"], "^/[a-z0-9]{4}$"))
  interval/chhoto_url:
    interval: 30s
  transform/chhoto_url_slug:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["chhoto_url_hit"], true)
          - set(attributes["slug"], ExtractPatterns(attributes["RequestPath"], "^/(?P<slug>[a-z0-9]{4})$")["slug"])
          - set(attributes["request_host"], attributes["RequestHost"])

exporters:
  # Persist before batching so queue failures reach upstream OTLP senders.
  # Queue budgets count serialized bytes, not process RAM or database file sizes.
  otlphttp/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 33554432
      # Preserve export order when retrying older metric samples.
      num_consumers: 1
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 1h
  otlphttp/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 33554432
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 1h
  otlphttp/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
    # Split large log requests below Loki's gRPC limit.
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 33554432
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 1h
  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
    sending_queue:
      storage: file_storage
      sizer: bytes
      queue_size: 33554432
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 1h
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

connectors:
  count/chhoto_url:
    logs:
      chhoto_url_hits_total:
        description: Count of Chhoto URL redirect hits by slug.
        conditions:
          - attributes["chhoto_url_hit"] == true
        attributes:
          - key: slug
          - key: request_host
            default_value: unknown

service:
  extensions: [health_check, file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/traces]
      #exporters: [otlphttp/traces,debug/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter]
      exporters: [otlphttp/metrics]
      #exporters: [otlphttp/metrics,debug/metrics]
    metrics/chhoto_url:
      receivers: [count/chhoto_url]
      processors: [memory_limiter, delta_to_cumulative/chhoto_url, interval/chhoto_url]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlphttp/logs]
      #exporters: [otlphttp/logs,debug/logs]
    logs/chhoto_url:
      receivers: [otlp]
      processors: [memory_limiter, filter/chhoto_url_redirect, transform/chhoto_url_slug, batch]
      exporters: [count/chhoto_url]
    profiles:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/profiles]
