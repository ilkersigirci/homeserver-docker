# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/tempo-config.yaml
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
    block:
      # Keep TraceQL's environment and host filters on dedicated columns.
      parquet_dedicated_columns:
        - name: service.namespace
          type: string
          scope: resource
        - name: deployment.environment.name
          type: string
          scope: resource
        - name: host.name
          type: string
          scope: resource

backend_worker:
  compaction:
    # Keep this explicit so trace retention is not an undocumented default.
    block_retention: 336h

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service.namespace
        - deployment.environment.name
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
