# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/tempo-config.yaml
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

query_frontend:
  search:
    # The dashboard retains traces for 90 days and must be able to search that range.
    max_duration: 2160h

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
    # Discover backend blocks even when the tenant index is stale.
    blocklist_poll: 5m
    blocklist_poll_stale_tenant_index: 10m
    blocklist_poll_fallback: true
    block:
      # Keep the dashboard's common TraceQL filters and projected values on
      # dedicated columns.
      parquet_dedicated_columns:
        - name: service.namespace
          type: string
          scope: resource
        - name: deployment.environment.name
          type: string
          scope: resource
        - name: host.name
          type: string
          scope: resource
        - name: user_agent.original
          type: string
          scope: span
        - name: session.id
          type: string
          scope: span

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 2160h

backend_worker:
  compaction:
    # Keep 90 days of trace blocks.
    block_retention: 2160h

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service.namespace
        - deployment.environment.name
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      # Match the OpenTelemetry Prometheus exemplar label convention.
      trace_id_label_name: trace_id
      processors: [service-graphs, span-metrics]
