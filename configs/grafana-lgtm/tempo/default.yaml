# From: https://github.com/grafana/docker-otel-lgtm/blob/main/docker/tempo-config.yaml
usage_report:
  reporting_enabled: false

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

query_frontend:
  search:
    # Allow searches across the full 30-day trace retention window.
    max_duration: 720h

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks
    # Discover backend blocks even when the tenant index is stale.
    blocklist_poll: 5m
    blocklist_poll_stale_tenant_index: 10m
    blocklist_poll_fallback: true
    block:
      # Store attributes that dashboards filter or select on in dedicated
      # columns. Changes apply only to blocks written afterwards.
      parquet_dedicated_columns:
        - name: service.namespace
          type: string
          scope: resource
        - name: deployment.environment.name
          type: string
          scope: resource
        - name: host.name
          type: string
          scope: resource
        - name: user_agent.original
          type: string
          scope: span
        - name: session.id
          type: string
          scope: span
        - name: gen_ai.operation.name
          type: string
          scope: span
        - name: gen_ai.conversation.id
          type: string
          scope: span

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 720h

backend_worker:
  compaction:
    # Keep 30 days of trace blocks.
    block_retention: 720h

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - service.namespace
        - deployment.environment.name
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    read:
      # Tempo trims leading zeros from search results by default, which breaks
      # links that look up the exact ID, such as Langfuse's.
      left_pad_trace_ids: true
    metrics_generator:
      # Match the OpenTelemetry Prometheus exemplar label convention.
      trace_id_label_name: trace_id
      processors: [service-graphs, span-metrics]
