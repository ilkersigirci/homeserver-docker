# Model definitions are managed through LiteLLM's native API or Admin UI.
model_list: []

general_settings:
  # OIDC access tokens act as the Internal User named by `sub`; master and
  # virtual keys keep native auth (Dockerfiles/LiteLLM/ARCHITECTURE.md).
  enable_jwt_auth: true
  litellm_jwtauth:
    user_id_jwt_field: sub
    user_id_upsert: true
    end_user_id_jwt_field: sub
    custom_validate: access_token.validate_claims
    enforce_rbac: true
    # Disable LiteLLM's built-in `litellm_proxy_admin` token scope; administer
    # through the Admin UI or the master key.
    admin_allowed_routes: []
  # Tokens reach inference, model metadata, and MCP tools, whatever the user's role.
  role_permissions:
    - role: internal_user
      routes: [openai_routes, model_info_routes, mcp_inference_routes, "/v1/models/*", "/models/*"]
  fail_closed_budget_enforcement: true
  ui_access_mode: admin_only
  disable_env_credential_login: true

litellm_settings:
  # A first OIDC request or UI SSO login creates a user with a zero budget.
  # Empty user models allow all models; set a list in the UI to restrict access.
  default_internal_user_params:
    max_budget: 0
  # Record who changed keys, users, teams, and models in LiteLLM_AuditLog. The
  # /audit read API is enterprise-only, so query the table directly.
  store_audit_logs: true
  # Preserve W3C context through LiteLLM's model-call span to the provider.
  forward_traceparent_to_llm_provider: true
  # Langflow flows use the caller's X-Langflow-Session-Id as their chat session.
  # Name their deployments langflow/<flow>; only those receive caller x- headers.
  model_group_settings:
    forward_client_headers_to_llm_api: ["langflow/*"]

# Keep metric cardinality bounded to stable GenAI dimensions. Model names stay
# available on model-call spans even when excluded from metric labels.
callback_settings:
  otel:
    attributes:
      include_list:
        - gen_ai.operation.name
        - gen_ai.provider.name
