  ################# EXTERNAL SERVICES #################
  - name: check-domain-expiration
    group: External
    url: "https://$DOMAINNAME/"
    interval: 1h
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"

  ################# REMOTESERVER #################
  # - name: Postgres
  #   group: Remoteserver
  #   url: "tcp://gatus-db:5432"
  #   interval: 5m
  #   conditions:
  #     - "[CONNECTED] == true"

  - name: AdguardHome-DNS
    group: Remoteserver
    url: "100.64.0.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "rpi0"
      query-type: "A"
    conditions:
      - "[BODY] == 100.64.0.12"
      - "[DNS_RCODE] == NOERROR"

  - name: $DOMAINNAME-DNS
    group: Remoteserver
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "homepage.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 100.64.0.1"
      - "[DNS_RCODE] == NOERROR"

  - name: Pocketid-Remoteserver
    <<: *https-default
    group: Remoteserver
    interval: 1h
    url: "https://pocketid.$DOMAINNAME"

  ################# HOME #################
  - name: DNS - home
    group: Home
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 1h
    dns:
      query-name: "homepage.home.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 100.64.0.12"
      - "[DNS_RCODE] == NOERROR"

  - name: Pocketid - home
    <<: *http-default
    group: Home
    interval: 1h
    url: "http://100.64.0.12:1000"

  - name: Smarthome - home
    <<: *https-default
    group: Home
    interval: 1h
    url: "https://smarthome.home.$DOMAINNAME"

  ################# RPI1 #################
  - name: LocalDNS - home
    group: RPI1
    url: "100.64.0.13" # Address of the DNS server to use
    interval: 1h
    dns:
      query-name: "homepage.home.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 192.168.2.12"
      - "[DNS_RCODE] == NOERROR"

  - name: LocalDNS - rpi1
    group: RPI1
    url: "100.64.0.13" # Address of the DNS server to use
    interval: 1h
    dns:
      query-name: "homepage.rpi1.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 192.168.2.13"
      - "[DNS_RCODE] == NOERROR"

  - name: LocalDNS - gpu
    group: RPI1
    url: "100.64.0.13" # Address of the DNS server to use
    interval: 1h
    dns:
      query-name: "homepage.gpu.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 192.168.2.9"
      - "[DNS_RCODE] == NOERROR"

  ################# GPU #################

  - name: DNS - gpu
    <<: *maintenance-window-default
    group: GPU
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 1h
    dns:
      query-name: "homepage.gpu.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 100.64.0.9"
      - "[DNS_RCODE] == NOERROR"

  - name: Homepage-GPU-PING
    <<: [*ping-default, *maintenance-window-default]
    group: GPU
    interval: 1h
    url: "icmp://homepage.gpu.$DOMAINNAME"

  - name: Jellyfin-GPU
    <<: [*https-default, *maintenance-window-default]
    group: GPU
    interval: 1h
    url: "https://jellyfin.gpu.$DOMAINNAME"

  - name: Immich-GPU
    <<: [*https-default, *maintenance-window-default]
    group: GPU
    interval: 1h
    url: "https://photos.gpu.$DOMAINNAME"

  - name: vllm/Qwen3.6-35B-A3B
    <<: *ai-gateway-model-default

  - name: vllm/gemma-4-31b-it
    <<: *ai-gateway-model-default

