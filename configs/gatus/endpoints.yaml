######### Default Templates #################
http-default: &http-default
  group: Http-Default-Group
  interval: 30s
  client:
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
  alerts:
    - type: gotify
      send-on-resolved: true

https-default: &https-default
  group: Https-Default-Group
  interval: 30s
  client:
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 48h"
  alerts:
    - type: gotify
      send-on-resolved: true

ping-default: &ping-default
  group: Ping-Default-Group
  interval: 30s
  conditions:
    - "[CONNECTED] == true"
  alerts:
    - type: gotify
      send-on-resolved: true

maintenance-window-default: &maintenance-window-default
  start: 00:00
  duration: 8h
  timezone: "Europe/Istanbul"
  # every:
  #   - Saturday
  #   - Sunday

ai-gateway-model-default: &ai-gateway-model-default
  <<: *maintenance-window-default
  group: AI
  interval: 1h
  url: "$AIGATEWAY_BASE_URL/chat/completions"
  method: POST
  client:
    timeout: 90s
  headers:
    Authorization: "Bearer $AIGATEWAY_API_KEY"
    Content-Type: "application/json"
  body: |
    {
      "model": "[ENDPOINT_NAME]",
      "messages": [
        {
          "role": "user",
          "content": "Reply with OK only."
        }
      ],
      "max_tokens": 4,
      "temperature": 0
    }
  conditions:
    - "[STATUS] == 200"
    - "[BODY].choices[0].message.content != ''"
  alerts:
    - type: gotify
      send-on-resolved: true

