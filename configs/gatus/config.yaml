######### Default Configurations #################

https-default: &https-default
  group: External
  interval: 30s
  client:
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 48h"
  alerts:
    - type: gotify
      send-on-resolved: true

ping-default: &ping-default
  group: External
  interval: 30s
  conditions:
    - "[CONNECTED] == true"
  alerts:
    - type: gotify
      send-on-resolved: true

###################################################

# storage:
