alerting:
  # telegram:
  #   token: $TELEGRAM_BOT_TOKEN
  #   id: $TELEGRAM_CHAT_ID
  gotify:
    server-url: https://gotify.$DOMAINNAME
    token: $GOTIFY_NOTIFICATION_TOKEN
    priority: 10

ui:
  custom-css: |
    /* Apply Catppuccin Frappe theme to match Homepage */
    :root {
      --background-color: hsl(240, 13%, 14%);
      --primary-color: hsl(222, 74%, 74%);
      --positive-color: hsl(96, 44%, 68%);
      --negative-color: hsl(358, 100%, 68%);
    }
    
    /* Main background */
    body {
      background-color: var(--background-color) !important;
      color: var(--primary-color) !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    
    /* Container background */
    .dark\:bg-gray-800 {
      background-color: var(--background-color) !important;
    }
    
    /* Main container */
    .container {
      background-color: var(--background-color) !important;
      border-color: hsl(240, 13%, 20%) !important;
    }
    
    /* Success status color */
    .bg-success {
      background-color: var(--positive-color) !important;
    }
    
    /* Endpoint groups */
    .endpoint-group {
      background-color: hsl(240, 13%, 18%) !important;
      border-color: hsl(240, 13%, 25%) !important;
    }
    
    /* Individual endpoints */
    .endpoint {
      background-color: hsl(240, 13%, 16%) !important;
      border-color: hsl(240, 13%, 25%) !important;
      color: var(--primary-color) !important;
    }
    
    /* Endpoint hover effect */
    .endpoint:hover {
      background-color: hsl(240, 13%, 20%) !important;
    }
    
    /* Links */
    .endpoint a {
      color: var(--primary-color) !important;
    }
    
    .endpoint a:hover {
      color: hsl(222, 74%, 80%) !important;
    }
    
    /* Text colors */
    .text-gray-500 {
      color: hsl(222, 74%, 65%) !important;
    }
    
    .dark\:text-gray-200 {
      color: var(--primary-color) !important;
    }
    
    /* Settings panel */
    #settings {
      background-color: hsl(240, 13%, 18%) !important;
      border-color: hsl(240, 13%, 25%) !important;
    }
    
    /* Settings select */
    #settings select {
      background-color: hsl(240, 13%, 16%) !important;
      color: var(--primary-color) !important;
      border-color: hsl(240, 13%, 25%) !important;
    }
    
    /* Buttons */
    button {
      background-color: hsl(240, 13%, 18%) !important;
      color: var(--primary-color) !important;
      border-color: hsl(240, 13%, 25%) !important;
    }
    
    button:hover {
      background-color: hsl(240, 13%, 22%) !important;
    }
    
    /* Status indicators - keep success green */
    .status-success {
      background-color: var(--positive-color) !important;
    }
    
    /* Error status */
    .status-failure {
      background-color: var(--negative-color) !important;
    }
    
    /* Green operational indicator */
    .text-green-600 {
      color: var(--positive-color) !important;
    }
    
    /* Hide scrollbars to match Homepage */
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    ::-webkit-scrollbar {
      display: none;
    }

endpoints:
  # - name: front-end
  #   group: core
  #   url: "https://twin.sh/health"
  #   interval: 5m
  #   conditions:
  #     - "[STATUS] == 200"
  #     - "[BODY].status == UP"
  #     - "[RESPONSE_TIME] < 150"

  ################# INTERNAL SERVICES #################
  - name: Postgres
    group: Internal
    url: "tcp://gatus-db:5432"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"

  - name: AdguardHome-DNS
    group: Internal
    url: "10.8.0.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "wghomeserver"
      query-type: "A"
    conditions:
      - "[BODY] == 10.8.0.3"
      - "[DNS_RCODE] == NOERROR"

  - name: $DOMAINNAME-DNS
    group: Internal
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "homepage.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 10.8.0.1"
      - "[DNS_RCODE] == NOERROR"

  ################# EXTERNAL SERVICES #################
  - name: check-domain-expiration
    group: External
    url: "https://$DOMAINNAME/"
    interval: 1h
    conditions:
      - "[DOMAIN_EXPIRATION] > 720h"

  #### GPU ####

  - name: gpu.$DOMAINNAME-DNS
    group: External
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "homepage.gpu.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 10.8.0.3"
      - "[DNS_RCODE] == NOERROR"

  - name: Homepage-GPU-PING
    <<: *ping-default
    url: "icmp://homepage.gpu.$DOMAINNAME"

  - name: Homepage-GPU
    <<: *https-default
    # group: GPU
    url: "https://homepage.gpu.$DOMAINNAME"

  - name: Jellyfin-GPU
    <<: *https-default
    # group: GPU
    url: "https://jellyfin.gpu.$DOMAINNAME"

  - name: Immich-GPU
    <<: *https-default
    # group: GPU
    url: "https://photos.gpu.$DOMAINNAME"

  #### RPI ####

  - name: rpi.$DOMAINNAME-DNS
    group: External
    url: "1.1.1.1" # Address of the DNS server to use
    interval: 30s
    dns:
      query-name: "homepage.rpi.$DOMAINNAME"
      query-type: "A"
    conditions:
      - "[BODY] == 10.8.0.7"
      - "[DNS_RCODE] == NOERROR"

  - name: Homepage-RPI-PING
    <<: *ping-default
    url: "icmp://homepage.rpi.$DOMAINNAME"

  - name: Notes-RPI
    <<: *https-default
    # group: RPI
    url: "https://notes.rpi.$DOMAINNAME"