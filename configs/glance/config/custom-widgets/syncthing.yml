- type: custom-api
  title: "Syncthing"
  cache: 1m
  headers:
    X-API-Key: ${SYNCTHING_API_KEY}
  # Main request: Get connections to count connected devices
  url: "${SYNCTHING_URL}/rest/system/connections"
  
  subrequests:
    completion:
      url: "${SYNCTHING_URL}/rest/db/completion"
      headers: { X-API-Key: ${SYNCTHING_API_KEY} }
    errors:
      url: "${SYNCTHING_URL}/rest/system/error"
      headers: { X-API-Key: ${SYNCTHING_API_KEY} }
    notes:
      url: "${SYNCTHING_URL}/rest/db/status"
      parameters: { folder: "${SYNCTHING_NOTES_FOLDER_ID}" }
      headers: { X-API-Key: ${SYNCTHING_API_KEY} }

  template: |
    {{ $connections := .JSON }}
    {{ $completion := .Subrequest "completion" }}
    {{ $errors := .Subrequest "errors" }}
    {{ $notes := .Subrequest "notes" }}
    
    {{ if or (ne .Response.StatusCode 200) (ne $completion.Response.StatusCode 200) }}
      <p class="text-danger">⚠️ Syncthing API unreachable</p>
    {{ else }}
      <div class="size-h6 margin-bottom-5">GENERAL</div>
      <div class="flex justify-between text-center">
        <div>
          {{/* Count connected devices by iterating */}}
          {{ $devs := $connections.Array "connections.@values" }}
          {{ $connected := 0.0 }}
          {{ range $devs }}
            {{ if .Bool "connected" }}{{ $connected = add $connected 1.0 }}{{ end }}
          {{ end }}
          <div class="color-highlight size-h3">
            {{ printf "%.0f" $connected }} / {{ len $devs }}
          </div>
          <div class="size-h6">DEVICES</div>
        </div>
        <div>
          <div class="color-highlight size-h3">
            {{ printf "%.0f" ($completion.JSON.Float "completion") }}%
          </div>
          <div class="size-h6">SYNCED</div>
        </div>
        <div>
          <div class="color-highlight size-h3">
            {{ $errors.JSON.Int "errors.#" }}
          </div>
          <div class="size-h6">ERRORS</div>
        </div>
        <div>
          <div class="color-highlight size-h3">
            {{/* Convert bytes to GB (1073741824) */}}
            {{ div ($completion.JSON.Float "globalBytes") 1073741824 | printf "%.1f" }} GB
          </div>
          <div class="size-h6">STORAGE</div>
        </div>
      </div>

      {{ if eq $notes.Response.StatusCode 200 }}
        <div class="margin-top-15">
          <div class="size-h6 margin-bottom-5">NOTES</div>
          <div class="flex justify-between text-center">
            <div style="width: 33%">
              <div class="color-highlight size-h3">
                {{ $notes.JSON.Int "globalFiles" }}
              </div>
              <div class="size-h6">FILES</div>
            </div>
            <div style="width: 33%">
              <div class="color-highlight size-h3">
                {{ div ($notes.JSON.Float "globalBytes") 1048576 | printf "%.1f" }} MB
              </div>
              <div class="size-h6">SIZE</div>
            </div>
            <div style="width: 33%">
              <div class="color-highlight size-h3">
                {{ $inSync := $notes.JSON.Float "inSyncBytes" }}
                {{ $total := $notes.JSON.Float "globalBytes" }}
                {{ if eq $total 0.0 }}100%{{ else }}{{ mul (div $inSync $total) 100 | printf "%.0f" }}%{{ end }}
              </div>
              <div class="size-h6">SYNCED</div>
            </div>
          </div>
        </div>
      {{ end }}
    {{ end }}