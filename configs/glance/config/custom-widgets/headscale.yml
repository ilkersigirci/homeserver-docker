- type: custom-api
  title: Headscale
  title-url: https://headscale.ilkerflix.com/admin
  url: https://headscale.ilkerflix.com/api/v1/node
  headers:
    Authorization: Bearer ${HEADSCALE_API_KEY}
  cache: 10m
  template: |
    {{/* User Variables */}}
    {{/* Set to true if you'd like an indicator for online devices */}}
    {{ $enableOnlineIndicator := true }}

    <style>
      .device-info-container {
        position: relative;
        overflow: hidden;
        height: 1.5em;
      }

      .device-info {
        display: flex;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .device-ip {
        position: absolute;
        top: 0;
        left: 0;
        transform: translateY(-100%);
        opacity: 0;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .device-info-container:hover .device-info {
        transform: translateY(100%);
        opacity: 0;
      }

      .device-info-container:hover .device-ip {
        transform: translateY(0);
        opacity: 1;
      }

      .update-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-primary);
        display: inline-block;
        margin-left: 4px;
        vertical-align: middle;
      }

      .offline-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-negative);
        display: inline-block;
        margin-left: 4px;
        vertical-align: middle;
      }

      .online-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-positive);
        display: inline-block;
        margin-left: 4px;
        vertical-align: middle;
      }

      .device-name-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .indicators-container {
        display: flex;
        align-items: center;
        gap: 4px;
      }
    </style>
    <ul class="list list-gap-10 collapsible-container" data-collapse-after="7">
      {{ range .JSON.Array "nodes" }}
      <li>
        <div class="flex items-center gap-10">
          <div class="device-name-container grow">
            <span class="size-h4 block text-truncate color-primary">
              {{ .String "givenName" }}
            </span>
            <div class="indicators-container">
              {{ if .Bool "online" }}
                {{ if $enableOnlineIndicator }}
                  <span class="online-indicator" data-popover-type="text" data-popover-text="Online"></span>
                {{ end }}
              {{ else }}
                {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
                {{ $lastSeenLocal := $lastSeen.In now.Location }}
                <span class="offline-indicator" data-popover-type="text"
                  data-popover-text="Offline - Last seen {{ $lastSeenLocal.Format " Jan 2 3:04pm" }}"></span>
              {{ end }}
            </div>
          </div>
        </div>
        <div class="device-info-container">
          <ul class="list-horizontal-text device-info">
            <li>{{ .String "name" }}</li>
            <li>{{ .String "user.name" }}</li>
          </ul>
          <div class="device-ip">
            {{ .String "ipAddresses.0"}}
          </div>
        </div>
      </li>
      {{ end }}
    </ul>
