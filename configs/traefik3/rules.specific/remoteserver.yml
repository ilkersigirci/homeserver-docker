http:
  routers:
    webfinger-rtr:
      rule: "Host(`{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - middlewares-webfinger
      service: webfinger-svc

    jellyfin-redirect-rtr:
      rule: "Host(`jellyfin.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - jellyfin-redirect
      service: noop@internal

    # jellyfin-rtr:
    #   rule: "Host(`jellyfin.gpu.{{env "DOMAINNAME"}}`)"
    #   entryPoints:
    #     - websecure
    #   middlewares:
    #     # - chain-no-auth-relaxed
    #   service: jellyfin-svc

    # wireguard-rtr:
    #   rule: "Host(`wireguard.{{env "DOMAINNAME"}}`)"
    #   entryPoints:
    #     - websecure
    #   middlewares:
    #     - chain-no-auth-relaxed
    #   service: wireguard-svc

    pocket-id-rtr:
      rule: "Host(`pocketid.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: pocket-id-svc

    immich-public-proxy-rtr:
      rule: "Host(`share.{{env "DOMAINNAME"}}`) && PathPrefix(`/share`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: immich-public-proxy-svc
  
  middlewares:
    jellyfin-redirect:
      redirectRegex:
        regex: "^https://jellyfin\\.(.+)"
        replacement: "https://jellyfin.gpu.${1}"
        permanent: true
  
  services:
    webfinger-svc:
      loadBalancer:
        servers:
          - url: "http://DUMMY"

    # jellyfin-svc:
    #   loadBalancer:
    #     servers:
    #       # - url: "http://10.8.0.3:8096" # Wiregurd
    #       # - url: "http://100.64.0.3:8096" # Tailscale

    # wireguard-svc:
    #   loadBalancer:
    #     servers:
    #       - url: "http://{{env "REMOTE_SERVER_PRIVATE_IP"}}:51821" # IP of the host machine

    pocket-id-svc:
      loadBalancer:
        servers:
          # - url: "http://10.8.0.3:1411"
          - url: "http://100.64.0.3:1411"
        # healthCheck:
        #   path: "/healthz"
        #   interval: "30s"
        #   timeout: "5s"

    immich-public-proxy-svc:
      loadBalancer:
        servers:
          # - url: "http://10.8.0.3:8097"
          - url: "http://100.64.0.3:8097"
