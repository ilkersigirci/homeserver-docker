http:
  serversTransports:
    # NOTE: Proxmox redirect requests to https which causes redirect loop with traefik. This fixes it.
    proxmox-transport:
      serverName: ""
      insecureSkipVerify: true

  routers:
    webfinger-rtr:
      rule: "Host(`{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - middlewares-webfinger
      service: webfinger-svc

    jellyfin-redirect-rtr:
      rule: "Host(`jellyfin.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - jellyfin-redirect
      service: noop@internal

    # wireguard-rtr:
    #   rule: "Host(`wireguard.{{env "DOMAINNAME"}}`)"
    #   entryPoints:
    #     - websecure
    #   middlewares:
    #     - chain-no-auth-relaxed
    #   service: wireguard-svc

    pocket-id-rtr:
      rule: "Host(`pocketid.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: pocket-id-svc

    splitpro-rtr:
      rule: "Host(`split.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
        # - chain-tinyauth-relaxed
      service: splitpro-svc

    nas-rtr:
      rule: "Host(`nas.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: nas-svc

    immich-public-proxy-rtr:
      rule: "Host(`share.{{env "DOMAINNAME"}}`) && PathPrefix(`/share`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: immich-public-proxy-svc

    homeserver-rtr:
      rule: "Host(`homeserver.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: homeserver-svc

    openwrt-rtr:
      rule: "Host(`openwrt.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: openwrt-svc
  
  middlewares:
    jellyfin-redirect:
      redirectRegex:
        regex: "^https://jellyfin\\.(.+)"
        replacement: "https://jellyfin.gpu.${1}"
        permanent: true
  
  services:
    webfinger-svc:
      loadBalancer:
        servers:
          - url: "http://DUMMY"

    # jellyfin-svc:
    #   loadBalancer:
    #     servers:
    #       # - url: "http://10.8.0.3:8096" # Wiregurd
    #       # - url: "http://100.64.0.19:8096" # Tailscale

    # wireguard-svc:
    #   loadBalancer:
    #     servers:
    #       - url: "http://{{env "REMOTE_SERVER_PRIVATE_IP"}}:51821" # IP of the host machine

    pocket-id-svc:
      loadBalancer:
        servers:
          - url: "http://100.64.0.19:1411"
        # healthCheck:
        #   path: "/healthz"
        #   interval: "30s"
        #   timeout: "5s"

    nas-svc:
      loadBalancer:
        servers:
          - url: "https://100.64.0.8:8006"
        serversTransport: proxmox-transport

    splitpro-svc:
      loadBalancer:
        servers:
          - url: "http://100.64.0.19:8098"

    immich-public-proxy-svc:
      loadBalancer:
        servers:
          - url: "http://100.64.0.19:8097"

    homeserver-svc:
      loadBalancer:
        servers:
          - url: "https://100.64.0.18:8006"
        serversTransport: proxmox-transport

    openwrt-svc:
      loadBalancer:
        servers:
          - url: "http://100.64.0.6"
