http:
  routers:
    t3code-rtr:
      rule: "Host(`t3code.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: t3code-svc

    marimo-local-rtr:
      rule: "Host(`marimo-local.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: marimo-local-svc

    homeserver-api-rtr:
      rule: "Host(`api-backend.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: homeserver-api-svc

    homeserver-api-ui-rtr:
      rule: "Host(`api.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: homeserver-api-ui-svc

    lgos-chainlit-rtr:
      rule: "Host(`lgos-chainlit.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: lgos-chainlit-svc

    lgos-bifrost-rtr:
      rule: "Host(`lgos-bifrost.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: lgos-bifrost-svc

    # NOTE: Needed for plotly cdn js
    lgos-openwebui-rtr:
      rule: "Host(`lgos-openwebui.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: lgos-openwebui-svc

  middlewares:
    langflow-oidc:
      plugin:
        traefik-oidc-auth:
          Secret: '{{env "LANGFLOW_OIDC_SESSION_SECRET"}}'
          Provider:
            Url: 'https://pocketid.{{env "BASE_DOMAINNAME"}}'
            ClientId: '{{env "LANGFLOW_CLIENT_ID"}}'
            ClientSecret: '{{env "LANGFLOW_CLIENT_SECRET"}}'
            TokenValidation: AccessToken
            UsePkce: false
          Scopes:
            - openid
            - profile
            - email
            - offline_access
          CallbackUri: /oidc/callback
          CookieNamePrefix: LangflowOidc
          SessionCookie:
            SameSite: lax
          Headers:
            - Name: Authorization
              Value: "{{`Bearer {{ .accessToken }}`}}"

  services:
    t3code-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:3773"

    marimo-local-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:2718"

    homeserver-api-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:8000"

    homeserver-api-ui-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:5002"

    lgos-chainlit-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:3002"

    lgos-bifrost-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:3000"

    lgos-openwebui-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:3003"
