http:
  routers:
    aiostreams-rtr:
      rule: "Host(`aiostreams.{{env "BASE_DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth-relaxed
      service: aiostreams-svc

    obsidian-rtr:
      rule: "Host(`obsidian.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: obsidian-svc

    bambustudio-rtr:
      rule: "Host(`bambustudio.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: bambustudio-svc

  services:
    aiostreams-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LOCAL_STATIC_IP"}}:1006"

    obsidian-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3002

    bambustudio-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3003
