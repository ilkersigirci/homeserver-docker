http:
  routers:
    obsidian-rtr:
      rule: "Host(`obsidian.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: obsidian-svc

    bambustudio-rtr:
      rule: "Host(`bambustudio.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: bambustudio-svc

  services:
    obsidian-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3000

    bambustudio-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3001
