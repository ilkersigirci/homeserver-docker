http:
  routers:
    obsidian-rtr:
      rule: "Host(`obsidian.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: obsidian-svc

    bambustudio-rtr:
      rule: "Host(`bambustudio.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: bambustudio-svc

    gpu-api-rtr:
      rule: "Host(`api.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      # middlewares:
      #   - chain-no-auth-relaxed
      service: gpu-api-svc

    gpu-api-ui-rtr:
      rule: "Host(`api-ui.{{env "DOMAINNAME"}}`)"
      entryPoints:
        - websecure
      # middlewares:
      #   - chain-no-auth-relaxed
      service: gpu-api-ui-svc

  services:
    obsidian-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3002

    bambustudio-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.19:3003

    gpu-api-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.21:8000

    gpu-api-ui-svc:
      loadBalancer:
        servers:
          - url: http://192.168.2.21:5002