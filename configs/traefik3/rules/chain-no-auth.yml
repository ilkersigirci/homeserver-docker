http:
  middlewares:
    chain-no-auth:
      chain:
        middlewares:
{{if env "CROWDSEC_TRAEFIK_BOUNCER_API_KEY"}}
          - middlewares-cf-real-ip
          # - middlewares-origin-allow-cloudflare-trusted
          - middlewares-crowdsec-bouncer
{{end}}
          - middlewares-rate-limit-public-app
          - middlewares-secure-headers

    chain-no-auth-relaxed:
      chain:
        middlewares:
{{if env "CROWDSEC_TRAEFIK_BOUNCER_API_KEY"}}
          - middlewares-cf-real-ip
          # - middlewares-origin-allow-cloudflare-trusted
          - middlewares-crowdsec-bouncer
{{end}}
          - middlewares-rate-limit-public-app
          - middlewares-secure-headers-relaxed
