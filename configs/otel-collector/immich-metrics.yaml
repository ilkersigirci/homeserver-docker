receivers:
  prometheus/immich:
    config:
      scrape_configs:
        - job_name: immich
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: ["${env:IMMICH_METRICS_TARGET}"]
              labels:
                immich_worker: ${env:IMMICH_METRICS_WORKER}

service:
  pipelines:
    metrics/immich:
      receivers: [prometheus/immich]
      processors: [memory_limiter, resourcedetection, resource/common]
      exporters: [otlp]
