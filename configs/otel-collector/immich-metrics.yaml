# Merge with otelcol-agent-config.yaml only on hosts running immich-server.
receivers:
  prometheus/immich:
    config:
      scrape_configs:
        - job_name: immich
          scrape_interval: 30s
          scrape_timeout: 10s
          static_configs:
            - targets: [immich-server:8081]
              labels:
                immich_worker: api
            - targets: [immich-server:8082]
              labels:
                immich_worker: microservices

service:
  pipelines:
    metrics/immich:
      receivers: [prometheus/immich]
      processors: [memory_limiter, resourcedetection, resource/common]
      exporters: [otlp]
