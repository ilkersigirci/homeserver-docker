  homepage:
    image: ghcr.io/benphelps/homepage:latest
    container_name: homepage
    networks:
      - t2_proxy
      - socket_proxy
    volumes:
      - $CONFIGDIR/homepage:/app/config
      - $CONFIGDIR/homepage/icons:/app/public/icons
      - /mnt/d:/mnt/d  # NOTE: Need for Disk usage widget
    environment:
      - HOMEPAGE_VAR_DOMAINNAME=$DOMAINNAME
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=$JELLYFIN_API_KEY
      - HOMEPAGE_VAR_IMMICH_API_KEY=$IMMICH_API_KEY
      - HOMEPAGE_VAR_IMMICHDEV_API_KEY=$IMMICHDEV_API_KEY
      - HOMEPAGE_VAR_TAILSCALE_KEY=$TAILSCALE_KEY
      - HOMEPAGE_VAR_TAILSCALE_HOMESERVER_ID=$TAILSCALE_HOMESERVER_ID
      - HOMEPAGE_VAR_HOMESERVER_LOCAL_STATIC_IP=$HOMESERVER_LOCAL_STATIC_IP
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.homepage-rtr.entrypoints=https"
      - "traefik.http.routers.homepage-rtr.rule=Host(`homepage.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.homepage-rtr.middlewares=chain-no-auth@file" # NOTE: authelia rate-limits it
      ## HTTP Services
      - "traefik.http.routers.homepage-rtr.service=homepage-svc"
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"    

  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest # TODO: ghcr.io/
    depends_on:
      - traefik
    restart: $BASE_RESTART_POLICY
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DATADIR/vaultwarden:/data/
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.vaultwarden-rtr.entrypoints=https"
      - "traefik.http.routers.vaultwarden-rtr.rule=Host(`vaultwarden.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.vaultwarden-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.vaultwarden-rtr.service=vaultwarden-svc"
      - "traefik.http.services.vaultwarden-svc.loadbalancer.server.port=80"

  ##################### File Browser #####################
  # For custom.css: change Global Settings->branding path to "custom"
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:latest # TODO: ghcr.io/
    depends_on:
      - traefik
    restart: $BASE_RESTART_POLICY
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/filebrowser/database.db:/database.db
      - $CONFIGDIR/filebrowser/custom.css:/custom/custom.css
      - $USERDIR:/srv/Home  # NOTE: When downing container, provide .env file, otherwise gives error
      - $HARDDISKROOTDIR:/srv/Harddisk  # NOTE: When downing container, provide .env file, otherwise gives error
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - FB_NOAUTH=1
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.filebrowser-rtr.entrypoints=https"
      - "traefik.http.routers.filebrowser-rtr.rule=Host(`filebrowser.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.filebrowser-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.filebrowser-rtr.service=filebrowser-svc"
      - "traefik.http.services.filebrowser-svc.loadbalancer.server.port=80"


