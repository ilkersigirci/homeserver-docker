name: others

networks:
  t3_proxy:
    external: true
  internal:
    name: internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.22.0/24

# secrets:
#   firefly_app_key:
#     file: $DOCKERDIR/secrets/firefly_app_key

services:
  reactive-resume:
    container_name: reactive-resume
    image: linuxserver/syncthing:latest
    restart: $OTHERS_RESTART_POLICY
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/syncthing:/config
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.reactive-resume-rtr.entrypoints=websecure"
      - "traefik.http.routers.reactive-resume-rtr.rule=Host(`resume.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.reactive-resume-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.reactive-resume-rtr.service=reactive-resume-svc"
      - "traefik.http.services.reactive-resume-svc.loadbalancer.server.port=8384"

