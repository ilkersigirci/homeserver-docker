version: "3.9"
name: photo-dev

networks:
  t2_proxy:
    external: true

services:
  immich-redis-dev:
    container_name: immich-redis-dev
    image: redis:6.2
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy

  immich-database-dev:
    container_name: immich-database-dev
    image: tensorchord/pgvecto-rs:pg14-v0.1.11
    networks:
      - t2_proxy
    volumes:
      - $DOCKERDIR/appdata/immich-db-dev:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      PG_DATA: /var/lib/postgresql/data

  immich-server-dev:
    container_name: immich-server-dev
    image: ghcr.io/immich-app/immich-server:release
    command: [ "start.sh", "immich" ]
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-redis-dev
      - immich-database-dev
    networks:
      - t2_proxy
    volumes:
      - ${ORIGINAL_UPLOAD_LOCATION}/library:/usr/src/app/upload/library
      - ${GENERATED_UPLOAD_LOCATION}/thumbs:/usr/src/app/upload/thumbs
      - ${GENERATED_UPLOAD_LOCATION}/profile:/usr/src/app/upload/profile
      - ${GENERATED_UPLOAD_LOCATION}/encoded-videos:/usr/src/app/upload/encoded-videos
      - ${MEDIADIR}/Photos/Pictures:/mnt/media/Photos/Pictures:ro
      - ${MEDIADIR}/Photos/Videos:/mnt/media/Photos/Videos:ro
    env_file:
      - .env
    environment:
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-server-dev-rtr.entrypoints=https"
      - "traefik.http.routers.immich-server-dev-rtr.rule=Host(`photosdev.$DOMAINNAME`)"
      # - "traefik.http.routers.immich-server-dev-rtr.rule=Host(`photosdev.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      - "traefik.http.routers.immich-server-dev-rtr.middlewares=chain-authelia@file"
      # - "traefik.http.routers.immich-server-dev-rtr.middlewares=add-api"
      # - "traefik.http.middlewares.add-api.stripprefix.prefixes=/api"
      ## HTTP Services
      - "traefik.http.routers.immich-server-dev-rtr.service=immich-server-dev-svc"
      - "traefik.http.services.immich-server-dev-svc.loadbalancer.server.port=3001"

  immich-microservices-dev:
    container_name: immich-microservices-dev
    image: ghcr.io/immich-app/immich-server:release
    command: [ "start.sh", "microservices" ]
    # restart: $MEDIA_RESTART_POLICY
    restart: on-failure
    depends_on:
      - immich-redis-dev
      - immich-database-dev
    networks:
      - t2_proxy
    volumes:
      - ${ORIGINAL_UPLOAD_LOCATION}/library:/usr/src/app/upload/library
      - ${GENERATED_UPLOAD_LOCATION}/thumbs:/usr/src/app/upload/thumbs
      - ${GENERATED_UPLOAD_LOCATION}/profile:/usr/src/app/upload/profile
      - ${GENERATED_UPLOAD_LOCATION}/encoded-videos:/usr/src/app/upload/encoded-videos
      - ${MEDIADIR}/Photos/Pictures:/mnt/media/Photos/Pictures:ro
      - ${MEDIADIR}/Photos/Videos:/mnt/media/Photos/Videos:ro
    env_file:
      - .env
    environment:
      NODE_ENV: production

  immich-machine-learning-dev:
    container_name: immich-machine-learning-dev
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    volumes:
      - $DOCKERDIR/appdata/immich-ml-dev/model-cache:/cache
    env_file:
      - .env
    environment:
      NODE_ENV: production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
