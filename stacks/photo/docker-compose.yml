version: "3.9"

networks:
  t2_proxy:
    external: true

volumes:
  pgdata:

services:
  immich-redis:
    container_name: immich-redis
    image: redis:6.2
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy  

  immich-postgres:
    container_name: immich-postgres
    image: postgres:14
    networks:
      - t2_proxy
    # ports:
    #   - 5432:5432
    volumes:
      # - $DOCKERDIR/appdata/immich-db:/var/lib/postgresql/data
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      PG_DATA: /var/lib/postgresql/data
    

  immich-server:
    container_name: immich-server
    image: altran1502/immich-server:release
    entrypoint: ["/bin/sh", "./start-server.sh"]
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-redis
      - immich-postgres
    networks:
      - t2_proxy
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
    env_file:
      - .env
    environment:
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-server-rtr.entrypoints=https"
      - "traefik.http.routers.immich-server-rtr.rule=Host(`immich.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      - "traefik.http.routers.immich-server-rtr.middlewares=add-api" # chain-authelia@file
      - "traefik.http.middlewares.add-api.stripprefix.prefixes=/api"
      ## HTTP Services
      - "traefik.http.routers.immich-server-rtr.service=immich-server-svc"
      - "traefik.http.services.immich-server-svc.loadbalancer.server.port=3001"

  immich-microservices:
    container_name: immich-microservices
    image: altran1502/immich-server:release
    entrypoint: ["/bin/sh", "./start-microservices.sh"]
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-redis
      - immich-postgres
    networks:
      - t2_proxy
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
    env_file:
      - .env
    environment:
      NODE_ENV: production
    # labels:
    #   - "traefik.enable=true"
    #   ## HTTP Routers
    #   - "traefik.http.routers.immich-microservices.entrypoints=https"
    #   - "traefik.http.routers.immich-microservices.rule=Host(`immich-mc.$DOMAINNAME`)"
    #   ## Middlewares
    #   # - "traefik.http.routers.immich-microservices.middlewares=chain-authelia@file"
    #   ## HTTP Services
    #   # - "traefik.http.routers.immich-microservices.service=immich-microservices-svc"
    #   - "traefik.http.services.immich-microservices-svc.loadbalancer.server.port=3001"

  immich-machine-learning:
    container_name: immich-machine-learning
    image: altran1502/immich-machine-learning:release
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-redis
      - immich-postgres
    networks:
      - t2_proxy
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
    env_file:
      - .env
    environment:
      NODE_ENV: production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  immich-web:
    container_name: immich-web
    image: altran1502/immich-web:release
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-server
    networks:
      - t2_proxy
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-rtr.entrypoints=https"
      - "traefik.http.routers.immich-rtr.rule=Host(`immich.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.immich-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.immich-rtr.service=immich-svc"
      - "traefik.http.services.immich-svc.loadbalancer.server.port=3000"