name: photo

networks:
  t2_proxy:
    external: true

services:
  immich-redis:
    container_name: immich-redis
    image: docker.io/redis:6.2-alpine@sha256:2ba50e1ac3a0ea17b736ce9db2b0a9f6f8b85d4c27d5f5accc6a416d8f42c6d5
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    healthcheck:
      test: redis-cli ping || exit 1

  immich-database:
    container_name: immich-database
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=vectors.so',
        '-c',
        'search_path="$$user", public, vectors',
        '-c',
        'logging_collector=on',
        '-c',
        'max_wal_size=2GB',
        '-c',
        'shared_buffers=512MB',
        '-c',
        'wal_compression=on',
      ]
    networks:
      - t2_proxy
    volumes:
      - $DOCKERDIR/appdata/immich-db:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      PG_DATA: /var/lib/postgresql/data
    healthcheck:
      test: pg_isready --dbname='${DB_DATABASE_NAME}' || exit 1; Chksum="$$(psql --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:release
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - immich-redis
      - immich-database
    networks:
      - t2_proxy
    volumes:
      - ${GENERATED_UPLOAD_LOCATION}:/usr/src/app/upload
      - ${ORIGINAL_UPLOAD_LOCATION}/library:/usr/src/app/upload/library
      - ${ORIGINAL_UPLOAD_LOCATION}/upload:/usr/src/app/upload/upload
      - ${MEDIADIR}/Photos/Pictures:/mnt/media/Photos/Pictures:ro
      - ${MEDIADIR}/Photos/Videos:/mnt/media/Photos/Videos:ro
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.immich-server-rtr.entrypoints=https"
      - "traefik.http.routers.immich-server-rtr.rule=Host(`photos.$DOMAINNAME`)"
      # - "traefik.http.routers.immich-server-rtr.rule=Host(`photos.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      - "traefik.http.routers.immich-server-rtr.middlewares=chain-authelia@file"
      # - "traefik.http.routers.immich-server-rtr.middlewares=add-api"
      # - "traefik.http.middlewares.add-api.stripprefix.prefixes=/api"
      ## HTTP Services
      - "traefik.http.routers.immich-server-rtr.service=immich-server-svc"
      - "traefik.http.services.immich-server-svc.loadbalancer.server.port=2283"

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release-cuda
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    volumes:
      - $DOCKERDIR/appdata/immich-ml/model-cache:/cache
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ##############################################
  # https://github.com/Salvoxia/immich-folder-album-creator
  immich-folder-album-creator:
    container_name: immich-folder-album-creator
    image: salvoxia/immich-folder-album-creator:latest
    restart: "no"
    # command: ["/script/immich_auto_album.sh"] # NOTE: Manually run
    networks:
      - t2_proxy
    environment:
      API_URL: http://immich-server:2283/api
      API_KEY: $IMMICH_API_KEY
      ROOT_PATH: /mnt/media/Photos/Pictures
      CRON_EXPRESSION: "0 * * * *"
      TZ: Europe/Istanbul
      ALBUM_LEVELS: 1
      LOG_LEVEL: INFO
      SYNC_MODE: "2" # Remove offline assets and delete empty albums after each run