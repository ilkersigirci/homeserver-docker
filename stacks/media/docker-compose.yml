  jellyfin:
    image: jellyfin/jellyfin:latest  # TODO: ghcr.io
    container_name: jellyfin
    # cpus: "0.5"
    mem_reservation: "4096M"
    mem_limit: "4096M"
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    ports:
      - "8096:8096"
    security_opt:
      - no-new-privileges:true
    # user: $PGID:$PUID
    user: 0:0
    volumes:
      - $DOCKERDIR/appdata/jellyfin:/config
      - $DOCKERDIR/appdata/jellyfin/cache:/cache
      - $DATADIR/jellyfin/metadata:/config/metadata
      - $DATADIR/downloads:/media/downloads:ro
      - $MEDIADIR:/media/local:ro
      - $ONEDRIVEDIR:/media/onedrive:ro
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.jellyfin-rtr.entrypoints=https"
      - "traefik.http.routers.jellyfin-rtr.rule=Host(`jellyfin.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.jellyfin-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.jellyfin-rtr.service=jellyfin-svc"
      - "traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096"
    
  jellyseerr:
    image: fallenbagel/jellyseerr:latest  # TODO: ghcr.io
    container_name: jellyseerr
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - jellyfin
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/jellyseerr:/app/config
    environment:
      # - PUID=$PUID
      # - PGID=$PGID
      - TZ=$TZ
      - LOG_LEVEL=debug
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.jellyseerr-rtr.entrypoints=https"
      - "traefik.http.routers.jellyseerr-rtr.rule=Host(`jellyseerr.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.jellyseerr-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.jellyseerr-rtr.service=jellyseerr-svc"
      - "traefik.http.services.jellyseerr-svc.loadbalancer.server.port=5055"

  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    restart: $MEDIA_RESTART_POLICY
    depends_on:
      - jellyfin
    networks:
      - t2_proxy
    # ports:
    #   - "9180:9180"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      # - "traefik.http.routers.feishin-rtr.entrypoints=https"
      - "traefik.http.routers.feishin-rtr.rule=Host(`music.$DOMAINNAME`)"
      ## Middlewares
      # - "traefik.http.routers.feishin-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.feishin-rtr.service=feishin-svc"
      - "traefik.http.services.feishin-svc.loadbalancer.server.port=9180"


