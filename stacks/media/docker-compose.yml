      - "traefik.http.routers.stremio-rtr.rule=Host(`stremio.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.stremio-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.stremio-rtr.service=stremio-svc"
      - "traefik.http.services.stremio-svc.loadbalancer.server.port=11470"
