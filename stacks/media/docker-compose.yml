  jellyfin-beta:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-beta
    # cpus: "0.5"
    mem_reservation: "4096M"
    mem_limit: "4096M"
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    ports:
      - "8096:8096"
    security_opt:
      - no-new-privileges:true
    # user: $PGID:$PUID
    user: 0:0
    volumes:
      - $DOCKERDIR/appdata/jellyfin-beta:/config
      - $DOCKERDIR/appdata/jellyfin-beta/cache:/cache
      - $DATADIR/jellyfin/metadata:/config/metadata
      - $DATADIR/downloads:/media/downloads:ro
      - $MEDIADIR:/media/local:ro
      - $ONEDRIVEDIR:/media/onedrive:ro
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.jellyfin-beta-rtr.entrypoints=https"
      - "traefik.http.routers.jellyfin-beta-rtr.rule=Host(`jellyfin.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.jellyfin-beta-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.jellyfin-beta-rtr.service=jellyfin-beta-svc"
      - "traefik.http.services.jellyfin-beta-svc.loadbalancer.server.port=8096"
    
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: $MEDIA_RESTART_POLICY
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/jellyseerr:/app/config
    environment:
      # - PUID=$PUID
      # - PGID=$PGID
      - TZ=$TZ
      - LOG_LEVEL=debug
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.jellyseerr-rtr.entrypoints=https"
      - "traefik.http.routers.jellyseerr-rtr.rule=Host(`jellyseerr.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.jellyseerr-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.jellyseerr-rtr.service=jellyseerr-svc"
      - "traefik.http.services.jellyseerr-svc.loadbalancer.server.port=5055"


