  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    restart: $MAINTANENCE_RESTART_POLICY
    networks:
      - t2_proxy
    # privileged: true
    volumes:
      - $DOCKERDIR/appdata/code-server:/home/coder
      - $DOCKERDIR:/home/coder/docker
      - $NOTES_DIR:/home/coder/notes
    environment:
      # user: "0"
      user: $PUID:$PGID
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.code-server-rtr.entrypoints=https"
      - "traefik.http.routers.code-server-rtr.rule=Host(`code.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.code-server-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.code-server-rtr.service=code-server-svc"
      - "traefik.http.services.code-server-svc.loadbalancer.server.port=8080"

