  # Linuxserver
  code-server:
    image: linuxserver/code-server
    container_name: code-server
    restart: $MAINTANENCE_RESTART_POLICY
    networks:
      - t2_proxy
    volumes:
      - $DOCKERDIR/appdata/code-server:/config
      - $DOCKERDIR:/config/workspace/docker
      - $NOTESDIR:/config/workspace/notes
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEFAULT_WORKSPACE: /config/workspace
      # DOCKER_HOST: tcp://docker-socket-proxy:2375
      # PASSWORD: password
      # HASHED_PASSWORD: 
      SUDO_PASSWORD: ilker
      # SUDO_PASSWORD_HASH: 
      # PROXY_DOMAIN: code-server-ls.my.domain
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.code-server-rtr.entrypoints=https"
      - "traefik.http.routers.code-server-rtr.rule=Host(`code.$DOMAINNAME`)"
      ## Middlewares
      - "traefik.http.routers.code-server-rtr.middlewares=chain-authelia@file"
      ## HTTP Services
      - "traefik.http.routers.code-server-rtr.service=code-server-svc"
      - "traefik.http.services.code-server-svc.loadbalancer.server.port=8443"

