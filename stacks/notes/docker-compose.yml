  #     - $NOTESDIR/Markdown:/app/posts:ro
  #   environment:
  #     - PUID=$PUID
  #     - PGID=$PGID
  #     - TZ=$TZ
  #     # - DOCKER_MODS=linuxserver/mods:universal-git
