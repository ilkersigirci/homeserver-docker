  #     - "traefik.enable=true"
  #     ## HTTP Routers
  #     - "traefik.http.routers.volglass-rtr.entrypoints=https"
  #     - "traefik.http.routers.volglass-rtr.rule=Host(`volglass.$DOMAINNAME`)"
  #     ## Middlewares
  #     - "traefik.http.routers.volglass-rtr.middlewares=chain-authelia@file"
  #     ## HTTP Services
  #     - "traefik.http.routers.volglass-rtr.service=volglass-svc"
  #     - "traefik.http.services.volglass-svc.loadbalancer.server.port=3000"
