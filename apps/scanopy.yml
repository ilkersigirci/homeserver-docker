# NOTE: The daemon requires host networking + privileged mode for active discovery.
services:
  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest@sha256:f17495b5fe96f83b542ea30d8a798ccfa1163c5acb756a04a28520df31240950
    container_name: scanopy-daemon
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    profiles:
      - root
      - maintenance
      - scanopy
    network_mode: host
    privileged: true
    user: "0:0"
    read_only: false
    tmpfs:
      - /tmp
      - /run
    environment:
      SCANOPY_LOG_LEVEL: info
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - $REPO_PATH/data/scanopy-daemon:/root/.config/daemon
      # Comment out the line below to disable docker discovery
      # - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy-db:
    image: postgres:18.3@sha256:059fa0289cc5a184034e05a1f4f6d6fd79f69dc718b8b04ab60b6b469eed411e
    container_name: scanopy-db
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    profiles:
      - maintenance
      - scanopy
    networks:
      - t3_proxy
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - $REPO_PATH/data/scanopy-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scanopy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scanopy:
    image: ghcr.io/scanopy/scanopy/server:latest@sha256:92da6d69631a80dcada04399729db650e78bc1ea4caf0274001cae26791b1b7f
    container_name: scanopy
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    depends_on:
      scanopy-db:
        condition: service_healthy
      scanopy-daemon:
        condition: service_healthy
    profiles:
      - custom-user
      - maintenance
      - scanopy
    networks:
      - t3_proxy
    ports:
      # Required so the host-network daemon can reach the server via 127.0.0.1.
      - "127.0.0.1:60072:60072"
    expose:
      - 60072
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:postgres@scanopy-db:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: https://scanopy.$DOMAINNAME
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
    volumes:
      - $REPO_PATH/data/scanopy:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60072/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.scanopy-rtr.entrypoints: "websecure"
      traefik.http.routers.scanopy-rtr.rule: "Host(`scanopy.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.scanopy-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.scanopy-rtr.service: "scanopy-svc"
      traefik.http.services.scanopy-svc.loadbalancer.server.port: "60072"
      ####### TINYAUTH #######
      tinyauth.apps.scanopy.config.domain: "scanopy.$DOMAINNAME"
      tinyauth.apps.scanopy.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "scanopy"
      homepage.icon: "scanopy.png"
      homepage.href: "https://scanopy.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Network discovery and topology mapping"
      ####### GLANCE #######
      glance.name: "scanopy"
      glance.icon: "sh:scanopy"
      glance.url: "https://scanopy.$DOMAINNAME"
      glance.description: "Network discovery and topology mapping"
