# NOTE: The daemon requires host networking + privileged mode for active discovery.
networks:
  scanopy_backend:

services:
  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:v0.17.4@sha256:e3865d79fd81f87b4aebaa15fa441059fd348a47c718e40756c62c492048012b
    container_name: scanopy-daemon
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    profiles:
      - root
      - maintenance
      - scanopy
    network_mode: host
    privileged: true
    user: "0:0"
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,mode=1777
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/data/scanopy-daemon:/root/.config/daemon
      # Comment out the line below to disable docker discovery
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SCANOPY_LOG_LEVEL: info
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:60073/api/health >/dev/null || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
  scanopy-db:
    image: postgres:18.4@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4
    container_name: scanopy-db
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    profiles:
      - maintenance
      - scanopy
    networks:
      - scanopy_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/scanopy-db:/var/lib/postgresql
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d scanopy"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  scanopy:
    image: ghcr.io/scanopy/scanopy/server:v0.17.9@sha256:346a67367c3b4357bbbd469315fb889caa1536141c52527cce2b31fedfea9212
    container_name: scanopy
    restart: $RESTART_POLICY_MAINTENANCE
    init: true
    depends_on:
      scanopy-db:
        condition: service_healthy
      scanopy-daemon:
        condition: service_healthy
    profiles:
      - maintenance
      - scanopy
    networks:
      - t3_proxy
      - scanopy_backend
    expose:
      - 60072
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Required so the host-network daemon can reach the server via 127.0.0.1.
      - "127.0.0.1:60072:60072"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/data/scanopy:/data
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:postgres@scanopy-db:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: https://scanopy.$DOMAINNAME
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:60072/api/health >/dev/null || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.scanopy-rtr.entrypoints: "websecure"
      traefik.http.routers.scanopy-rtr.rule: "Host(`scanopy.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.scanopy-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.scanopy-rtr.service: "scanopy-svc"
      traefik.http.services.scanopy-svc.loadbalancer.server.port: "60072"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "scanopy"
      homepage.icon: "scanopy.png"
      homepage.href: "https://scanopy.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Network discovery and topology mapping"
      ####### GLANCE #######
      glance.name: "scanopy"
      glance.icon: "sh:scanopy"
      glance.url: "https://scanopy.$DOMAINNAME"
      glance.description: "Network discovery and topology mapping"
