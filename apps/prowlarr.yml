# TODO: Harden
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.0-develop@sha256:a78e6850440c4a89b63a26ecdfc01d6ce2b0a268573fb577781abbbbbd445529
    container_name: prowlarr
    depends_on:
      - transmission
      - sabnzbd
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - root
      - media
      - arr
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/prowlarr:/config
      - $DIR_MEDIA/Downloads:/data/downloads
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.prowlarr-rtr.entrypoints: "websecure"
      traefik.http.routers.prowlarr-rtr.rule: "Host(`prowlarr.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.prowlarr-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.prowlarr-rtr.service: "prowlarr-svc"
      traefik.http.services.prowlarr-svc.loadbalancer.server.port: "9696"
      ####### TINYAUTH #######
      tinyauth.apps.prowlarr.config.domain: "prowlarr.$DOMAINNAME"
      tinyauth.apps.prowlarr.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Prowlarr"
      homepage.icon: "prowlarr.svg"
      homepage.href: "https://prowlarr.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Indexer Manager"
