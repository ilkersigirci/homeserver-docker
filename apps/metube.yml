services:
  metube:
    image: ghcr.io/alexta69/metube:2026.04.28@sha256:caf21da7d83a4003b429ef1126e9c1499f36f8401a1f8a7b158f70b94ade8edd
    container_name: metube
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - youtube
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $DIR_MEDIA/Youtube:/downloads
      - $DIR_MEDIA/Youtube/cookies:/cookies
    environment:
      UID: $PUID
      GID: $PGID
      CHOWN_DIRS: true
      LOGLEVEL: ${METUBE_LOGLEVEL:-INFO}
      PORT: 8081
      OUTPUT_TEMPLATE: "%(title)s [%(id)s].%(ext)s"
      # YTDL_OPTIONS: '{"writethumbnail": true, "writeinfojson": true}' # "writeinfojson": true,
      YTDL_OPTIONS: '{"cookiefile":"/cookies/cookies.txt"}'
      # Downloaded files are deleted on the server, when they are trashed from the "Completed" section of the UI
      DELETE_FILE_ON_TRASHCAN: ${METUBE_DELETE_FILE_ON_TRASHCAN:-true}
      MAX_CONCURRENT_DOWNLOADS: ${METUBE_MAX_CONCURRENT_DOWNLOADS:-10}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.metube-rtr.entrypoints: "websecure"
      traefik.http.routers.metube-rtr.rule: "Host(`metube.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.metube-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.metube-rtr.service: "metube-svc"
      traefik.http.services.metube-svc.loadbalancer.server.port: "8081"
      ####### TINYAUTH #######
      tinyauth.apps.metube.config.domain: "metube.$DOMAINNAME"
      tinyauth.apps.metube.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "metube"
      homepage.icon: "metube.svg"
      homepage.href: "https://metube.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Self-hosted YouTube downloader"
      ####### GLANCE #######
      glance.name: metube
      glance.icon: sh:metube
      glance.url: https://metube.$DOMAINNAME
      glance.description: Self-hosted YouTube downloader
