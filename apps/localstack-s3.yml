services:
  localstack-s3:
    image: gresau/localstack-persist:3@sha256:7750acf7089e75c9584e671d4594d54c8776b8a4bc57a0c18e4e92cff3d17267
    container_name: localstack-s3
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
      # - socket_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/localstack-s3:/persisted-data
      - $REPO_PATH/scripts/localstack_create_s3_bucket.sh:/etc/localstack/init/ready.d/script.sh
    environment:
      DEBUG: 0
      SERVICES: s3
      CREATED_BUCKET_NAME: ilkerflix
      APP_AWS_REGION: eu-central-1
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.localstack-s3-rtr.entrypoints: "websecure"
      traefik.http.routers.localstack-s3-rtr.rule: "Host(`s3.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.localstack-s3-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.localstack-s3-rtr.service: "localstack-s3-svc"
      traefik.http.services.localstack-s3-svc.loadbalancer.server.port: "4566"
      ####### TINYAUTH #######
      tinyauth.apps.s3.config.domain: "s3.$DOMAINNAME"
      tinyauth.apps.s3.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "S3"
      homepage.icon: "s3.svg"
      homepage.href: "https://s3.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Localstack S3"
