services:
  chhoto-url:
    image: ghcr.io/sintan1729/chhoto-url:6.6.0-alpine@sha256:30b557edd89720e2a947fdee655f27ddfc9a3b818a83f210720640fed792cc9a
    container_name: chhoto-url
    restart: $RESTART_POLICY_CORE
    tty: true
    profiles:
      - core
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "512M"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/chhoto-url:/data
    # NOTE: For envs like True, quote them specifically for chhoto-url to parse them correctly.
    environment:
      TZ: $TZ
      CHHOTO_LISTEN_PORT: 4567
      CHHOTO_SITE_URL: https://go.$DOMAINNAME
      CHHOTO_PASSWORD: ""
      CHHOTO_API_KEY: $CHHOTO_API_KEY
      CHHOTO_DB_URL: /data/urls.sqlite
      CHHOTO_SQLITE_USE_WAL_MODE: "True"
      CHHOTO_REDIRECT_METHOD: "PERMANENT" # TEMPORARY
      CHHOTO_CACHE_CONTROL_HEADER: "no-store"
      CHHOTO_SLUG_STYLE: "UID" # Pair
      CHHOTO_SLUG_LENGTH: 4
      CHHOTO_TRY_LONGER_SLUG: "True"
      CHHOTO_ALLOW_CAPITAL_LETTERS: "False"
      # CHHOTO_DISABLE_FRONTEND: "True"
      CHHOTO_FRONTEND_PAGE_SIZE: 20
      # CHHOTO_HASH_ALGORITHM: Argon2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4567/api/whoami || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.chhoto-url-rtr.entrypoints: "websecure"
      traefik.http.routers.chhoto-url-rtr.rule: "Host(`go-admin.$DOMAINNAME`)"
      traefik.http.routers.chhoto-url-rtr.priority: "10"
      traefik.http.routers.chhoto-url-public-rtr.entrypoints: "websecure"
      traefik.http.routers.chhoto-url-public-rtr.rule: "Host(`go.$DOMAINNAME`) && PathRegexp(`^/[a-z0-9]{4}$`) && (Method(`GET`) || Method(`HEAD`))"
      traefik.http.routers.chhoto-url-public-rtr.priority: "100"
      # ### API router for CLI usage with Chhoto's API key (No need when using Split DNS on Homeserver)
      # traefik.http.routers.chhoto-url-api-rtr.entrypoints: "websecure"
      # traefik.http.routers.chhoto-url-api-rtr.rule: "Host(`go-admin.$DOMAINNAME`) && PathPrefix(`/api/`) && Header(`X-API-Key`, `$CHHOTO_API_KEY`)"
      # traefik.http.routers.chhoto-url-api-rtr.priority: "110"
      # traefik.http.routers.chhoto-url-api-rtr.middlewares: "chain-no-auth-relaxed@file"
      # traefik.http.routers.chhoto-url-api-rtr.service: "chhoto-url-svc"
      ## Middlewares
      traefik.http.routers.chhoto-url-rtr.middlewares: "chain-tinyauth-relaxed@file"
      traefik.http.routers.chhoto-url-public-rtr.middlewares: "chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.chhoto-url-rtr.service: "chhoto-url-svc"
      traefik.http.routers.chhoto-url-public-rtr.service: "chhoto-url-svc"
      traefik.http.services.chhoto-url-svc.loadbalancer.server.port: "4567"
      ####### TINYAUTH #######
      tinyauth.apps.chhoto-url.config.domain: "go-admin.$DOMAINNAME"
      tinyauth.apps.chhoto-url.ip.bypass: "$LOCAL_IPS"
      tinyauth.apps.chhoto-url.oauth.groups: "admin"
      # tinyauth.apps.chhoto-url.path.allow: "^/[a-z0-9]{4}$"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "chhoto-url"
      homepage.icon: "chhoto-url.png"
      homepage.href: "https://go-admin.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "URL shortener with no unnecessary features; written in Rust"
      ####### GLANCE #######
      glance.name: "chhoto-url"
      glance.icon: "sh:chhoto-url"
      glance.url: "https://go-admin.$DOMAINNAME"
      glance.description: "URL shortener with no unnecessary features; written in Rust"
