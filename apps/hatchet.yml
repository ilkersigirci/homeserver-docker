# Default user / pass is admin@example.com / Admin123!!
services:
  hatchet-db:
    image: postgres:18.3@sha256:059fa0289cc5a184034e05a1f4f6d6fd79f69dc718b8b04ab60b6b469eed411e
    container_name: hatchet-db
    command: postgres -c 'max_connections=200'
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - hatchet
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - t3_proxy
    expose:
      - 5432
    volumes:
      - $REPO_PATH/data/hatchet-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.83.37@sha256:eee219c670d34968fd15c05641737443841a2be92207ca027a8e6452446d2e93
    container_name: hatchet
    restart: $RESTART_POLICY_PROGRAMMING
    depends_on:
      hatchet-db:
        condition: service_healthy
    profiles:
      - programming
      - hatchet
    networks:
      - t3_proxy
    expose:
      - 8888 # HTTP UI
      - 7077 # gRPC API
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/configs/hatchet:/config
    environment:
      # Refer to https://docs.hatchet.run/self-hosting/configuration-options
      # for a list of all supported environment variables
      DATABASE_URL: "postgresql://postgres:postgres@hatchet-db:5432/postgres?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: $DOMAINNAME
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-rpc.$DOMAINNAME:443
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: https://hatchet.$DOMAINNAME
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_LIMITS_DEFAULT_TENANT_RETENTION_PERIOD: 720h # 30 days
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.hatchet-rtr.entrypoints: "websecure"
      traefik.http.routers.hatchet-rtr.rule: "Host(`hatchet.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.hatchet-rtr.middlewares: "chain-tinyauth-relaxed@file" # NOTE: For task input loading
      ## HTTP Services
      traefik.http.routers.hatchet-rtr.service: "hatchet-svc"
      traefik.http.services.hatchet-svc.loadbalancer.server.port: "8888"
      ## gRPC Router (RPC)
      traefik.http.routers.hatchet-rpc-rtr.entrypoints: "websecure"
      traefik.http.routers.hatchet-rpc-rtr.rule: "Host(`hatchet-rpc.$DOMAINNAME`)"
      traefik.http.routers.hatchet-rpc-rtr.tls: "true"
      traefik.http.routers.hatchet-rpc-rtr.middlewares: "chain-rpc@file"
      traefik.http.routers.hatchet-rpc-rtr.service: "hatchet-rpc-svc"
      ## gRPC Service (h2c)
      traefik.http.services.hatchet-rpc-svc.loadbalancer.server.port: "7077"
      traefik.http.services.hatchet-rpc-svc.loadbalancer.server.scheme: "h2c"
      ####### TINYAUTH #######
      tinyauth.apps.hatchet.config.domain: "hatchet.$DOMAINNAME"
      tinyauth.apps.hatchet.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "hatchet"
      homepage.icon: "hatchet.png"
      homepage.href: "https://hatchet.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Run Background Tasks at Scale"
      ####### GLANCE #######
      glance.name: "hatchet"
      glance.icon: "sh:hatchet"
      glance.url: "https://hatchet.$DOMAINNAME"
      glance.description: "Run Background Tasks at Scale"
