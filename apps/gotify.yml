# NOTE: Defeault username is `admin`
services:
  gotify:
    image: ghcr.io/gotify/server:2.9.1@sha256:a3af47067ce6aad76aadf5ba32d6ddfecd1ae576a961359f039fd1831e8b7652
    container_name: gotify
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      - t3_proxy
    ports:
      - "1005:80"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/gotify:/app/data
    environment:
      TZ: $TZ
      GOTIFY_DEFAULTUSER_PASS: $GOTIFY_DEFAULT_USER_PASS
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.gotify-rtr.entrypoints: "websecure"
      traefik.http.routers.gotify-rtr.rule: "Host(`gotify.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.gotify-rtr.middlewares: "chain-tinyauth-relaxed@file"
      # traefik.http.routers.gotify-rtr.middlewares: chain-no-auth-relaxed@file
      ## HTTP Services
      traefik.http.routers.gotify-rtr.service: "gotify-svc"
      traefik.http.services.gotify-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.gotify.config.domain: "gotify.$DOMAINNAME"
      tinyauth.apps.gotify.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "gotify"
      homepage.icon: "gotify.png"
      homepage.href: "https://gotify.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A simple server for sending and receiving messages"
      homepage.widget.type: "gotify"
      homepage.widget.url: "http://gotify:80"
      homepage.widget.key: "$GOTIFY_HOMEPAGE_CLIENT_TOKEN"
      ####### GLANCE #######
      glance.name: "gotify"
      glance.icon: "sh:gotify"
      glance.url: "https://gotify.$DOMAINNAME"
      glance.description: "A simple server for sending and receiving messages"
