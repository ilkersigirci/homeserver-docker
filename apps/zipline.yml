# NOTE: In Settings -> Admin -> Core -> Enable Return HTTPS URLs
# NOTE: After creating initial admin account, go to Settings -> OAuth -> Link it with OIDC Account
services:
  zipline-db:
    image: postgres:18.3@sha256:059fa0289cc5a184034e05a1f4f6d6fd79f69dc718b8b04ab60b6b469eed411e
    container_name: zipline-db
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - zipline
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - t3_proxy
    expose:
      - "5432"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/data/zipline-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  zipline:
    image: ghcr.io/diced/zipline:latest@sha256:ac1757a5973f1dcbe015466caef9249439b6f539ea605fad6c4e00a37fdb3bf5
    container_name: zipline
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      zipline-db:
        condition: service_healthy
    profiles:
      - media
      - zipline
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - "$REPO_PATH/data/zipline/uploads:/zipline/uploads"
      - "$REPO_PATH/data/zipline/public:/zipline/public"
      - "$REPO_PATH/data/zipline/themes:/zipline/themes"
    environment:
      DATASOURCE_TYPE: "local"
      # DATASOURCE_LOCAL_DIRECTORY: "/path/to/your/local/files"
      CORE_SECRET: $ZIPLINE_CORE_SECRET
      DATABASE_URL: postgres://postgres:postgres@zipline-db:5432/postgres
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:3000/api/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.zipline-rtr.entrypoints: "websecure"
      traefik.http.routers.zipline-rtr.rule: "Host(`share.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.zipline-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.zipline-rtr.service: "zipline-svc"
      traefik.http.services.zipline-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      # tinyauth.apps.zipline.config.domain: share.$DOMAINNAME
      # tinyauth.apps.zipline.ip.bypass: $LOCAL_IPS
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "zipline"
      homepage.icon: "zipline.png"
      homepage.href: "https://share.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A ShareX/file upload server and link shortener"
      ####### GLANCE #######
      glance.name: "zipline"
      glance.icon: "sh:zipline"
      glance.url: "https://share.$DOMAINNAME"
      glance.description: "A ShareX/file upload server and link shortener"
