services:
  tubearchivist:
    image: bbilly1/tubearchivist:v0.5.10@sha256:dfe723cf008520e1758ecc3e59e6ea8761dd10d5bb099cd87289e80f5bd66567
    container_name: tubearchivist
    restart: $RESTART_POLICY_MEDIA
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DIR_MEDIA/Youtube:/youtube
    environment:
      TA_USERNAME: admin
      TA_PASSWORD: admin
      HOST_UID: $PUID
      HOST_GID: $PGID
      TZ: $TZ
      ELASTIC_PASSWORD: admin
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.tubearchivist-rtr.entrypoints: "websecure"
      traefik.http.routers.tubearchivist-rtr.rule: "Host(`tubearch.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.tubearchivist-rtr.middlewares: "chain-tinyauth@file"
      #  - "traefik.http.routers.transmission-rtr.middlewares=middlewares-rate-limit@file"
      ## HTTP Services
      traefik.http.routers.tubearchivist-rtr.service: "tubearchivist-svc"
      traefik.http.services.tubearchivist-svc.loadbalancer.server.port: "8000"
      ####### TINYAUTH #######
      tinyauth.apps.tubearch.config.domain: "tubearch.$DOMAINNAME"
      tinyauth.apps.tubearch.ip.bypass: "$LOCAL_IPS"
    profiles:
      - media
