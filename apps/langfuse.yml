# NOTE: Don't forget to create a bucket named "langfuse" in your s3 provider beforehand.
networks:
  langfuse_backend:

services:
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.7.1@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    container_name: langfuse-clickhouse
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - langfuse
    networks:
      - langfuse_backend
    expose:
      - 8123
      - 9000
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/clickhouse-server:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
      - /var/log/clickhouse-server:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=775
      - /etc/clickhouse-server/users.d:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "4G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/configs/clickhouse-optimized/clickhouse-server:/etc/clickhouse-server/config.d:ro
      - $REPO_PATH/data/langfuse/clickhouse:/var/lib/clickhouse
      # - $REPO_PATH/data/langfuse/clickhouse/logs:/var/log/clickhouse-server
    environment:
      TZ: "UTC" # NOTE: Langfuse requires UTC; other zones break timestamp-bounded ClickHouse reads.
      CLICKHOUSE_DB: "default"
      CLICKHOUSE_USER: $LANGFUSE_CLICKHOUSE_USER
      CLICKHOUSE_PASSWORD: $LANGFUSE_CLICKHOUSE_PASSWORD
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8123/ping",
        ]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m

  langfuse-db:
    image: postgres:18.4@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4
    container_name: langfuse-db
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - langfuse
    networks:
      - langfuse_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/langfuse/db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  langfuse-redis:
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    container_name: langfuse-redis
    restart: $RESTART_POLICY_PROGRAMMING
    command: --requirepass "${LANGFUSE_REDIS_PASSWORD}"
    profiles:
      - programming
      - langfuse
    networks:
      - langfuse_backend
    expose:
      - 6379
    user: $PUID:$PGID
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/langfuse/redis:/data
    environment:
      LANGFUSE_REDIS_PASSWORD: $LANGFUSE_REDIS_PASSWORD
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli --no-auth-warning -a $${LANGFUSE_REDIS_PASSWORD} ping | grep -q PONG",
        ]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s

  langfuse-worker:
    image: langfuse/langfuse-worker:4.6.0@sha256:fcbf2ee82fa3f133c32c9ba0b5036fbd6e30466df0958a0a37e52f343b340d1b
    container_name: langfuse-worker
    restart: $RESTART_POLICY_PROGRAMMING
    depends_on: &langfuse-depends-on
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-db:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    profiles:
      - programming
      - langfuse
    networks:
      - langfuse_backend
    expose:
      - 3030
    user: expressjs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "3G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment: &langfuse-worker-env
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/postgres
      SALT: $LANGFUSE_SALT
      ENCRYPTION_KEY: $LANGFUSE_ENCRYPTION_KEY
      TELEMETRY_ENABLED: false
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: true
      LANGFUSE_BACKGROUND_MIGRATION_V4_DROP_PID_TID_SORTING_TABLES: true
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://langfuse-clickhouse:9000}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://langfuse-clickhouse:8123}
      CLICKHOUSE_USER: $LANGFUSE_CLICKHOUSE_USER
      CLICKHOUSE_PASSWORD: $LANGFUSE_CLICKHOUSE_PASSWORD
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      LANGFUSE_USE_AZURE_BLOB: ${LANGFUSE_USE_AZURE_BLOB:-false}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-eu-west-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: $VERSITYGW_ROOT_ACCESS_KEY
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: $VERSITYGW_ROOT_SECRET_KEY
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-https://s3.nas.$BASE_DOMAINNAME}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-eu-west-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: $VERSITYGW_ROOT_ACCESS_KEY
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: $VERSITYGW_ROOT_SECRET_KEY
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-https://s3.nas.$BASE_DOMAINNAME}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BATCH_EXPORT_BUCKET:-langfuse}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: ${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_BATCH_EXPORT_REGION:-eu-west-1}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT:-https://s3.nas.$BASE_DOMAINNAME}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT:-https://s3.nas.$BASE_DOMAINNAME}
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: $VERSITYGW_ROOT_ACCESS_KEY
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: $VERSITYGW_ROOT_SECRET_KEY
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: ${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE:-true}
      LANGFUSE_INGESTION_QUEUE_DELAY_MS: ${LANGFUSE_INGESTION_QUEUE_DELAY_MS:-}
      LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: ${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS:-}
      REDIS_HOST: ${REDIS_HOST:-langfuse-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_AUTH: $LANGFUSE_REDIS_PASSWORD
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_TLS_CA: ${REDIS_TLS_CA:-/certs/ca.crt}
      REDIS_TLS_CERT: ${REDIS_TLS_CERT:-/certs/redis.crt}
      REDIS_TLS_KEY: ${REDIS_TLS_KEY:-/certs/redis.key}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_CONNECTION_URL: ${SMTP_CONNECTION_URL:-}
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 10s

  langfuse-web:
    image: langfuse/langfuse:4.6.0@sha256:2e535d8e163c78f5c7162773280578c7e7aafe3b0589fc60a9a1225746b60fc7
    container_name: langfuse-web
    restart: $RESTART_POLICY_PROGRAMMING
    depends_on: *langfuse-depends-on
    profiles:
      - programming
      - langfuse
    networks:
      - t3_proxy
      - langfuse_backend
    user: nextjs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /home/nextjs/.cache:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /app/node_modules/.cache:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "3G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_URL: https://langfuse.$DOMAINNAME
      NEXTAUTH_SECRET: $LANGFUSE_SALT_NEXTAUTH_SECRET
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      ## OIDC SSO
      AUTH_DISABLE_USERNAME_PASSWORD: true
      AUTH_CUSTOM_NAME: Pocket ID
      AUTH_CUSTOM_ISSUER: https://pocketid.$BASE_DOMAINNAME
      AUTH_CUSTOM_CLIENT_ID: $LANGFUSE_CLIENT_ID
      AUTH_CUSTOM_CLIENT_SECRET: $LANGFUSE_CLIENT_SECRET
      AUTH_CUSTOM_SCOPE: openid email profile
      # AUTH_CUSTOM_AUTHORIZATION_URL: dummy
      # AUTH_CUSTOM_TOKEN_URL: dummy
      # AUTH_CUSTOM_USERINFO_URL: dummy
      ## LLM Connection
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: aigateway.gpu.$BASE_DOMAINNAME # NOTE: It shouldn't have https prefix
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:3000/api/public/health",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.langfuse-web-rtr.entrypoints: "websecure"
      traefik.http.routers.langfuse-web-rtr.rule: "Host(`langfuse.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.langfuse-web-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.langfuse-web-rtr.service: "langfuse-web-svc"
      traefik.http.services.langfuse-web-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.langfuse.config.domain: "langfuse.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "langfuse"
      homepage.icon: "langfuse.svg"
      homepage.href: "https://langfuse.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "LLM engineering platform: LLM Observability, metrics, evals, prompt management, playground, datasets"
      ####### GLANCE #######
      glance.name: "langfuse"
      glance.icon: "sh:langfuse"
      glance.url: "https://langfuse.$DOMAINNAME"
      glance.description: "LLM engineering platform: LLM Observability, metrics, evals, prompt management, playground, datasets"
