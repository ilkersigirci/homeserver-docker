services:
  kreuzberg:
    image: ghcr.io/kreuzberg-dev/kreuzberg:4.9.9@sha256:095c3d1315edf9c859ef8d026b0ca358377e3d8963d16a486e189a668d09b75e
    container_name: kreuzberg
    restart: $RESTART_POLICY_PROGRAMMING
    command: serve --host 0.0.0.0 --port 8000 --config /config/kreuzberg.toml
    profiles:
      - programming
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/kreuzberg/data:/data
      - $REPO_PATH/appdata/kreuzberg/cache:/app/.kreuzberg
      - $REPO_PATH/configs/kreuzberg/config.toml:/config/kreuzberg.toml:rw
    environment:
      KREUZBERG_CORS_ORIGINS: https://docparse.$DOMAINNAME, https://scalar.$DOMAINNAME
      KREUZBERG_MAX_UPLOAD_SIZE_MB: 500
      KREUZBERG_CACHE_DIR: /app/.kreuzberg
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "kreuzberg", "--version"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.kreuzberg-rtr.entrypoints: "websecure"
      traefik.http.routers.kreuzberg-rtr.rule: "Host(`docparse.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.kreuzberg-rtr.middlewares: "middlewares-scalar-openapi-cors@file,chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.kreuzberg-rtr.service: "kreuzberg-svc"
      traefik.http.services.kreuzberg-svc.loadbalancer.server.port: "8000"
      ####### TINYAUTH #######
      tinyauth.apps.kreuzberg.config.domain: "docparse.$DOMAINNAME"
      tinyauth.apps.kreuzberg.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "kreuzberg"
      homepage.icon: "kreuzberg.png"
      homepage.href: "https://docparse.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A polyglot document intelligence framework with a Rust core"
      ####### GLANCE #######
      glance.name: "kreuzberg"
      glance.icon: "sh:kreuzberg"
      glance.url: "https://docparse.$DOMAINNAME"
      glance.description: "A polyglot document intelligence framework with a Rust core"
