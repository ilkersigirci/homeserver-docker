networks:
  linkwarden_backend:

services:
  linkwarden-db:
    image: postgres:18.4@sha256:1a5b3e745bbd82d6deb146505e504da3c2f248cac15e431951b148fbe4f8613a
    container_name: linkwarden-db
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
    networks:
      - linkwarden_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/linkwarden-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  # TODO: Harden
  # NOTE: Linkwarden bundles Playwright browsers under /root, so keep upstream root
  # runtime while granting only the file-permission override needed for archives.
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.1@sha256:31cf4bd2a2e111991fa5c9de03174c8698869c83722105c6ce529e4c911e6861
    container_name: linkwarden
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      linkwarden-db:
        condition: service_healthy
    profiles:
      - custom-user
      - reading
    networks:
      - t3_proxy
      - linkwarden_backend
    # user: node
    # read_only: true
    # tmpfs:
    #   - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/data/linkwarden:/data/data
    environment:
      STORAGE_FOLDER: /data
      NEXTAUTH_URL: https://linkwarden.$DOMAINNAME/api/v1/auth
      NEXTAUTH_SECRET: $LINKWARDEN_NEXTAUTH_SECRET
      DATABASE_URL: postgresql://postgres:postgres@linkwarden-db:5432/postgres
      NEXT_PUBLIC_DISABLE_REGISTRATION: true
      ## OIDC
      NEXT_PUBLIC_CREDENTIALS_ENABLED: false
      NEXT_PUBLIC_KEYCLOAK_ENABLED: true
      KEYCLOAK_CUSTOM_NAME: PocketID
      KEYCLOAK_ISSUER: https://pocketid.$BASE_DOMAINNAME
      KEYCLOAK_CLIENT_ID: $LINKWARDEN_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET: $LINKWARDEN_CLIENT_SECRET
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--silent", "--fail", "--max-time", "3", "http://127.0.0.1:3000/"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.linkwarden-rtr.entrypoints: "websecure"
      traefik.http.routers.linkwarden-rtr.rule: "Host(`linkwarden.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.linkwarden-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.linkwarden-rtr.service: "linkwarden-svc"
      traefik.http.services.linkwarden-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.linkwarden.config.domain: "linkwarden.$DOMAINNAME"
      tinyauth.apps.linkwarden.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Linkwarden"
      homepage.icon: "linkwarden.webp"
      homepage.href: "https://linkwarden.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Bookmark Manager"
      homepage.widget.type: "linkwarden"
      homepage.widget.url: "http://linkwarden:3000"
      homepage.widget.key: "$LINKWARDEN_ACCESS_TOKEN"
      ####### GLANCE #######
      glance.name: Linkwarden
      glance.icon: sh:linkwarden
      glance.url: https://linkwarden.$DOMAINNAME
      glance.description: Bookmark Manager
