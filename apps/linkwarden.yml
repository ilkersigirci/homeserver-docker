services:
  # TODO: Move to postgres 16.4
  linkwarden-db:
    container_name: linkwarden-db
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - custom-user
      - reading
    networks:
      - t3_proxy
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - $REPO_PATH/data/linkwarden-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # TODO: Harden
  linkwarden:
    container_name: linkwarden
    image: ghcr.io/linkwarden/linkwarden:latest@sha256:c5b9b4db571c468270cd916acebd5e6490b54393d90c1a2ccb9919a194ed7d51
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      linkwarden-db:
        condition: service_healthy
    profiles:
      - custom-user
      - reading
    networks:
      - t3_proxy
    # user: node
    # read_only: true
    # tmpfs:
    #   - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/data/linkwarden:/data/data
    environment:
      STORAGE_FOLDER: /data
      NEXTAUTH_URL: https://linkwarden.$DOMAINNAME/api/v1/auth
      NEXTAUTH_SECRET: $LINKWARDEN_NEXTAUTH_SECRET
      DATABASE_URL: postgresql://postgres:postgres@linkwarden-db:5432/postgres
      NEXT_PUBLIC_DISABLE_REGISTRATION: true
      ## OIDC
      NEXT_PUBLIC_CREDENTIALS_ENABLED: false
      NEXT_PUBLIC_KEYCLOAK_ENABLED: true
      KEYCLOAK_CUSTOM_NAME: PocketID
      KEYCLOAK_ISSUER: https://pocketid.$BASE_DOMAINNAME
      KEYCLOAK_CLIENT_ID: $LINKWARDEN_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET: $LINKWARDEN_CLIENT_SECRET
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.linkwarden-rtr.entrypoints: "websecure"
      traefik.http.routers.linkwarden-rtr.rule: "Host(`linkwarden.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.linkwarden-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.linkwarden-rtr.service: "linkwarden-svc"
      traefik.http.services.linkwarden-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.linkwarden.config.domain: "linkwarden.$DOMAINNAME"
      tinyauth.apps.linkwarden.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Linkwarden"
      homepage.icon: "linkwarden.webp"
      homepage.href: "https://linkwarden.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Bookmark Manager"
      homepage.widget.type: "linkwarden"
      homepage.widget.url: "http://linkwarden:3000"
      homepage.widget.key: "$LINKWARDEN_ACCESS_TOKEN"
