services:
  deemix:
    image: ghcr.io/bambanah/deemix:latest
    container_name: deemix
    restart: $RESTART_POLICY_MEDIA
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/deemix:/config
      - $REPO_PATH/configs/deemix/config.json:/config/config.json
      - $REPO_PATH/configs/deemix/login.json:/config/login.json
      - $DIR_MEDIA/Music/Deemix:/downloads
    environment:
      PUID: $PUID
      PGID: $PGID
      UMASK_SET: 022
      DEEMIX_SINGLE_USER: true
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.deemix-rtr.entrypoints: "websecure"
      traefik.http.routers.deemix-rtr.rule: "Host(`deemix.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.deemix-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.deemix-rtr.service: "deemix-svc"
      traefik.http.services.deemix-svc.loadbalancer.server.port: "6595"
      ####### TINYAUTH #######
      tinyauth.apps.deemix.config.domain: "deemix.$DOMAINNAME"
      tinyauth.apps.deemix.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Deemix"
      homepage.icon: "deemix.svg"
      homepage.href: "https://deemix.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Deezer Music Downloader"
    profiles:
      - media
