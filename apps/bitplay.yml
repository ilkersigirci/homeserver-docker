# NOTE: Nothing is working on Firefox
services:
  bitplay:
    image: ghcr.io/aculix/bitplay:main@sha256:afa8aee7f9cf7a12c0d33a010c222ed4dc5795335e1415527f7a185d5950c7a3
    container_name: bitplay
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/bitplay:/app/config
      - $REPO_PATH/appdata/bitplay:/app/torrent-data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3347/ || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.bitplay-rtr.entrypoints: "websecure"
      traefik.http.routers.bitplay-rtr.rule: "Host(`bitplay.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.bitplay-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.bitplay-rtr.service: "bitplay-svc"
      traefik.http.services.bitplay-svc.loadbalancer.server.port: "3347"
      ####### TINYAUTH #######
      tinyauth.apps.bitplay.config.domain: "bitplay.$DOMAINNAME"
      tinyauth.apps.bitplay.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "bitplay"
      homepage.icon: "bitplay.png"
      homepage.href: "https://bitplay.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Stream video torrents in your web browser with ease."
      ####### GLANCE #######
      glance.name: "bitplay"
      glance.icon: "sh:bitplay"
      glance.url: "https://bitplay.$DOMAINNAME"
      glance.description: "Stream video torrents in your web browser with ease."
