services:
  scalar:
    image: scalarapi/api-reference:0.5.48@sha256:4d1d6023028819cf787db9d5c7d32a9847f9dd028840012db990acd93d2cbe71
    container_name: scalar
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /data/caddy:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=775
      - /config/caddy:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    cpus: "0.5"
    mem_limit: "256M"
    ulimits:
      nofile:
        soft: 2048
        hard: 4096
    volumes:
      - $REPO_PATH/configs/scalar/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      DOMAINNAME: $DOMAINNAME
      READECK_API_TOKEN_ALLROLES: $READECK_API_TOKEN_ALLROLES
      # Add more APIs by appending objects in "sources".
      # Add matching source-level "servers" for APIs that publish localhost/default servers.
      # If a target API needs browser CORS from Scalar, add
      # middlewares-scalar-openapi-cors@file before its auth chain.
      API_REFERENCE_CONFIG: |-
        {
          "sources": [
            {
              "title": "Kreuzberg API",
              "slug": "kreuzberg",
              "url": "https://docparse.${DOMAINNAME}/openapi.json",
              "servers": [
                {
                  "url": "https://docparse.${DOMAINNAME}",
                  "description": "Kreuzberg via Traefik"
                }
              ]
            },
            {
              "title": "Readeck API",
              "slug": "readeck",
              "url": "/openapi/readeck.json",
              "servers": [
                {
                  "url": "https://scalar.${DOMAINNAME}/readeck-api",
                  "description": "Readeck via Scalar token proxy"
                }
              ]
            }
          ],
          "agent": { "disabled": true },
          "persistAuth": false
        }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.scalar-rtr.entrypoints: "websecure"
      traefik.http.routers.scalar-rtr.rule: "Host(`scalar.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.scalar-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.scalar-rtr.service: "scalar-svc"
      traefik.http.services.scalar-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.scalar.config.domain: "scalar.$DOMAINNAME"
      tinyauth.apps.scalar.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "scalar"
      homepage.icon: "sh:scalar"
      homepage.href: "https://scalar.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Generic Scalar UI for multiple OpenAPI specs"
      ####### GLANCE #######
      glance.name: "scalar"
      glance.icon: "sh:scalar"
      glance.url: "https://scalar.$DOMAINNAME"
      glance.description: "Generic Scalar UI for multiple OpenAPI specs"
