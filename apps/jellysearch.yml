services:
  jellysearch:
    image: domistyle/jellysearch
    container_name: jellysearch
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      - jellyfin
    profiles:
      - media
      - jellyfin
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/jellyfin:/config:ro # Jellyfin config
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      MEILI_URL: http://jellyfin-meilisearch:7700
      MEILI_MASTER_KEY: "1234"
      INDEX_CRON: "0 0 0/2 ? * * *"
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.jellysearch-rtr.entrypoints: "websecure"
      traefik.http.routers.jellysearch-rtr.rule: "Host(`jellyfin.$DOMAINNAME`) && (QueryRegexp(`searchTerm`, `(.*?)`) || QueryRegexp(`SearchTerm`, `(.*?)`))"
      ## Middlewares
      traefik.http.routers.jellysearch-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.jellysearch-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.jellysearch-rtr.service: "jellysearch-svc"
      traefik.http.services.jellysearch-svc.loadbalancer.server.port: "5000"
      ####### TINYAUTH #######
      tinyauth.apps.jellyfin.config.domain: "jellyfin.$DOMAINNAME"
      tinyauth.apps.jellyfin.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "jellysearch"
      homepage.icon: "jellysearch.png"
      homepage.description: "A fast full-text search proxy for Jellyfin"
      ####### GLANCE #######
      glance.name: "jellysearch"
      glance.parent: "jellyfin"
