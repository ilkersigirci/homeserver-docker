# TODO: Harden
services:
  apprise-api:
    image: lscr.io/linuxserver/apprise-api:v1.5.4-ls261@sha256:9a0d15b11aa1e9979ff05ba21abfd8b5d586d73d4b2d0c81fa406f8b1b39aaee
    container_name: apprise-api
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - root
      - maintenance
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/apprise-api:/config
      - $REPO_PATH/data/apprise-api/attachments:/attachments
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: 0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.apprise-api-rtr.entrypoints: "websecure"
      traefik.http.routers.apprise-api-rtr.rule: "Host(`apprise-api.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.apprise-api-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.apprise-api-rtr.service: "apprise-api-svc"
      traefik.http.services.apprise-api-svc.loadbalancer.server.port: "8000"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "apprise"
      homepage.icon: "apprise.png"
      homepage.href: "https://apprise-api.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A lightweight REST framework that wraps the Apprise Notification Library"
      ####### GLANCE #######
      glance.name: "apprise"
      glance.icon: "sh:apprise"
      glance.url: "https://apprise-api.$DOMAINNAME"
      glance.description: "A lightweight REST framework that wraps the Apprise Notification Library"

  # NOTE: By default, bind volume user is 1000.
  apprise-original:
    image: caronc/apprise:2.0.1@sha256:0b2913b15c8eb47c25345722985ffbfae701326edde21909c205d296d62dd52c
    container_name: apprise
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - root
      - not-used
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/apprise:/config
    environment:
      BASE_URL: https://apprise.$DOMAINNAME
      LOG_LEVEL: INFO
      DEBUG: no
      APPRISE_CONFIG_DIR: /config
      # SECRET_KEY: $APPRISE_SECRET_KEY
      APPRISE_WORKER_COUNT: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.apprise-rtr.entrypoints: "websecure"
      traefik.http.routers.apprise-rtr.rule: "Host(`apprise.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.apprise-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.apprise-rtr.service: "apprise-svc"
      traefik.http.services.apprise-svc.loadbalancer.server.port: "8000"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "apprise"
      homepage.icon: "apprise.png"
      homepage.href: "https://apprise.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Push Notifications that work with just about every platform!"
      ####### GLANCE #######
      glance.name: "apprise"
      glance.icon: "sh:apprise"
      glance.url: "https://apprise.$DOMAINNAME"
      glance.description: "Push Notifications that work with just about every platform!"
