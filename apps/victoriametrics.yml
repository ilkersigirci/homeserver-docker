services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.147.0@sha256:40ea45a6d14b6ad9f2f1fff597309d456ff9885d77d8d1da5fd559b251db9987
    container_name: victoriametrics
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - monitoring
      - crowdsec
    networks:
      - crowdsec_lapi
    expose:
      - 8428
    # TODO: Should we expose this or use traefik?
    ports:
      - "8428:8428"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/victoriametrics:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:8428/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "victoriametrics"
      homepage.icon: "victoriametrics.png"
      homepage.target: "_blank"
      homepage.description: "Fast, cost-effective monitoring solution and time series database"
      ####### GLANCE #######
      glance.name: "victoriametrics"
      glance.icon: "sh:victoriametrics"
      glance.description: "Fast, cost-effective monitoring solution and time series database"
