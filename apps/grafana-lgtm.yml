services:
  grafana-lgtm:
    image: grafana/otel-lgtm:0.30.1@sha256:bb182ac3174a20923fa58f00d1790fa71eb06cc0150078c0b0e8feb9e6611492
    container_name: grafana-lgtm
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - monitoring
    networks:
      - t3_proxy
    expose:
      - 3000 # Grafana
      - 3100 # Loki
      - 3200 # tempo
      - 3500 # Pyroscope
      - 4317 # OTLP/gRPC
      - 4318 # OTLP/HTTP
      - 9090 # Prometheus
      - 9411 # Zipkin
    ports:
      - "4317:4317" # OTLP/gRPC
    user: $PUID:$PGID # TODO: Harden
    read_only: true
    tmpfs:
      - /tmp
      - /var/tempo:rw,noexec,nosuid,nodev,size=256m,uid=$PUID,gid=$PGID,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "2.0"
    mem_limit: 2G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      ## CONFIGS
      - $REPO_PATH/configs/grafana-lgtm/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - $REPO_PATH/configs/grafana-lgtm/grafana/provisioning/datasources/victoriametrics.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/victoriametrics.yaml:ro
      - $REPO_PATH/configs/grafana-lgtm/loki/default_with_hostname.yaml:/otel-lgtm/loki-config.yaml:ro
      - $REPO_PATH/configs/grafana-lgtm/tempo/default.yaml:/otel-lgtm/tempo-config.yaml:ro
      - $REPO_PATH/configs/grafana-lgtm/prometheus/default.yaml:/otel-lgtm/prometheus.yaml:ro
      - $REPO_PATH/configs/grafana-lgtm/prometheus/rules:/otel-lgtm/prometheus-rules:ro
      - $REPO_PATH/configs/grafana-lgtm/pyroscope/default.yaml:/otel-lgtm/pyroscope-config.yaml:ro
      - $REPO_PATH/configs/grafana-lgtm/otelcol/default.yaml:/otel-lgtm/otelcol-config.yaml:ro
      ## DATA
      - $REPO_PATH/appdata/grafana-lgtm:/data
    environment:
      TZ: $TZ
      ################## GRAFANA CONFIGS ##################
      ##### NORMAL CONFIGS #####
      GF_DEFAULT_INSTANCE_NAME: $DOMAINNAME
      GF_SERVER_ROOT_URL: https://grafana.$DOMAINNAME
      GF_PATHS_DATA: /data/grafana
      GF_PATHS_PROVISIONING: /otel-lgtm/grafana/conf/provisioning
      GF_LOG_LEVEL: "info"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/OTEL/Traefik-Opentelemetry.json
      # GF_PANELS_DISABLE_SANITIZE_HTML: "true" # Allow raw HTML/JS in text panels (XSS risk).
      # GF_PLUGINS_ENABLE_ALPHA: "true" # Enable alpha plugins (experimental quality).
      # GF_SECURITY_ALLOW_EMBEDDING: "true" # Allow Grafana in iframes.
      # GF_PLUGINS_PREINSTALL: "yesoreyeram-infinity-datasource" # Preinstall Infinity datasource plugin.
      GF_FEATURE_TOGGLES_ENABLE: "provisioning" # Enable new provisioning/Git Sync features.
      ##### AUTH CONFIGS #####
      ## Normal Auth ##
      # GF_SECURITY_ADMIN_USER: admin
      # GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
      GF_USERS_ALLOW_SIGN_UP: false
      ## OAUTH ##
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_AUTH_BASIC_ENABLED: false
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_AUTH_OAUTH_AUTO_LOGIN: true
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: PocketID
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: $GRAFANA_CLIENT_ID
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: $GRAFANA_CLIENT_SECRET
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://pocketid.$BASE_DOMAINNAME/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://pocketid.$BASE_DOMAINNAME/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://pocketid.$BASE_DOMAINNAME/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: true
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: true
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: false
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'"
      ################ OTHER CONFIGS ##################
      LOKI_ARGS: --limits.retention-period=90d --pattern-ingester.enabled=true
      # TEMPO_EXTRA_ARGS:
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=90d
      # PYROSCOPE_EXTRA_ARGS:
      # OTELCOL_EXTRA_ARGS:
      ################ CUSTOM ENV VARS ################
      CROWDSEC_VICTORIAMETRICS_URL: $CROWDSEC_VICTORIAMETRICS_URL
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "3",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 2m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.grafana-lgtm-rtr.entrypoints: "websecure"
      traefik.http.routers.grafana-lgtm-rtr.rule: "Host(`grafana.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.grafana-lgtm-rtr.middlewares: "chain-no-auth-relaxed@file" # NOTE: Otherwise some fields not showing
      ## HTTP Services
      traefik.http.routers.grafana-lgtm-rtr.service: "grafana-lgtm-svc"
      traefik.http.services.grafana-lgtm-svc.loadbalancer.server.port: "3000"
      # NOTE: A Grafana recreate may drop a small amount of telemetry, but does not affect apps.
      ## gRPC Router (RPC)
      traefik.http.routers.grafana-lgtm-rpc-rtr.entrypoints: "websecure"
      traefik.http.routers.grafana-lgtm-rpc-rtr.rule: "Host(`grafana-rpc.$DOMAINNAME`) && HeaderRegexp(`Content-Type`, `(?i)^application/grpc.*`)"
      traefik.http.routers.grafana-lgtm-rpc-rtr.tls: "true"
      traefik.http.routers.grafana-lgtm-rpc-rtr.middlewares: "chain-rpc@file,grafana-lgtm-rpc-allowlist"
      traefik.http.routers.grafana-lgtm-rpc-rtr.service: "grafana-lgtm-rpc-svc"
      ## OTLP HTTP Router
      traefik.http.routers.grafana-lgtm-rpc-http-rtr.entrypoints: "websecure"
      traefik.http.routers.grafana-lgtm-rpc-http-rtr.rule: "Host(`grafana-rpc.$DOMAINNAME`) && PathPrefix(`/v1/`)"
      traefik.http.routers.grafana-lgtm-rpc-http-rtr.tls: "true"
      traefik.http.routers.grafana-lgtm-rpc-http-rtr.middlewares: "chain-rpc@file,grafana-lgtm-rpc-allowlist"
      traefik.http.routers.grafana-lgtm-rpc-http-rtr.service: "grafana-lgtm-rpc-http-svc"
      ## OTLP ingress hardening (LAN/VPN allow list)
      traefik.http.middlewares.grafana-lgtm-rpc-allowlist.ipallowlist.sourcerange: "$LOCAL_IPS"
      ## gRPC Service (h2c)
      traefik.http.services.grafana-lgtm-rpc-svc.loadbalancer.server.port: "4317"
      traefik.http.services.grafana-lgtm-rpc-svc.loadbalancer.server.scheme: "h2c"
      ## OTLP HTTP Service
      traefik.http.services.grafana-lgtm-rpc-http-svc.loadbalancer.server.port: "4318"
      ####### TINYAUTH #######
      tinyauth.apps.grafana-lgtm.config.domain: "grafana.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "grafana-lgtm"
      homepage.icon: "grafana.svg"
      homepage.href: "https://grafana.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "AIO OpenTelemetry Backend"
      ####### GLANCE #######
      glance.name: "grafana-lgtm"
      glance.icon: "sh:grafana"
      glance.url: "https://grafana.$DOMAINNAME"
      glance.description: "AIO OpenTelemetry Backend"
