services:
  withoutbg:
    image: withoutbg/app:1.3.1@sha256:6aae7b11c45f2ad90fc03a57c98f9e9b80d7edf9e97f66d835ce989e1b52e4cf
    container_name: withoutbg
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.withoutbg-rtr.entrypoints: "websecure"
      traefik.http.routers.withoutbg-rtr.rule: "Host(`withoutbg.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.withoutbg-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.withoutbg-rtr.service: "withoutbg-svc"
      traefik.http.services.withoutbg-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.withoutbg.config.domain: "withoutbg.$DOMAINNAME"
      tinyauth.apps.withoutbg.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "withoutbg"
      homepage.icon: "withoutbg.png"
      homepage.href: "https://withoutbg.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Image Background Removal Toolkit"
      ####### GLANCE #######
      glance.name: "withoutbg"
      glance.icon: "sh:withoutbg"
      glance.url: "https://withoutbg.$DOMAINNAME"
      glance.description: "Image Background Removal Toolkit"
