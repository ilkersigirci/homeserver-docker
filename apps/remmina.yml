services:
  remmina:
    image: lscr.io/linuxserver/remmina
    container_name: remmina
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/remmina:/config
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.remmina-rtr.entrypoints: "websecure"
      traefik.http.routers.remmina-rtr.rule: "Host(`remmina.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.remmina-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.remmina-rtr.service: "remmina-svc"
      traefik.http.services.remmina-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.remmina.config.domain: "remmina.$DOMAINNAME"
      tinyauth.apps.remmina.ip.bypass: "$LOCAL_IPS"
