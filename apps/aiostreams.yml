services:
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.29.6@sha256:4b0e529664354382d4a496b168ecfbd1973d4dc33e1de3e652adf79f35ec1285
    container_name: aiostreams
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      - nzbdav
    profiles:
      - media
    networks:
      - t3_proxy
    ports:
      - "1006:3000"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/appdata/aiostreams:/app/data
    environment:
      ADDON_NAME: AIOStreams
      ADDON_ID: aiostreams.$DOMAINNAME
      BASE_URL: https://aiostreams.$DOMAINNAME
      AIOSTREAMS_AUTH: $AIOSTREAMS_AUTH
      SECRET_KEY: $AIOSTREAMS_SECRET_KEY
      TMDB_ACCESS_TOKEN: $TMDB_API_READ_ACCESS_TOKEN
    # env_file:
    #   - $REPO_PATH/.env.aiostreams
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/scripts/healthcheck.js"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.aiostreams-rtr.entrypoints: "websecure"
      traefik.http.routers.aiostreams-rtr.rule: "Host(`aiostreams.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.aiostreams-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.aiostreams-rtr.service: "aiostreams-svc"
      traefik.http.services.aiostreams-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.aiostreams.config.domain: "aiostreams.$DOMAINNAME"
      tinyauth.apps.aiostreams.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "aiostreams"
      homepage.icon: "aiostreams.png"
      homepage.href: "https://aiostreams.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Consolidates multiple Stremio addons and debrid services into a single addon"
      ####### GLANCE #######
      glance.name: "aiostreams"
      glance.icon: "sh:aiostreams"
      glance.url: "https://aiostreams.$DOMAINNAME"
      glance.description: "Consolidates multiple Stremio addons and debrid services into a single addon"
