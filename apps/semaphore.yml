services:
  semaphore:
    # image: public.ecr.aws/semaphore/pro/server:v2.16.47
    image: semaphoreui/semaphore:latest@sha256:6771256a64d848324f3726f07b688883fbb5dc257def079f0b16e6fb4d86e9dc
    container_name: semaphore
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      # TODO: Fix volume bind permission issues
      # - $REPO_PATH/data/semaphore:/var/lib/semaphore # Contains frequently changing files.
      # - $REPO_PATH/appdata/semaphore:/tmp/semaphore # Contains cache: cloned repositories, generated inventory files, etc.
      # - $REPO_PATH/configs/semaphore:/etc/semaphore
      - $REPO_PATH/ansible:/srv/ansible:ro
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: admin
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@$BASE_DOMAINNAME
      # SEMAPHORE_USE_REMOTE_RUNNER: "True"
      SEMAPHORE_GOTIFY_ALERT: True
      SEMAPHORE_GOTIFY_URL: https://gotify.$BASE_DOMAINNAME
      SEMAPHORE_GOTIFY_TOKEN: $GOTIFY_SEMAPHORE_TOKEN
      ANSIBLE_HOST_KEY_CHECKING: False
      # SEMAPHORE_OIDC_PROVIDERS: |
      #   {
      #     "{{ idp_domain }}": {
      #       "provider_url": "https://{{ idp_domain }}/oauth2/openid/{{ semaphore_oidc_client_id }}",
      #       "client_id": "{{ semaphore_oidc_client_id }}",
      #       "client_secret": "{{ semaphore_oidc_client_secret }}",
      #       "redirect_url": "https://{{ semaphore_domain }}/api/auth/oidc/{{ idp_domain }}/redirect",
      #       "name_claim": "name",
      #       "display_name": "Sign in with {{ idp_domain }}"
      #     }
      #   }
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.semaphore-rtr.entrypoints: "websecure"
      traefik.http.routers.semaphore-rtr.rule: "Host(`semaphore.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.semaphore-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.semaphore-rtr.service: "semaphore-svc"
      traefik.http.services.semaphore-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.semaphore.config.domain: "semaphore.$DOMAINNAME"
      tinyauth.apps.semaphore.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "semaphore"
      homepage.icon: "semaphore.png"
      homepage.href: "https://semaphore.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Modern UI and powerful API for Ansible"
      ####### GLANCE #######
      glance.name: "semaphore"
      glance.icon: "sh:semaphore"
      glance.url: "https://semaphore.$DOMAINNAME"
      glance.description: "Modern UI and powerful API for Ansible"
