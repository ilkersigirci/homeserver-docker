services:
  # NOTE: Local edge collector that receives OTLP from local services and forwards to central LGTM.
  otel-collector-agent:
    image: otel/opentelemetry-collector-contrib:0.152.0@sha256:f41d7995565df3733b7568702073a9c490792f9c6ac60684fe6a4da21a313f8d
    container_name: otel-collector-agent
    restart: $RESTART_POLICY_CORE
    command:
      - --config=/etc/otelcol/config.yaml
    profiles:
      - core
    networks:
      - t3_proxy
    expose:
      - 1888 # pprof extension
      - 4317 # OTLP gRPC receiver
      - 4318 # OTLP http receiver
      - 8888 # Prometheus metrics exposed by the Collector
      - 8889 # Prometheus exporter metrics
      - 13133 # health_check extension
      - 55679 # zpages extension
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/otel-collector/otelcol-agent-config.yaml:/etc/otelcol/config.yaml:ro
      - $REPO_PATH/data/otel-collector-agent:/var/lib/otelcol/file_storage
      - /:/hostfs:ro
    environment:
      TZ: $TZ
      OTEL_COLLECTOR_GATEWAY_ENDPOINT: $OTEL_COLLECTOR_GATEWAY_ENDPOINT
      OTEL_COLLECTOR_GATEWAY_INSECURE: $OTEL_COLLECTOR_GATEWAY_INSECURE
      OTEL_COLLECTOR_GATEWAY_AUTHORIZATION_HEADER: ${OTEL_COLLECTOR_GATEWAY_AUTHORIZATION_HEADER:-}
      OTEL_COLLECTOR_MEMORY_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_LIMIT_MIB:-256}
      OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB: ${OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-64}
      OTEL_COLLECTOR_SERVICE_NAMESPACE: ${OTEL_COLLECTOR_SERVICE_NAMESPACE:-edge}
      OTEL_COLLECTOR_HOST_NAME: $MY_HOSTNAME
      OTEL_COLLECTOR_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
    healthcheck:
      # Distroless image (no shell/curl). Use collector binary for a lightweight health probe.
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
