# TODO: Harden
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
    container_name: frigate
    restart: $RESTART_POLICY_MEDIA
    stop_grace_period: 30s # allow enough time to shut down the various services
    shm_size: "512mb"
    profiles:
      - root
      - media
    networks:
      - t3_proxy
    ports:
      - "1984:1984" # go2rtc web app
      - "8971:8971" # frigate web app and api port. For HA connection.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 1024
    cpus: "4.0"
    mem_limit: 6G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      - $REPO_PATH/configs/frigate:/config
      # - $REPO_PATH/data/frigate:/media/frigate
      - type: bind
        source: $DIR_MEDIA/CamRecordings
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      FRIGATE_RTSP_HOST: $FRIGATE_RTSP_HOST
      FRIGATE_RTSP_PORT: $FRIGATE_RTSP_PORT
      FRIGATE_RTSP_USER: $FRIGATE_RTSP_USER
      FRIGATE_RTSP_PASSWORD: $FRIGATE_RTSP_PASSWORD
      FRIGATE_MOSQUITTO_HOST: ${FRIGATE_MOSQUITTO_HOST:-mosquitto}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 3 http://127.0.0.1:8971/api/version >/dev/null || exit 1",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 3m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.frigate-rtr.entrypoints: "websecure"
      traefik.http.routers.frigate-rtr.rule: "Host(`kamera.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.frigate-rtr.middlewares: "chain-tinyauth-relaxed@file"
      # traefik.http.routers.frigate-rtr.middlewares: "chain-tinyauth-headers-relaxed@file" # NOTE: For tinyauth proxy auth
      ## HTTP Services
      traefik.http.routers.frigate-rtr.service: "frigate-svc"
      traefik.http.services.frigate-svc.loadbalancer.server.port: "8971"
      ####### TINYAUTH #######
      tinyauth.apps.frigate.config.domain: "kamera.$DOMAINNAME"
      # tinyauth.apps.frigate.oauth.groups: "family" # NOTE: For tinyauth proxy auth
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "frigate"
      homepage.icon: "frigate.png"
      homepage.href: "https://kamera.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "NVR with realtime local object detection for IP cameras"
      ####### GLANCE #######
      glance.name: "frigate"
      glance.icon: "sh:frigate"
      glance.url: "https://kamera.$DOMAINNAME"
      glance.description: "NVR with realtime local object detection for IP cameras"
