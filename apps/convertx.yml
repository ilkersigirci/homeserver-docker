services:
  convertx:
    image: ghcr.io/c4illin/convertx@sha256:e1f85be04bbaf8a55ead9261194c3ae0fa0957d303ea537127154860b2552afd
    container_name: convertx
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/convertx:/app/data
    environment:
      ACCOUNT_REGISTRATION: false
      JWT_SECRET: $CONVERTX_JWT_SECRET
      HTTP_ALLOWED: true
      ALLOW_UNAUTHENTICATED: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.convertx-rtr.entrypoints: "websecure"
      traefik.http.routers.convertx-rtr.rule: "Host(`convertx.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.convertx-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.convertx-rtr.service: "convertx-svc"
      traefik.http.services.convertx-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.convertx.config.domain: "convertx.$DOMAINNAME"
      tinyauth.apps.convertx.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "ConvertX"
      homepage.icon: "sh-convertx.webp"
      homepage.href: "https://convertx.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Online PDF Editor"
      ####### GLANCE #######
      glance.name: ConvertX
      glance.icon: sh:convertx
      glance.url: https://convertx.$DOMAINNAME
      glance.description: Online PDF Editor
