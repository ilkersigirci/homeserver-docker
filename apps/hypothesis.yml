networks:
  hypothesis_backend:

# Runbooks:
# - scripts/hypothesis/init.md: initialize the service and bootstrap user/OAuth.
# - scripts/hypothesis/import.md: import official hypothes.is annotations.
services:
  hypothesis-db:
    image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    container_name: hypothesis-db
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - hypothesis
    networks:
      - hypothesis_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "0.5"
    mem_limit: "512M"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/hypothesis/postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: hypothesis
      POSTGRES_PASSWORD: hypothesis
      POSTGRES_DB: hypothesis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  hypothesis-elasticsearch:
    image: hypothesis/elasticsearch:elasticsearch7.10@sha256:6bb6c0acca6a60d16318510fe3eddb89a44b0bda3ce98788fc594a1aa0791772
    container_name: hypothesis-elasticsearch
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - hypothesis
    networks:
      - hypothesis_backend
    expose:
      - 9200
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,uid=$PUID,gid=$PGID,mode=1777
      - /usr/share/elasticsearch/config:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=775
      - /usr/share/elasticsearch/config/jvm.options.d:rw,noexec,nosuid,nodev,size=1m,uid=$PUID,gid=$PGID,mode=775
      - /usr/share/elasticsearch/logs:rw,noexec,nosuid,nodev,size=128m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "1.0"
    mem_limit: "1536M"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - $REPO_PATH/data/hypothesis/elasticsearch:/usr/share/elasticsearch/data
      - $REPO_PATH/configs/hypothesis/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - $REPO_PATH/configs/hypothesis/elasticsearch/jvm.options:/usr/share/elasticsearch/config/jvm.options:ro
      - $REPO_PATH/configs/hypothesis/elasticsearch/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:ro
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:9200/_cluster/health?local=true"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m

  hypothesis-rabbitmq:
    image: rabbitmq:4.3-management-alpine@sha256:e6862a7d804c80fc72d2265aed3b725fd9a6afd330b735363eeecc4b6ec4dd3d
    container_name: hypothesis-rabbitmq
    hostname: hypothesis-rabbitmq
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - hypothesis
    networks:
      - hypothesis_backend
    expose:
      - 5672  # AMQP
      - 15672 # Management UI
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "0.5"
    mem_limit: "512M"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/hypothesis/rabbitmq:/var/lib/rabbitmq
      - $REPO_PATH/configs/hypothesis/rabbitmq/20-compat.conf:/etc/rabbitmq/conf.d/20-compat.conf:ro
    environment:
      RABBITMQ_DEFAULT_USER: hypothesis
      RABBITMQ_DEFAULT_PASS: hypothesis
      RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT: 2GB
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m

  # TODO: Harden
  hypothesis:
    image: hypothesis/hypothesis:20260310-g031840e@sha256:277f47a5848569a7368ea05822760bb07da7b4536e13ca1b52bbef349322f6b3
    container_name: hypothesis
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      hypothesis-db:
        condition: service_healthy
      hypothesis-elasticsearch:
        condition: service_healthy
      hypothesis-rabbitmq:
        condition: service_healthy
    profiles:
      - reading
      - hypothesis
    networks:
      - t3_proxy
      - hypothesis_backend
    expose:
      - 5000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 1024
    cpus: "1.5"
    mem_limit: "1536M"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment: &hypothesis-env
      APP_URL: https://hypothesis.$DOMAINNAME
      AUTHORITY: hypothesis.$DOMAINNAME
      BROKER_URL: amqp://hypothesis:hypothesis@hypothesis-rabbitmq:5672//
      CLIENT_URL: ${HYPOTHESIS_CLIENT_URL:-https://cdn.hypothes.is/hypothesis}
      CLIENT_OAUTH_ID: $HYPOTHESIS_CLIENT_OAUTH_ID
      CLIENT_RPC_ALLOWED_ORIGINS: https://hypothesis.$DOMAINNAME
      DATABASE_URL: postgresql://hypothesis:hypothesis@hypothesis-db:5432/hypothesis
      ELASTICSEARCH_URL: http://hypothesis-elasticsearch:9200
      SECRET_KEY: $HYPOTHESIS_SECRET_KEY
      ENABLE_NGINX: true
      ENABLE_WEB: true
      WEB_NUM_WORKERS: ${HYPOTHESIS_WEB_NUM_WORKERS:-1}
      ENABLE_WEBSOCKET: false
      ENABLE_WEBSOCKET_MONOLITHIC: true
      WEBSOCKET_NUM_WORKERS: ${HYPOTHESIS_WEBSOCKET_NUM_WORKERS:-1}
      WEBSOCKET_URL: wss://hypothesis.$DOMAINNAME/ws
      ENABLE_WORKER: true
      H_API_AUTH_COOKIE_SECRET_KEY: $HYPOTHESIS_API_AUTH_COOKIE_SECRET_KEY
      H_API_AUTH_COOKIE_SALT: $HYPOTHESIS_API_AUTH_COOKIE_SALT
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.hypothesis-rtr.entrypoints: "websecure"
      traefik.http.routers.hypothesis-rtr.rule: "Host(`hypothesis.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.hypothesis-rtr.middlewares: "chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.hypothesis-rtr.service: "hypothesis-svc"
      traefik.http.services.hypothesis-svc.loadbalancer.server.port: "5000"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Hypothesis"
      homepage.icon: "hypothesis.png"
      homepage.href: "https://hypothesis.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Web annotation server"
      ####### GLANCE #######
      glance.name: "Hypothesis"
      glance.icon: "sh:hypothesis"
      glance.url: "https://hypothesis.$DOMAINNAME"
      glance.description: "Web annotation server"

  # NOTE: One-shot helper for database/search initialization and local
  # user/OAuth bootstrap. See scripts/hypothesis/init.md before running it.
  hypothesis-init:
    image: hypothesis/hypothesis:20260310-g031840e@sha256:277f47a5848569a7368ea05822760bb07da7b4536e13ca1b52bbef349322f6b3
    container_name: hypothesis-init
    restart: "no"
    depends_on:
      hypothesis-db:
        condition: service_healthy
      hypothesis-elasticsearch:
        condition: service_healthy
      hypothesis-rabbitmq:
        condition: service_healthy
    profiles:
      - hypothesis-init
    networks:
      - hypothesis_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "1.0"
    mem_limit: "1G"
    environment:
      <<: *hypothesis-env
      HYPOTHESIS_BOOTSTRAP_USERNAME: $HYPOTHESIS_BOOTSTRAP_USERNAME
      HYPOTHESIS_BOOTSTRAP_EMAIL: $HYPOTHESIS_BOOTSTRAP_EMAIL
      HYPOTHESIS_BOOTSTRAP_PASSWORD: $HYPOTHESIS_BOOTSTRAP_PASSWORD
      HYPOTHESIS_BOOTSTRAP_ADMIN: true
      HYPOTHESIS_BOOTSTRAP_OAUTH_CLIENT_NAME: HypothesisClient
      HYPOTHESIS_BOOTSTRAP_OAUTH_REDIRECT_URI: https://hypothesis.gpu.ilkerflix.com/app.html
    volumes:
      - $REPO_PATH/configs/hypothesis/command.py:/tmp/hypothesis-command.py:ro
    command: ["python", "/tmp/hypothesis-command.py"]
