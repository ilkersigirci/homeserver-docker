services:
  kiwix-serve:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:0b6541355b250c6b45d2d7725e88f22f1d6a0f45ad9480d9c0bd4bc58436a12f
    container_name: kiwix-serve
    restart: $RESTART_POLICY_MEDIA
    # command: wikipedia.zim wiktionary.zim
    command: "*.zim"
    profiles:
      - media
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $DIR_KIWIX:/data
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.kiwix-serve-rtr.entrypoints: "websecure"
      traefik.http.routers.kiwix-serve-rtr.rule: "Host(`kiwix.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.kiwix-serve-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.kiwix-serve-rtr.service: "kiwix-serve-svc"
      traefik.http.services.kiwix-serve-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.kiwix-serve.config.domain: "kiwix.$DOMAINNAME"
      tinyauth.apps.kiwix-serve.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "kiwix-serve"
      homepage.icon: "kiwix-serve.png"
      homepage.href: "https://kiwix.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A ZIM compatible Web server"
      ####### GLANCE #######
      glance.name: "kiwix-serve"
      glance.icon: "sh:kiwix-serve"
      glance.url: "https://kiwix.$DOMAINNAME"
      glance.description: "A ZIM compatible Web server"
