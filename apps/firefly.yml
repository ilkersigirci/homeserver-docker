services:
  firefly:
    container_name: firefly
    image: fireflyiii/core:latest@sha256:8134c37b14e52e97b5076fc5b859199387bc3f115ddaa5ffe5510f3f95b354d2
    restart: $RESTART_POLICY_OTHERS
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/freshrss:/config
    environment:
      TZ: $TZ
      APP_KEY_FILE: /run/secrets/firefly_app_key
      AUTHENTICATION_GUARD: "web" # remote_user_guard
      #  - AUTHENTICATION_GUARD_HEADER=REMOTE_USER # HTTP_REMOTE_USER
      DB_CONNECTION: sqlite # Options: pgsql, mysql
    secrets:
      - firefly_app_key
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.firefly-rtr.entrypoints: "websecure"
      traefik.http.routers.firefly-rtr.rule: "Host(`firefly.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.firefly-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.firefly-rtr.service: "firefly-svc"
      traefik.http.services.firefly-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.firefly.config.domain: "firefly.$DOMAINNAME"
      tinyauth.apps.firefly.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Others"
      homepage.name: "Firefly III"
      homepage.icon: "firefly.svg"
      homepage.href: "https://firefly.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A personal finances manager"
    profiles:
      - others
