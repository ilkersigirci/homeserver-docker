services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/arcane-headless:v1.19.1@sha256:7e0a456f54b2ff6d433917d4829d81631b318cd4fd038b55b05e25aaf0a29f9c
    container_name: arcane-agent
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      - t3_proxy
      - socket_proxy_exec
    ports:
      - "3553:3553"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/arcane-agent:/app/data
    environment:
      AGENT_MODE: true
      AGENT_TOKEN: $ARCANE_AGENT_TOKEN
      ANALYTICS_DISABLED: true
      DOCKER_HOST: tcp://docker-socket-proxy-exec:2375
      EDGE_TRANSPORT: auto
      ENVIRONMENT: production
      GPU_MONITORING_ENABLED: false
      MANAGER_API_URL: https://arcane.gpu.$BASE_DOMAINNAME
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3553/api/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "arcane-agent"
      homepage.icon: "arcane.png"
      homepage.description: "Modern Docker Management Remote Agent"
      ####### GLANCE #######
      glance.name: "arcane-agent"
      glance.icon: "sh:arcane"
      glance.description: "Modern Docker Management Remote Agent"
