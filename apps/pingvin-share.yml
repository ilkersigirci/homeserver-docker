services:
  pingvin-share:
    image: ghcr.io/stonith404/pingvin-share:latest
    container_name: pingvin-share
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - "$REPO_PATH/configs/pingvin-share/config.yaml:/opt/app/config.yaml" # Add this line, if you want to configure pingvin-share via config file and not via UI
      - "$REPO_PATH/appdata/pingvin-share/data:/opt/app/backend/data"
      - "$REPO_PATH/appdata/pingvin-share/data/images:/opt/app/frontend/public/img"
    environment:
      PUID: $PUID
      PGID: $PGID
      TRUST_PROXY: true
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.pingvin-share-rtr.entrypoints: "websecure"
      traefik.http.routers.pingvin-share-rtr.rule: "Host(`pingvin-share.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.pingvin-share-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.pingvin-share-rtr.service: "pingvin-share-svc"
      traefik.http.services.pingvin-share-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.pingvin-share.config.domain: "pingvin-share.$DOMAINNAME"
      tinyauth.apps.pingvin-share.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "pingvin-share"
      homepage.icon: "pingvin-share.png"
      homepage.href: "https://pingvin-share.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A self-hosted file sharing platform"
      ####### GLANCE #######
      glance.name: "pingvin-share"
      glance.icon: "sh:pingvin-share"
      glance.url: "https://pingvin-share.$DOMAINNAME"
      glance.description: "A self-hosted file sharing platform"
