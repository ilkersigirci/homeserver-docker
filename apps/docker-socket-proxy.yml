x-socket-proxy-service: &socket_proxy_service
  image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls96@sha256:cba12c42b1df30a6446856028f5ab726e9d8921f1ea74be509216c5e41357d42
  restart: $RESTART_POLICY_CORE
  read_only: true
  tmpfs:
    - /run:rw,noexec,nosuid,nodev,size=16m
  profiles:
    - root
    - core
  pids_limit: 128
  cpus: "0.50"
  mem_limit: "256M"
  ulimits:
    nofile:
      soft: 4096
      hard: 8192
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add: []
  volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
      bind:
        create_host_path: false
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
    interval: 1m
    timeout: 5s
    retries: 3
    start_period: 10s

## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
## 0 to revoke access. 1 to grant access.
x-socket-proxy-env-common: &socket_proxy_env_common
  LOG_LEVEL: info # debug,info,notice,warning,err,crit,alert,emerg
  ALLOW_START: 0
  ALLOW_STOP: 0
  ALLOW_RESTARTS: 0
  AUTH: 0
  BUILD: 0
  COMMIT: 0
  CONFIGS: 0
  CONTAINERS: 1
  DISABLE_IPV6: 0
  DISTRIBUTION: 0
  EVENTS: 1
  EXEC: 0
  IMAGES: 1
  INFO: 1
  NETWORKS: 1
  NODES: 0
  PING: 1
  PLUGINS: 0
  POST: 0
  PROXY_READ_TIMEOUT: 240
  SECRETS: 0
  SERVICES: 0
  SESSION: 0
  SWARM: 0
  SYSTEM: 0
  TASKS: 0
  VERSION: 1
  VOLUMES: 0

x-socket-proxy-env-mutable: &socket_proxy_env_mutable
  <<: *socket_proxy_env_common
  ALLOW_START: 1
  ALLOW_STOP: 1
  ALLOW_RESTARTS: 1
  POST: 1
  VOLUMES: 1

services:
  docker-socket-proxy-read:
    container_name: docker-socket-proxy-read
    <<: *socket_proxy_service
    networks:
      - socket_proxy_read
    ports:
      # - "127.0.0.1:2375:2375" # Keep host access local-only. Other containers use socket_proxy network.
      - "2375:2375" # NOTE: Enable only if you intentionally expose Docker API in LAN.
    environment:
      <<: *socket_proxy_env_common
      CONTAINERS: 1 # Read-only consumers (Homepage, Dozzle, Tinyauth, Beszel, Glances)
      IMAGES: 1 # Read-only image metadata for dashboards

  # Mutable Docker access without exec: use for automation/controllers that
  # need create/start/stop/remove/pull actions but should not run commands in containers.
  docker-socket-proxy-write:
    container_name: docker-socket-proxy-write
    <<: *socket_proxy_service
    networks:
      - socket_proxy_write
    environment:
      <<: *socket_proxy_env_mutable

  # High-privilege proxy for workloads that require docker exec capabilities.
  docker-socket-proxy-exec:
    container_name: docker-socket-proxy-exec
    <<: *socket_proxy_service
    networks:
      - socket_proxy_exec
    environment:
      <<: *socket_proxy_env_mutable
      EXEC: 1
