services:
  obsidian:
    container_name: obsidian
    image: lscr.io/linuxserver/obsidian:latest
    restart: $RESTART_POLICY_DESKTOP_IMAGES
    shm_size: "1gb"
    profiles:
      - desktop_apps
    networks:
      - t3_proxy
    ports:
      - "3001:3000"
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DIR_NOTES/Markdown:/vaults
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      TITLE: Obsidian
      PIXELFLUX_WAYLAND: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:3000 || exit 1"]
      start_period: 15s
      interval: 1m
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.obsidian-rtr.entrypoints: "websecure"
      traefik.http.routers.obsidian-rtr.rule: "Host(`obsidian.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.obsidian-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.obsidian-rtr.service: "obsidian-svc"
      traefik.http.services.obsidian-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.obsidian.config.domain: "obsidian.$DOMAINNAME"
      tinyauth.apps.obsidian.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "DesktopApps"
      homepage.name: "Obsidian"
      homepage.icon: "obsidian.svg"
      homepage.href: "https://obsidian.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Note Taking with Markdown"
    # For Nvidia Zero Copy Rendering
    group_add:
      # - "44" # video
      - "992" # render
    devices:
      # - /dev/dri:/dev/dri
      - /dev/dri/renderD128:/dev/dri/renderD128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute,video,graphics,utility]