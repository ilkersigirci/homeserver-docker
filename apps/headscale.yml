services:
  # Configuration file: https://github.com/tale/headplane/blob/main/config.example.yamls
  # NOTE: docker exec headscale headscale apikeys create --expiration 360d
  headscale:
    image: ghcr.io/juanfont/headscale:0.28.0@sha256:51b1b9182bb6219e97374fa89af6b9320d6f87ecc739e328d5357ea4fa7a5ce3
    container_name: headscale
    command: serve
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      - t3_proxy
    expose:
      - "8080"
      - "9090"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /var/run/headscale
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/headscale:/etc/headscale:ro
      - $REPO_PATH/data/headscale:/var/lib/headscale
    environment:
      TZ: $TZ
    healthcheck:
      test: ["CMD", "headscale", "health"]
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.headscale-rtr.entrypoints: "websecure"
      traefik.http.routers.headscale-rtr.rule: "Host(`headscale.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.middlewares.headscale-cors.headers.accessControlAllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      traefik.http.middlewares.headscale-cors.headers.accessControlAllowHeaders: "Authorization,Content-Type"
      traefik.http.middlewares.headscale-cors.headers.accessControlAllowOriginList: "https://headscale.$DOMAINNAME"
      traefik.http.middlewares.headscale-cors.headers.accessControlMaxAge: "100"
      traefik.http.middlewares.headscale-cors.headers.addVaryHeader: "true"
      # Attach Middleware to Router
      traefik.http.routers.headscale-rtr.middlewares: "headscale-cors,chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.headscale-rtr.service: "headscale-svc"
      traefik.http.services.headscale-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.headscale.config.domain: "headscale.$DOMAINNAME"
      tinyauth.apps.headscale.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "headscale"
      homepage.icon: "headscale.png"
      homepage.href: "https://headscale.$DOMAINNAME/admin"
      homepage.target: "_blank"
      homepage.description: "An open source, self-hosted implementation of the Tailscale control server"
      ####### GLANCE #######
      glance.name: "headscale"
      glance.icon: "sh:headscale"
      glance.url: "https://headscale.$DOMAINNAME/admin"
      glance.description: "An open source, self-hosted implementation of the Tailscale control server"
      ##### HEADPLANE #####
      me.tale.headplane.target: "headscale"

  # Configuration file: https://github.com/tale/headplane/blob/main/config.example.yaml
  headplane:
    image: ghcr.io/tale/headplane:0.7.0-beta.2@sha256:f6706d3447225d3c8c1ea9057e29cc1edfe3370fc87c75c6b20189e59036a370
    container_name: headplane
    restart: $RESTART_POLICY_CORE
    depends_on:
      headscale:
        condition: service_healthy
    profiles:
      - custom-user
      - core
    networks:
      - t3_proxy
      - socket_proxy_write
    user: 65532:65532
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/headplane/config.example.yml:/etc/headplane/config.yaml:ro
      - $REPO_PATH/data/headplane:/var/lib/headplane
      ## Headscale related
      - $REPO_PATH/configs/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - $REPO_PATH/data/headscale:/var/lib/headscale:ro
      # If using dns.extra_records in Headscale (recommended), this should
      # match the headscale.dns_records_path in your config.yaml
      # - $REPO_PATH/configs/headscale/dns_records.json:/etc/headscale/dns_records.json
    environment:
      ## SERVER
      HEADPLANE_SERVER__HOST: 0.0.0.0
      HEADPLANE_SERVER__PORT: 3000
      HEADPLANE_SERVER__BASE_URL: https://headscale.$DOMAINNAME
      HEADPLANE_SERVER__COOKIE_SECRET: $HEADPLANE_COOKIE_SECRET
      ## HEADSCALE
      HEADPLANE_HEADSCALE__URL: https://headscale.$DOMAINNAME
      HEADPLANE_HEADSCALE__PUBLIC_URL: https://headscale.$DOMAINNAME
      HEADPLANE_HEADSCALE__API_KEY: $HEADSCALE_API_KEY
      ## INTEGRATION
      HEADPLANE_INTEGRATION__AGENT__ENABLED: true
      HEADPLANE_INTEGRATION__AGENT__HOST_NAME: $HEADPLANE_AGENT_HOST_NAME
      HEADPLANE_INTEGRATION__DOCKER__ENABLED: true
      HEADPLANE_INTEGRATION__DOCKER__SOCKET: tcp://docker-socket-proxy-write:2375
      ## OIDC
      HEADPLANE_OIDC__ENABLED: true
      HEADPLANE_OIDC__ISSUER: https://pocketid.$BASE_DOMAINNAME
      HEADPLANE_OIDC__HEADSCALE_API_KEY: $HEADSCALE_API_KEY # NOTE: Deprecated. Currently still required.
      HEADPLANE_OIDC__CLIENT_ID: $HEADSCALE_CLIENT_ID
      HEADPLANE_OIDC__CLIENT_SECRET: $HEADSCALE_CLIENT_SECRET
      HEADPLANE_OIDC__USE_PKCE: true
      HEADPLANE_OIDC__SCOPE: "openid email profile"
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.headplane-rtr.entrypoints: "websecure"
      traefik.http.routers.headplane-rtr.rule: "Host(`headscale.$DOMAINNAME`) && PathPrefix(`/admin`)"
      ## Middlewares
      # traefik.http.routers.headplane-rtr.middlewares: chain-tinyauth-relaxed@file
      traefik.http.routers.headplane-rtr.middlewares: "chain-no-auth-relaxed@file" # NOTE: For WASM SSH in the UI.
      ## HTTP Services
      traefik.http.routers.headplane-rtr.service: "headplane-svc"
      traefik.http.services.headplane-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.headscale.config.domain: "headscale.$DOMAINNAME"
      tinyauth.apps.headscale.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "headplane"
      homepage.icon: "headplane.png"
      homepage.href: "https://headscale.$DOMAINNAME/admin"
      homepage.target: "_blank"
      homepage.description: "A feature-complete Web UI for Headscale"
      ####### GLANCE #######
      glance.name: "headplane"
      glance.icon: "sh:headplane"
      glance.url: "https://headscale.$DOMAINNAME/admin"
      glance.description: "A feature-complete Web UI for Headscale"

  # NOTE: When changing ACL in admin ui, restart the headscale container to make it take effect.
  headscale-admin:
    image: goodieshq/headscale-admin:0.26.0@sha256:f8471106e993acf80d02b9dbb38fe3c27f17e3b4af62d4fbebb8aa89ab9e5640
    container_name: headscale-admin
    restart: $RESTART_POLICY_CORE
    depends_on:
      headscale:
        condition: service_healthy
    profiles:
      - not-used
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      ENDPOINT: "/admin"
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.headscale-admin-rtr.entrypoints: "websecure"
      traefik.http.routers.headscale-admin-rtr.rule: "Host(`headscale.$DOMAINNAME`) && PathPrefix(`/admin`)"
      ## Middlewares
      # traefik.http.routers.headscale-admin-rtr.middlewares: chain-tinyauth@file
      ## HTTP Services
      traefik.http.routers.headscale-admin-rtr.service: "headscale-admin-svc"
      traefik.http.services.headscale-admin-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.headscale.config.domain: "headscale.$DOMAINNAME"
      tinyauth.apps.headscale.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "headscale-admin"
      homepage.icon: "headscale.png"
      homepage.href: "https://headscale.$DOMAINNAME/admin"
      homepage.target: "_blank"
      homepage.description: "Admin Web Interface for headscale"
      ####### GLANCE #######
      glance.name: "headscale-admin"
      glance.icon: "sh:headscale"
      glance.url: "https://headscale.$DOMAINNAME/admin"
      glance.description: "Admin Web Interface for headscale"
