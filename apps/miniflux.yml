services:
  miniflux-db:
    container_name: miniflux-db
    image: postgres:latest@sha256:8da22df20409c62981f57682595ef617ee365ac905c48ab61d0ff8aafa83891d
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: miniflux
    volumes:
      - $REPO_PATH/appdata/miniflux-db:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD", "pg_isready", "-U", "miniflux"]
    #   interval: 1m
    #   start_period: 30s

    # Fever api endpoint: fever/?api
  miniflux:
    container_name: miniflux
    image: miniflux/miniflux:2.2.19@sha256:8810dfe7f4d9979f9dc1385607695c116f049daa586c635a9a1fb3c58936b074
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
    depends_on:
      - miniflux-db
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    # volumes:
    #   - $REPO_PATH/appdata/miniflux:/config
    environment:
      DATABASE_URL: postgres://miniflux:miniflux@miniflux-db/miniflux?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: miniflux
      ADMIN_PASSWORD: miniflux
      BASE_URL: https://miniflux.$DOMAINNAME
      # - "POCKET_CONSUMER_KEY=YOUR_POCKET_CONSUMER_KEY"
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.miniflux-rtr.entrypoints: "websecure"
      traefik.http.routers.miniflux-rtr.rule: "Host(`miniflux.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.miniflux-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.miniflux-rtr.service: "miniflux-svc"
      traefik.http.services.miniflux-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.miniflux.config.domain: "miniflux.$DOMAINNAME"
      tinyauth.apps.miniflux.ip.bypass: "$LOCAL_IPS"
