networks:
  forgejo_ci:
    name: forgejo_ci
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
  forgejo_dind_egress:
    name: forgejo_dind_egress

services:
  forgejo-dind:
    image: docker:29-dind@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515
    container_name: forgejo-dind
    restart: $RESTART_POLICY_PROGRAMMING
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    profiles:
      - root
      - programming
      - forgejo
    networks:
      forgejo_dind_egress:
      forgejo_ci:
        ipv4_address: 172.31.250.10
    privileged: true
    user: "0:0"
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 1024
    cpus: "4.0"
    mem_limit: "6G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/data/forgejo/dind:/var/lib/docker
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2375 info > /dev/null 2>&1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s

  forgejo-dind-gc:
    image: docker:29-cli@sha256:862099ada15c669000bef53aa4cb9d821262829f45b0dda2159ccb276443043b
    container_name: forgejo-dind-gc
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - forgejo
    networks:
      - forgejo_ci
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      TZ: $TZ
      HOME: /tmp
      DOCKER_HOST: tcp://172.31.250.10:2375
      DOCKER_CONFIG: /tmp/.docker
      GC_INTERVAL_SECONDS: 21600 # 6 hours
      GC_UNTIL: 48h
      GC_DRY_RUN: 1
    depends_on:
      forgejo-dind:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        echo "forgejo-dind-gc: pruning every $${GC_INTERVAL_SECONDS}s (until=$${GC_UNTIL})"
        while true; do
          if [ "$${GC_DRY_RUN}" = "1" ]; then
            echo "forgejo-dind-gc: dry-run enabled; showing current usage only"
            docker system df -v || true
            docker builder du || true
          else
            docker system prune -af --volumes --filter "until=$${GC_UNTIL}" || true
            docker builder prune -af --filter "until=$${GC_UNTIL}" || true
          fi
          sleep "$${GC_INTERVAL_SECONDS}"
        done

  # NOTE: First run without the daemon command to initialize the runner, then use the daemon command one.
  # NOTE: docker exec -it forgejo-runner /bin/sh -c "forgejo-runner register"
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:12.13.1@sha256:e070b166b921f12a2abef432cf6108e63519d0183722c2a14ecbb8d0b0621652
    container_name: forgejo-runner
    restart: $RESTART_POLICY_PROGRAMMING
    # command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config /config.yml"'
    depends_on:
      forgejo-dind:
        condition: service_healthy
    profiles:
      - programming
      - forgejo
    networks:
      - forgejo_dind_egress
      - forgejo_ci
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/forgejo/runner:/data
      - $REPO_PATH/configs/forgejo/runner/config.yml:/config.yml:ro
    environment:
      DOCKER_HOST: tcp://172.31.250.10:2375
      DOCKER_BUILDKIT: 1
