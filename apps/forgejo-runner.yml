networks:
  forgejo_ci:
    name: forgejo_ci
    internal: true
  forgejo_dind_egress:
    name: forgejo_dind_egress
 
services:
  forgejo-dind:
    image: docker:29-dind
    container_name: forgejo-dind
    privileged: true
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - forgejo
    networks:
      - forgejo_dind_egress
      - forgejo_ci
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - $REPO_PATH/data/forgejo/dind:/var/lib/docker
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://127.0.0.1:2375 info > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  forgejo-dind-gc:
    image: clockworksoul/docker-gc-cron:latest
    container_name: forgejo-dind-gc
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - forgejo
    depends_on:
      forgejo-dind:
        condition: service_healthy
    networks:
      - forgejo_ci
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
      DOCKER_HOST: tcp://forgejo-dind:2375
      CRON: 0 0 */6 * * *
      FORCE_IMAGE_REMOVAL: 1
      FORCE_CONTAINER_REMOVAL: 1
      GRACE_PERIOD_SECONDS: 172800 # 2 days
      DRY_RUN: 1
      CLEAN_UP_VOLUMES: 1

  # NOTE: Create `$REPO_PATH/data/forgejo/runner` dir with current user beforehand.
  # NOTE: First run without the daemon command to initialize the runner, then use the daemon command one.
  # NOTE: docker exec -it forgejo-runner /bin/sh -c "forgejo-runner register"
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    user: $PUID:$PGID
    restart: $RESTART_POLICY_PROGRAMMING
    # command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config /config.yml"'
    security_opt:
      - no-new-privileges:true
    depends_on:
      forgejo-dind:
        condition: service_healthy
    profiles:
      - programming
      - forgejo
    networks:
      - forgejo_dind_egress
      - forgejo_ci
    environment:
      DOCKER_HOST: tcp://forgejo-dind:2375
      DOCKER_BUILDKIT: 1
    volumes:
      - $REPO_PATH/data/forgejo/runner:/data
      - $REPO_PATH/configs/forgejo/runner/config.yml:/config.yml