services:
  openarchiver:
    image: logiclabshq/open-archiver:latest@sha256:e57f6ad9953aa70b1d9e900d78c0b74517e102aeacb3af8f4836479926422189
    container_name: openarchiver
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      openarchiver-db:
        condition: service_healthy
      openarchiver-valkey:
        condition: service_started
      openarchiver-meilisearch:
        condition: service_started
      openarchiver-tika:
        condition: service_started
    profiles:
      - media
      - openarchiver
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/data/openarchiver:/var/data/open-archiver
    env_file: $REPO_PATH/.env.openarchiver
    environment:
      NODE_ENV: production
      REDIS_PASSWORD: $OPENARCHIVER_REDIS_PASSWORD
      MEILI_MASTER_KEY: $OPENARCHIVER_MEILI_MASTER_KEY
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.openarchiver-rtr.entrypoints: "websecure"
      traefik.http.routers.openarchiver-rtr.rule: "Host(`mailarchive.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.openarchiver-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.openarchiver-rtr.service: "openarchiver-svc"
      traefik.http.services.openarchiver-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.mailarchive.config.domain: "mailarchive.$DOMAINNAME"
      tinyauth.apps.mailarchive.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "openarchiver"
      homepage.icon: "openarchiver.png"
      homepage.href: "https://mailarchive.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A self-hosted, open-source email archiving solution with full-text search capability."
      ####### GLANCE #######
      glance.name: "openarchiver"
      glance.icon: "sh:openarchiver"
      glance.url: "https://mailarchive.$DOMAINNAME"
      glance.description: "A self-hosted, open-source email archiving solution with full-text search capability."

  openarchiver-db:
    image: postgres:18.3@sha256:059fa0289cc5a184034e05a1f4f6d6fd79f69dc718b8b04ab60b6b469eed411e
    container_name: openarchiver-db
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - openarchiver
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - t3_proxy
    expose:
      - "5432"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/data/openarchiver-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  openarchiver-valkey:
    image: valkey/valkey:9-alpine@sha256:e1095c6c76ee982cb2d1e07edbb7fb2a53606630a1d810d5a47c9f646b708bf5
    container_name: openarchiver-valkey
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - openarchiver
    command: valkey-server --requirepass $OPENARCHIVER_REDIS_PASSWORD
    volumes:
      - $REPO_PATH/appdata/openarchiver-valkey:/data
    networks:
      - t3_proxy
    expose:
      - "6379"

  openarchiver-meilisearch:
    image: getmeili/meilisearch:v1.15@sha256:fe500cf9cca05cb9f027981583f28eccf17d35d94499c1f8b7b844e7418152fc
    container_name: openarchiver-meilisearch
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - openarchiver
    environment:
      MEILI_MASTER_KEY: $OPENARCHIVER_MEILI_MASTER_KEY
    volumes:
      - $REPO_PATH/appdata/openarchiver-meilisearch:/meili_data
    networks:
      - t3_proxy
    expose:
      - "7700"

  openarchiver-tika:
    image: apache/tika:3.3.0.0-full@sha256:ecdd37e204308266b1f8e28569f8516ebd5b96d7a4518a71d3904710b20c03b3
    container_name: openarchiver-tika
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - openarchiver
    networks:
      - t3_proxy
    expose:
      - "9998"
