services:
  open-webui:
    image: ghcr.io/ilkersigirci/homeserver-open-webui:v0.12.0-slim@sha256:24510ab5a76a11284da16eeb1e9bea7b94323f7d237c819de47f95871a35459a
    container_name: open-webui
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
    depends_on:
      searxng:
        condition: service_started
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /app/backend/open_webui/static:uid=$PUID,gid=$PGID,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/open-webui:/app/backend/data
    # Docs: https://docs.openwebui.com/reference/env-configuration
    environment:
      ENABLE_PERSISTENT_CONFIG: false
      ############# WEBUI #############
      WEBUI_NAME: IlkerflixChat
      WEBUI_SECRET_KEY: $OPENWEBUI_WEBUI_SECRET_KEY
      WEBUI_URL: https://chat.$DOMAINNAME
      ENABLE_OLLAMA_API: false
      TASK_MODEL_EXTERNAL: ${OPENAI_TASK_MODEL:-openai/gpt-5.4-mini}
      ENABLE_FOLLOW_UP_GENERATION: false
      ENABLE_TAGS_GENERATION: false
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: false
      ENABLE_DIRECT_CONNECTIONS: false
      BYPASS_MODEL_ACCESS_CONTROL: true
      ############# OIDC #############
      ENABLE_SIGNUP: false
      ENABLE_LOGIN_FORM: false
      ENABLE_OAUTH_SIGNUP: true
      DEFAULT_USER_ROLE: pending
      OAUTH_CLIENT_ID: $OPENWEBUI_CLIENT_ID
      OAUTH_CLIENT_SECRET: $OPENWEBUI_CLIENT_SECRET
      OPENID_PROVIDER_URL: https://pocketid.$BASE_DOMAINNAME/.well-known/openid-configuration
      OAUTH_PROVIDER_NAME: Pocketid
      OAUTH_SCOPES: openid email profile groups offline_access llm:invoke # NOTE: LiteLLM validates this user access token for its own API audience.
      OAUTH_AUTHORIZE_PARAMS: '{"resource":"https://llm.$BASE_DOMAINNAME"}'
      OPENID_REDIRECT_URI: https://chat.$DOMAINNAME/oauth/oidc/callback
      OAUTH_GROUPS_CLAIM: groups
      ENABLE_OAUTH_ROLE_MANAGEMENT: true
      ENABLE_OAUTH_GROUP_MANAGEMENT: true
      ENABLE_OAUTH_GROUP_CREATION: true
      ENABLE_OAUTH_BACKCHANNEL_LOGOUT: true
      OAUTH_ADMIN_ROLES: admin
      OAUTH_ALLOWED_ROLES: "*"
      ############# WEB SEARCH #############
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: true
      ENABLE_WEB_SEARCH: true
      ENABLE_SEARCH_QUERY_GENERATION: true
      WEB_SEARCH_RESULT_COUNT: 15
      WEB_SEARCH_CONCURRENT_REQUESTS: 2
      WEB_SEARCH_ENGINE: searxng
      WEB_LOADER_ENGINE: safe_web # playwright
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      SEARXNG_LANGUAGE: all
      ############# OPENAI API #############
      ENABLE_OPENAI_API: true
      OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      OPENAI_API_KEY: "" # NOTE: Fill it when not using system_oauth
      OPENAI_API_CONFIGS: '{"0":{"auth_type":"system_oauth","headers":{"X-Langflow-Session-Id":"{{CHAT_ID}}"}}}' # NOTE: X-Langflow-Session-Id keeps one Langflow session per chat; LiteLLM forwards it to langflow/* models only.
      ENABLE_BASE_MODELS_CACHE: false
      ############# IMAGE GENERATION #############
      ENABLE_IMAGE_GENERATION: true
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      # IMAGES_OPENAI_API_KEY:  "" # NOTE: Fill it when not using system_oauth
      IMAGES_OPENAI_PARAMS: '{"additional_drop_params":["extra_headers"]}' # NOTE: LiteLLM duplicates forwarded headers into the generation body. Remove this when https://github.com/BerriAI/litellm/issues/40628 fixed
      IMAGE_GENERATION_MODEL: ${OPENAI_IMAGE_GENERATION_MODEL:-openai/gpt-image-2.5-flare}
      IMAGE_SIZE: ${OPENWEBUI_IMAGE_SIZE:-1024x1024}
      IMAGE_URL_RESPONSE_MODELS_REGEX_PATTERN: '^(openai/)?gpt-image' # NOTE: Prevents Open WebUI from sending unsupported response_format for your openai/gpt-image-* models
      ############# IMAGE EDIT #############
      ENABLE_IMAGE_EDIT: true
      IMAGE_EDIT_ENGINE: openai
      IMAGES_EDIT_OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      # IMAGES_EDIT_OPENAI_API_KEY: "" # NOTE: Fill it when not using system_oauth
      IMAGE_EDIT_MODEL: ${OPENWEBUI_IMAGE_EDIT_MODEL:-openai/gpt-image-2.5-flare}
      IMAGE_EDIT_SIZE: ${OPENWEBUI_IMAGE_SIZE:-1024x1024}
      IMAGE_AUTO_SIZE_MODELS_REGEX_PATTERN: '^(openai/)?gpt-image' # NOTE: Prevents Open WebUI from sending unsupported response_format for your openai/gpt-image-* models
      ############# AUDIO #############
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      # AUDIO_STT_OPENAI_API_KEY:  "" # NOTE: Fill it when not using system_oauth
      AUDIO_STT_MODEL: ${AUDIO_STT_MODEL:-openai/gpt-4o-mini-transcribe}
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      # AUDIO_TTS_OPENAI_API_KEY:  "" # NOTE: Fill it when not using system_oauth
      AUDIO_TTS_MODEL: ${AUDIO_TTS_MODEL:-openai/gpt-4o-mini-tts}
      AUDIO_TTS_VOICE: ${AUDIO_TTS_VOICE:-alloy}
      ############# AUDIO REALTIME #############
      AUDIO_REALTIME_ENABLED: true
      AUDIO_REALTIME_OPENAI_API_BASE_URL: https://litellm.coding.$BASE_DOMAINNAME/v1
      # AUDIO_REALTIME_OPENAI_API_KEY: "" # NOTE: Fill it when not using system_oauth
      AUDIO_REALTIME_MODEL: ${AUDIO_REALTIME_MODEL:-openai/gpt-realtime-2.1-mini}
      AUDIO_REALTIME_VOICE: ${AUDIO_REALTIME_VOICE:-marin}
      AUDIO_REALTIME_TRANSCRIPTION_MODEL: ${AUDIO_REALTIME_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe} # NOTE: LiteLLM forwards realtime session events unchanged, so this is OpenAI's own model ID.
      ############# CODE #############
      ## EXECUTION ##
      ENABLE_CODE_EXECUTION: true
      CODE_EXECUTION_ENGINE: pyodide
      ## INTERPRETER ##
      ENABLE_CODE_INTERPRETER: true
      CODE_INTERPRETER_ENGINE: pyodide
      ############# RAG #############
      BYPASS_EMBEDDING_AND_RETRIEVAL: true
      CONTENT_EXTRACTION_ENGINE: mistral_ocr # docling mineru
      MISTRAL_OCR_API_KEY: $MISTRAL_API_KEY
      # RAG_EMBEDDING_ENGINE: openai
      MISTRAL_API_KEY: $MISTRAL_API_KEY
      ############# USER PERMISSIONS #############
      USER_PERMISSIONS_CHAT_CONTROLS: true
      USER_PERMISSIONS_SETTINGS_INTERFACE: true
      USER_PERMISSIONS_CHAT_CALL: true
      ############# SECURITY HEADERS #############
      # NOTE: Temporary data: exception. Open WebUI 0.12.0 inlines its realtime-call AudioWorklet as a data: URL because the file is under Vite's 4 KiB assetsInlineLimit. Remove data: once Firefox stops logging the Report-Only violation below during a voice call.
      CONTENT_SECURITY_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'self'; frame-src 'self' https://*.$BASE_DOMAINNAME; worker-src 'self'; frame-ancestors 'self' https://*.$BASE_DOMAINNAME; form-action 'self'; base-uri 'self'; manifest-src 'self';"
      # NOTE: Enforced script-src without data:. Browsers only log violations to the console because no report collector exists; Chromium does not report worklet loads.
      CONTENT_SECURITY_POLICY_REPORT_ONLY: "script-src 'self' 'unsafe-inline'"
      ############# OTEL #############
      ENABLE_OTEL: false
      ENABLE_OTEL_TRACES: true
      ENABLE_OTEL_METRICS: true
      ENABLE_OTEL_LOGS: true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_SERVICE_NAME: open-webui
      OTEL_RESOURCE_ATTRIBUTES: ""
      ############# FULL IMAGE SPECIFIC #############
      # Disable local model downloads when using the full image.
      # OFFLINE_MODE: true
      # HF_HUB_OFFLINE: 1
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 2m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.open-webui-rtr.entrypoints: "websecure"
      traefik.http.routers.open-webui-rtr.rule: "Host(`chat.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.open-webui-rtr.middlewares: "chain-no-auth-media-devices@file"
      ## HTTP Services
      traefik.http.routers.open-webui-rtr.service: "open-webui-svc"
      traefik.http.services.open-webui-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.open-webui.config.domain: "chat.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "Open WebUI"
      homepage.icon: "open-webui-light.webp"
      homepage.href: "https://chat.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Selfhosted Chatgpt like App"
      ####### GLANCE #######
      glance.name: "open-webui"
      glance.icon: "sh:open-webui"
      glance.url: "https://chat.$DOMAINNAME"
      glance.description: "Selfhosted Chatgpt like App"
      glance.id: "open-webui"
