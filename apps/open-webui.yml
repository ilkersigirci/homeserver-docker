services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    container_name: open-webui
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
    depends_on:
      searxng:
        condition: service_started
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /app/backend/open_webui/static:uid=$PUID,gid=$PGID,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/open-webui:/app/backend/data
    # Docs: https://docs.openwebui.com/reference/env-configuration
    environment:
      ENABLE_PERSISTENT_CONFIG: false
      ############# WEBUI #############
      WEBUI_NAME: IlkerflixChat
      WEBUI_SECRET_KEY: $OPENWEBUI_WEBUI_SECRET_KEY
      WEBUI_URL: https://chat.$DOMAINNAME
      ENABLE_OLLAMA_API: false
      ENABLE_FOLLOW_UP_GENERATION: false
      ENABLE_TAGS_GENERATION: false
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: false
      ENABLE_DIRECT_CONNECTIONS: false
      BYPASS_MODEL_ACCESS_CONTROL: true
      OFFLINE_MODE: true
      HF_HUB_OFFLINE: 1
      ############# OIDC #############
      ENABLE_SIGNUP: false
      ENABLE_LOGIN_FORM: false
      ENABLE_OAUTH_SIGNUP: true
      DEFAULT_USER_ROLE: pending
      OAUTH_CLIENT_ID: $OPENWEBUI_CLIENT_ID
      OAUTH_CLIENT_SECRET: $OPENWEBUI_CLIENT_SECRET
      OPENID_PROVIDER_URL: https://pocketid.$BASE_DOMAINNAME/.well-known/openid-configuration
      OAUTH_PROVIDER_NAME: Pocketid
      OAUTH_SCOPES: openid email profile groups offline_access llm:invoke # NOTE: offline_access llm:invoke is for litellm SSO
      OAUTH_AUTHORIZE_PARAMS: '{"resource":"https://llm.$BASE_DOMAINNAME"}' # NOTE: For litellm SSO
      OPENID_REDIRECT_URI: https://chat.$DOMAINNAME/oauth/oidc/callback
      OAUTH_GROUP_CLAIM: groups
      ENABLE_OAUTH_ROLE_MANAGEMENT: false
      ENABLE_OAUTH_GROUP_MANAGEMENT: true
      ENABLE_OAUTH_GROUP_CREATION: true
      ############# WEB SEARCH #############
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: true
      ENABLE_WEB_SEARCH: true
      ENABLE_SEARCH_QUERY_GENERATION: true
      WEB_SEARCH_RESULT_COUNT: 15
      WEB_SEARCH_CONCURRENT_REQUESTS: 2
      WEB_SEARCH_ENGINE: searxng
      WEB_LOADER_ENGINE: safe_web # playwright
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      SEARXNG_LANGUAGE: all
      ############# OPENAI API #############
      # ENABLE_OPENAI_API: true
      # OPENAI_API_BASE_URL: $AIGATEWAY_BASE_URL
      # OPENAI_API_KEY: $AIGATEWAY_API_KEY
      ## OPENAI_API_BASE_URLS: https://api.openai.com/v1;$OPENROUTER_API_BASE_URL
      ## OPENAI_API_KEYS: $OPENAI_API_KEY;$OPENROUTER_API_KEY
      ############# OPENAI API - LiteLLM SSO #############
      ENABLE_OPENAI_API: true
      OPENAI_API_BASE_URL: https://litellm-sso.gpu.$BASE_DOMAINNAME/v1
      OPENAI_API_KEY: ""
      OPENAI_API_CONFIGS: '{"0":{"auth_type":"system_oauth"}}'
      ENABLE_BASE_MODELS_CACHE: false
      ############# IMAGE GENERATION #############
      ENABLE_IMAGE_GENERATION: true
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: $AIGATEWAY_BASE_URL
      IMAGES_OPENAI_API_KEY: $AIGATEWAY_API_KEY
      IMAGE_GENERATION_MODEL: ${OPENAI_IMAGE_GENERATION_MODEL:-gpt-image-1.5}
      IMAGE_SIZE: 1024x1024
      ############# CODE #############
      ## EXECUTION ##
      ENABLE_CODE_EXECUTION: true
      CODE_EXECUTION_ENGINE: pyodide
      ## INTERPRETER ##
      ENABLE_CODE_INTERPRETER: true
      CODE_INTERPRETER_ENGINE: pyodide
      ############# RAG #############
      BYPASS_EMBEDDING_AND_RETRIEVAL: true
      CONTENT_EXTRACTION_ENGINE: mistral_ocr # docling mineru
      MISTRAL_OCR_API_KEY: $MISTRAL_API_KEY
      # RAG_EMBEDDING_ENGINE: openai
      MISTRAL_API_KEY: $MISTRAL_API_KEY
      ############# USER PERMISSIONS #############
      USER_PERMISSIONS_CHAT_CONTROLS: true
      USER_PERMISSIONS_SETTINGS_INTERFACE: true
      USER_PERMISSIONS_CHAT_CALL: true
      ############# OTEL #############
      ENABLE_OTEL: false
      ENABLE_OTEL_TRACES: true
      ENABLE_OTEL_METRICS: true
      ENABLE_OTEL_LOGS: true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_SERVICE_NAME: open-webui
      OTEL_RESOURCE_ATTRIBUTES: ""
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 2m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.open-webui-rtr.entrypoints: "websecure"
      traefik.http.routers.open-webui-rtr.rule: "Host(`chat.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.open-webui-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.open-webui-rtr.service: "open-webui-svc"
      traefik.http.services.open-webui-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.open-webui.config.domain: "chat.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "Open WebUI"
      homepage.icon: "open-webui-light.webp"
      homepage.href: "https://chat.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Selfhosted Chatgpt like App"
      ####### GLANCE #######
      glance.name: "open-webui"
      glance.icon: "sh:open-webui"
      glance.url: "https://chat.$DOMAINNAME"
      glance.description: "Selfhosted Chatgpt like App"
      glance.id: "open-webui"
