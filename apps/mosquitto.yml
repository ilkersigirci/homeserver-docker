services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - monitoring
    networks:
      - t3_proxy
    ports:
      - "1883:1883" # default mqtt port
      - "9001:9001" # default mqtt port for websockets
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/mosquitto:/mosquitto/config
      - $REPO_PATH/data/mosquitto:/mosquitto/data
      - $REPO_PATH/logs/mosquitto:/mosquitto/log
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "healthcheck/mosquitto", "-m", "ping", "-q", "0"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "mosquitto"
      homepage.icon: "mosquitto.png"
      homepage.href: "#"
      homepage.target: "_blank"
      homepage.description: "Message broker that implements MQTT version 5, 3.1.1 and 3.1"
      ####### GLANCE #######
      glance.name: "mosquitto"
      glance.icon: "sh:mosquitto"
      glance.url: "#"
      glance.description: "Message broker that implements MQTT version 5, 3.1.1 and 3.1"
