services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.8.6@sha256:1a947a9d4ae515be27b381a2a1f8565d5fa33087c32abc2bb7a6754f83e95f4c
    container_name: bentopdf
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    user: 6969:6969
    read_only: true
    tmpfs:
      - /tmp:uid=6969,gid=6969,rw,noexec,nosuid,nodev
      - /var/cache/nginx:uid=6969,gid=6969,rw,noexec,nosuid,nodev
      - /etc/nginx/tmp:uid=6969,gid=6969,rw,noexec,nosuid,nodev
      - /var/lib/nginx/tmp:uid=6969,gid=6969,rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      # PUID: $PUID
      # PGID: $PGID
      PORT: 8080
      # DISABLE_IPV6: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.bentopdf-rtr.entrypoints: "websecure"
      traefik.http.routers.bentopdf-rtr.rule: "Host(`pdftool.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.bentopdf-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.bentopdf-rtr.service: "bentopdf-svc"
      traefik.http.services.bentopdf-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.bentopdf.config.domain: "pdftool.$DOMAINNAME"
      tinyauth.apps.bentopdf.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "bentopdf"
      homepage.icon: "bentopdf.png"
      homepage.href: "https://pdftool.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A Privacy First PDF Toolkit"
      ####### GLANCE #######
      glance.name: "bentopdf"
      glance.icon: "sh:bentopdf"
      glance.url: "https://pdftool.$DOMAINNAME"
      glance.description: "A Privacy First PDF Toolkit"
