services:
  loggifly:
    image: ghcr.io/clemcer/loggifly:v2.1.0@sha256:9f141d01602dffb9238fd39ece7bef845914297bc5eeb9c985e7525cb8abaf8c
    container_name: loggifly
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
      - socket_proxy_read
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/loggifly:/config:ro
    environment:
      DOCKER_HOST: $DOCKER_REMOTE_HOSTS
      TZ: $TZ
      APPRISE_URL: $GOTIFY_LOGGIFLY_APPRISE_URL
      LOG_LEVEL: "INFO"
      ENABLE_HEALTHCHECK: "true"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "loggifly"
      homepage.icon: "loggifly.png"
      homepage.target: "_blank"
      homepage.description: "Get Alerts from your Docker Container Logs"
      ####### GLANCE #######
      glance.name: "loggifly"
      glance.icon: "sh:loggifly"
      glance.description: "Get Alerts from your Docker Container Logs"
