services:
  logrotate:
    image: samuelrunggaldier/logrotate:latest@sha256:ef726584d80a1b1df2ac8768f1ef3916eac58e16191b138d0b0d27af816f011d
    container_name: logrotate
    restart: $RESTART_POLICY_CORE
    profiles:
      - root
      - core
    network_mode: "none"
    read_only: true
    tmpfs:
      - /etc/crontabs:rw,noexec,nosuid,nodev,size=1m
      - /etc/logrotate.d:rw,noexec,nosuid,nodev,size=1m
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/lib:rw,noexec,nosuid,nodev,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 64
    cpus: "0.10"
    mem_limit: 64M
    volumes:
      - $REPO_PATH/logs:/logs
    environment:
      TZ: $TZ
      LOGS_PATH: /logs/*/*.log
      TRIGGER_INTERVAL: daily
      MAX_SIZE: 100M
      MAX_BACKUPS: 10
      DELAYCOMPRESS: true
      SU_USER: root
      SU_GROUP: root
    healthcheck:
      test: ["CMD-SHELL", "test -r /etc/logrotate.d/docker-logs && pidof crond >/dev/null"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
