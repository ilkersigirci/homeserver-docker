services:
  # NOTE: On Immich -> Admin -> Settings -> Server Settings -> External Domain
  immich-public-proxy:
    image: ghcr.io/alangrainger/immich-public-proxy:3.2.1@sha256:7ca34cc3efa618a11674db00e1d943e4611cb2e14d1f6d73343757db700a6e3c
    container_name: immich-public-proxy
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      immich-server:
        condition: service_healthy
    profiles:
      - media
      - immich
    networks:
      - immich_backend
    ports:
      - "1003:3000"
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "3",
          "http://127.0.0.1:3000/share/healthcheck",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - $REPO_PATH/configs/immich-public-proxy/config.json:/app/config.json:ro
    environment:
      IMMICH_URL: http://immich-server:2283
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Immich-Public-Proxy"
      homepage.icon: "immich.svg"
      ####### GLANCE #######
      glance.name: "Immich-Public-Proxy"
      glance.icon: "sh:immich-public-proxy"
