services:
  # sudo chown -R nobody:nogroup $REPO_PATH/appdata/prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - node-exporter
    restart: $RESTART_POLICY_MAINTENANCE
    user: 65534:65534
    networks:
      - t3_proxy
    expose:
      - 9090
    # links:
    #   - cadvisor:cadvisor
    #   - alertmanager:alertmanager
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/prometheus:/prometheus
      - $REPO_PATH/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # - '--web.enable-lifecycle'
      # - '--web.enable-admin-api'
    # deploy:
    #   placement:
    #     constraints:
    #       - node.role==manager
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.prometheus-rtr.entrypoints: "websecure"
      traefik.http.routers.prometheus-rtr.rule: "Host(`prometheus.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.prometheus-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.prometheus-rtr.service: "prometheus-svc"
      traefik.http.services.prometheus-svc.loadbalancer.server.port: "9090"
      ####### TINYAUTH #######
      tinyauth.apps.prometheus.config.domain: "prometheus.$DOMAINNAME"
      tinyauth.apps.prometheus.ip.bypass: "$LOCAL_IPS"
    profiles:
      - monitoring
