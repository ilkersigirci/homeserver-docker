services:
  # NOTE: Full config example: https://github.com/gtsteffaniak/filebrowser/blob/main/frontend/public/config.generated.yaml
  filebrowser:
    container_name: filebrowser
    image: ghcr.io/gtsteffaniak/filebrowser:1.5.5-stable@sha256:ffc2c9914b37f6e9afc67e8cf5693f5fa63bb0a83491dc9229caa073828d7503
    profiles:
      - media
      - filebrowser
    restart: $RESTART_POLICY_MEDIA
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 128
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/filebrowser-quantum/config.yaml:/home/filebrowser/data/config.yaml:ro
      - $REPO_PATH/data/filebrowser-quantum/fb-data:/home/filebrowser/data
      - $REPO_PATH/data/filebrowser-quantum/local-data:/local-data
    environment:
      TZ: $TZ
      # FILEBROWSER_ADMIN_PASSWORD: $FILEBROWSER_ADMIN_PASSWORD
      # FILEBROWSER_JWT_TOKEN_SECRET: $FILEBROWSER_JWT_TOKEN_SECRET
      FILEBROWSER_ONLYOFFICE_SECRET: $FILEBROWSER_ONLYOFFICE_SECRET
      FILEBROWSER_OIDC_CLIENT_ID: $FILEBROWSER_CLIENT_ID
      FILEBROWSER_OIDC_CLIENT_SECRET: $FILEBROWSER_CLIENT_SECRET
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "3",
          "-o",
          "/dev/null",
          "http://127.0.0.1:80/health",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.filebrowser-rtr.entrypoints: "websecure"
      traefik.http.routers.filebrowser-rtr.rule: "Host(`drive.$DOMAINNAME`)"
      traefik.http.routers.filebrowser-share-rtr.entrypoints: "websecure"
      traefik.http.routers.filebrowser-share-rtr.rule: "Host(`share.$DOMAINNAME`) && (Path(`/public/share`) || PathPrefix(`/public/share/`) || Path(`/public/api`) || PathPrefix(`/public/api/`) || Path(`/public/static`) || PathPrefix(`/public/static/`))"
      ## Middlewares
      traefik.http.routers.filebrowser-rtr.middlewares: "chain-tinyauth-relaxed@file"
      traefik.http.routers.filebrowser-share-rtr.middlewares: "chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.filebrowser-rtr.service: "filebrowser-svc"
      traefik.http.routers.filebrowser-share-rtr.service: "filebrowser-svc"
      traefik.http.services.filebrowser-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.filebrowser.config.domain: "drive.$DOMAINNAME"
      tinyauth.apps.filebrowser.oauth.groups: "admin"
      # tinyauth.apps.filebrowser.path.allow: "^/public/(share|api|static)(/.*)?$"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "FileBrowser"
      homepage.icon: "filebrowser.svg"
      homepage.href: "https://drive.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "File Browser"
      ####### GLANCE #######
      glance.name: "FileBrowser"
      glance.icon: "sh:filebrowser"
      glance.url: "https://drive.$DOMAINNAME"
      glance.description: "File Browser"

  euro-office-documentserver:
    container_name: euro-office-documentserver
    image: ghcr.io/euro-office/documentserver:v9.3.3@sha256:6068075cc247f9283d337b2cf9a105d9df49fcd8cd6b5e82fa90640df1552e80
    profiles:
      - root
      - media
      - filebrowser
    restart: $RESTART_POLICY_MEDIA
    # stdin_open: true # NOTE: What does it do?
    tty: true # NOTE: What does it do?
    networks:
      - t3_proxy
    expose:
      - 80
    tmpfs:
      - /tmp
    volumes:
      - $REPO_PATH/data/filebrowser-quantum/euro-office-data:/var/www/euro-office/Data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "4G"
    ulimits:
      nofile:
        soft: 8192
        hard: 65536
    environment:
      JWT_ENABLED: true
      JWT_SECRET: $FILEBROWSER_ONLYOFFICE_SECRET
      EXAMPLE_ENABLED: false
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "5",
          "-o",
          "/dev/null",
          "http://127.0.0.1/healthcheck",
        ]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 10s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.euro-office-documentserver-rtr.entrypoints: "websecure"
      traefik.http.routers.euro-office-documentserver-rtr.rule: "Host(`office.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.euro-office-documentserver-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.euro-office-documentserver-rtr.service: "euro-office-documentserver-svc"
      traefik.http.services.euro-office-documentserver-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.euro-office-documentserver.config.domain: "office.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "euro-office-documentserver"
      homepage.icon: "onlyoffice.svg"
      homepage.href: "https://office.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Euro Office"
      ####### GLANCE #######
      glance.name: "euro-office-documentserver"
      glance.icon: "sh:onlyoffice"
      glance.url: "https://office.$DOMAINNAME"
      glance.description: "Euro Office"
