services:
  traefik:
    image: ghcr.io/traefik/traefik:v3.7.11@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    container_name: traefik
    restart: $RESTART_POLICY_CORE
    command: # CLI arguments. OTEL / OTLP Export (env-gated; local file logs stay enabled)
      - --accesslog=true
      - --accesslog.bufferingSize=100 # Configuring a buffer of 100 lines
      - --accesslog.fields.defaultMode=keep
      - --accesslog.fields.headers.defaultMode=drop
      - --accesslog.fields.headers.names.CF-Connecting-IP=keep
      - --accesslog.fields.headers.names.X-Forwarded-For=keep
      - --accesslog.fields.headers.names.X-Real-IP=keep
      - --accesslog.fields.headers.names.CF-IPCountry=keep
      - --accesslog.fields.headers.names.CF-Ray=keep
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Authorization=drop
      - --accesslog.fields.headers.names.Cookie=drop
      # CrowdSec tails this file; the generic logrotate service bounds its size with copytruncate.
      - --accesslog.filePath=/logs/access.log
      # Keep file logs even when OTLP export is enabled. For traefik>=3.7
      - --accesslog.dualoutput=${TRAEFIK_ACCESSLOG_FILE_ENABLED:-true}
      - --accesslog.filters.statusCodes=${TRAEFIK_ACCESSLOG_STATUS_CODES:-200-299,400-499,500-599}
      - --accesslog.format=json
      - --accesslog.otlp.grpc=${TRAEFIK_OTEL_ENABLED:-true}
      - --accesslog.otlp.grpc.endpoint=otel-collector-agent:4317
      - --accesslog.otlp.grpc.insecure=true
      - --accesslog.otlp.serviceName=traefik
      - --api=true
      - --api.dashboard=true
      - --api.insecure=false
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.propagation.delayBeforeChecks=90 # To delay DNS checks and reduce LE hitrate
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.email=$CLOUDFLARE_EMAIL
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme/acme.json
      # - --entrypoints.dot.address=:853
      # Only gpu_coding publishes this listener on the host for Marimo ACP.
      - --entrypoints.marimoagent.address=:3021
      - --entrypoints.traefik.address=:8080
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.underscoreHeadersStrategy=delete
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      # Allow these IPs to set the X-Forwarded-* headers - Cloudflare + trusted internal ranges
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=$CLOUDFLARE_IPS,$LOCAL_IPS
      - --entrypoints.websecure.http.underscoreHeadersStrategy=delete
      - --entrypoints.websecure.http.tls=true
      # Add dns-cloudflare as default certresolver for all services. Also enables TLS and no need to specify on individual services
      - --entrypoints.websecure.http.tls.certresolver=dns-cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=$DOMAINNAME
      - --entrypoints.websecure.http.tls.domains[0].sans=*.$DOMAINNAME
      # TLS defaults for all websecure routers
      - --entrypoints.websecure.http.tls.options=tls-max@file
      ## Enable Hub communication (open the port 9900 and 9901 by default)
      - --experimental.abortOnPluginFailure=true
      # - --experimental.hub=true
      ## Leave it always true. Otherwise, gives error when TRAEFIK_OTEL_ENABLED=false
      - --experimental.otlpLogs=true
      ## Plugins
      - --experimental.plugins.cf-real-ip.modulename=github.com/fma965/cloudflarewarp
      # - --experimental.plugins.cf-real-ip.modulename=github.com/jramsgz/traefik-real-ip
      - --experimental.plugins.cf-real-ip.version=v1.0.0
      # - --experimental.plugins.cf-real-ip.hash=
      - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec-bouncer.version=v1.2.1
      # - --experimental.plugins.crowdsec-bouncer.hash=
      - --experimental.plugins.rewritebody.modulename=github.com/traefik/plugin-rewritebody
      - --experimental.plugins.rewritebody.version=v0.3.1
      - --experimental.plugins.webfinger.modulename=github.com/NX211/traefik-webfinger
      - --experimental.plugins.webfinger.version=v0.3.5
      # - --experimental.plugins.webfinger.hash=
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # - --hub.tls.insecure=true
      - --log=true
      - --log.filePath=/logs/traefik.log
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO} # DEBUG, INFO, WARN, ERROR (default), FATAL, PANIC
      - --log.maxbackups=5 # Max number of old log files to keep
      - --log.maxsize=100 # Max size in MB of the log file
      - --log.maxage=7 # Max age in days
      - --log.compress=true
      - --log.otlp.grpc=${TRAEFIK_OTEL_ENABLED:-true}
      - --log.otlp.grpc.endpoint=otel-collector-agent:4317
      - --log.otlp.grpc.insecure=true
      - --log.otlp.serviceName=traefik
      - --metrics.otlp=${TRAEFIK_OTEL_ENABLED:-true}
      - --metrics.otlp.grpc=${TRAEFIK_OTEL_ENABLED:-true}
      - --metrics.otlp.grpc.endpoint=otel-collector-agent:4317
      - --metrics.otlp.grpc.insecure=true
      - --metrics.otlp.serviceName=traefik
      - --metrics.addInternals=false
      - --metrics.otlp.addEntryPointsLabels=true
      - --metrics.otlp.addRoutersLabels=true
      - --metrics.otlp.addServicesLabels=true
      - --metrics.otlp.pushInterval=${TRAEFIK_OTEL_METRICS_PUSH_INTERVAL:-30s}
      - --ping=true
      - --providers.docker=true
      # Automatically set Host rule for services
      # - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.$DOMAINNAME`)
      # - --providers.docker.endpoint=unix:///var/run/docker.sock # Use Docker Socket Proxy instead for improved security
      - --providers.docker.endpoint=tcp://docker-socket-proxy-read:2375
      - --providers.docker.exposedByDefault=false
      # NOTE: Keeps the t3_proxy default until all routed apps move to app_internal. Migrated apps set traefik.docker.network=app_internal explicitly.
      - --providers.docker.network=t3_proxy
      - --providers.file.directory=/rules # Load dynamic configuration from one or more .toml or .yml files in a directory
      # - --providers.file.filename=/path/to/file # Load dynamic configuration from a file
      - --providers.file.watch=true # Only works on top level files in the rules folder
      # - --providers.swarm.endpoint=tcp://127.0.0.1:2377 # Traefik v3 Swarm
      # - --serversTransport.insecureSkipVerify=true
      - --tracing=${TRAEFIK_OTEL_ENABLED:-true}
      - --tracing.otlp=${TRAEFIK_OTEL_ENABLED:-true}
      - --tracing.otlp.grpc=${TRAEFIK_OTEL_ENABLED:-true}
      - --tracing.otlp.grpc.endpoint=otel-collector-agent:4317
      - --tracing.otlp.grpc.insecure=true
      - --tracing.addInternals=false
      - --tracing.sampleRate=${TRAEFIK_OTEL_TRACING_SAMPLE_RATE:-0.50}
      - --tracing.serviceName=traefik
    depends_on:
      docker-socket-proxy-read:
        condition: service_healthy
      otel-collector-agent:
        condition: service_healthy
    profiles:
      - core
    networks:
      edge:
      app_internal:
      t3_proxy:
        ipv4_address: 192.168.90.254 # You can specify a static IP
      socket_proxy_read:
    # NOTE: To Access Docker Containers that run on Host Network. Is this working?
    # extra_hosts:
    #   - host.docker.internal:172.17.0.1
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      # - target: 853
      #   published: 853
      #   protocol: tcp
      #   mode: host
      # - target: 8080  # need to enable --api.insecure=true
      #   published: 8085
      #   protocol: tcp
      #   mode: host
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      # - /etc/localtime:/etc/localtime:ro # Set timezone
      - $REPO_PATH/configs/traefik3/rules:/rules:ro # file provider directory
      - $REPO_PATH/configs/traefik3/rules.specific/$MY_HOSTNAME.yml:/rules/dummy_specific.yml:ro # file provider directory
      - $REPO_PATH/configs/traefik3/acme:/acme # for certs
      - $REPO_PATH/logs/traefik:/logs # for fail2ban or crowdsec - make sure to touch file before starting container
      - $REPO_PATH/appdata/traefik/plugins-storage:/plugins-storage # plugin cache/storage for non-root user
    environment:
      TZ: $TZ
      CF_DNS_API_TOKEN: $CLOUDFLARE_DNS_API_TOKEN
      CLOUDFLARE_IPS: $CLOUDFLARE_IPS
      LOCAL_IPS: $LOCAL_IPS
      # CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
      ## Passing custom env variables to the container to be able to use this variables in the rules.
      LOCAL_STATIC_IP: $LOCAL_STATIC_IP
      DOMAINNAME: $DOMAINNAME
      BASE_DOMAINNAME: $BASE_DOMAINNAME
      CROWDSEC_TRAEFIK_BOUNCER_API_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_API_KEY:-}
      REMOTE_SERVER_PRIVATE_IP: ${REMOTE_SERVER_PRIVATE_IP:-dummy}
      WEBFINGER_USERNAME: $WEBFINGER_USERNAME
      WEBFINGER_HREF: https://pocketid.$BASE_DOMAINNAME
      ## OTEL resource attributes (semantic conventions)
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=traefik-$MY_HOSTNAME
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      # HTTP Routers
      traefik.http.routers.traefik-rtr.entrypoints: "websecure"
      traefik.http.routers.traefik-rtr.rule: "Host(`traefik.$DOMAINNAME`)"
      # - "traefik.http.routers.traefik-rtr.tls.certresolver=dns-cloudflare" # Comment out this line after first run of traefik to force the use of wildcard certs
      ## Middlewares
      traefik.http.routers.traefik-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      # traefik.http.routers.traefik-rtr.service: "api@internal" # NOTE: For api.insecure=false
      traefik.http.routers.traefik-rtr.service: "api@internal"
      # traefik.http.routers.traefik-rtr.service: "traefik-svc"  # NOTE: For api.insecure=true
      # traefik.http.services.traefik-svc.loadbalancer.server.port: "8080" # NOTE: For api.insecure=true
      ## Healthcheck/ping
      # - "traefik.http.routers.ping.rule=Host(`traefik.$DOMAINNAME`) && Path(`/ping`)"
      #- "traefik.http.routers.ping.tls=true"
      #- "traefik.http.routers.ping.service=ping@internal"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "Traefik"
      homepage.icon: "traefik.svg"
      homepage.href: "https://traefik.$DOMAINNAME"
      homepage.target: "_blank" # _blank: New tab --- _self: Same tab --- _top: New window
      homepage.description: "Reverse Proxy Manager"
      homepage.widget.type: "traefik"
      homepage.widget.url: "https://traefik.$DOMAINNAME"
      # homepage.widget.url: "http://traefik:8080" # NOTE: This doesn't work when using api.insecure=false
      homepage.widget.fields: "routers, services, middleware"
      ####### GLANCE #######
      glance.name: "Traefik"
      glance.icon: "sh:traefik"
      glance.url: "https://traefik.$DOMAINNAME"
      glance.description: "Reverse Proxy Manager"
