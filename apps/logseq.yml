services:
  logseq:
    container_name: logseq
    image: ghcr.io/logseq/logseq-webapp:latest
    restart: $RESTART_POLICY_OTHERS
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
      # volumes:
      # - $DIR_NOTES:/notes
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.logseq-rtr.entrypoints: "websecure"
      traefik.http.routers.logseq-rtr.rule: "Host(`logseq.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.logseq-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.logseq-rtr.service: "logseq-svc"
      traefik.http.services.logseq-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.logseq.config.domain: "logseq.$DOMAINNAME"
      tinyauth.apps.logseq.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Logseq"
      homepage.icon: "logseq.svg"
      homepage.href: "https://logseq.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A privacy-first, open-source platform for knowledge management"
    profiles:
      - reading
