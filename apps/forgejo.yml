networks:
  forgejo_ci:
    internal: true
  forgejo_dind_egress:
  forgejo_backend:

services:
  forgejo-db:
    image: postgres:18.4@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    container_name: forgejo-db
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - forgejo
    networks:
      - forgejo_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/forgejo/db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  # NOTE: Configuration is located in: $REPO_PATH/data/forgejo/gitea/custom/conf/app.ini
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.2-rootless@sha256:cc2d74fb4c30385a8ee34de8c8f83344f7316cec70bd2cc7eb82b2802fa28e0b
    container_name: forgejo
    restart: $RESTART_POLICY_PROGRAMMING
    depends_on:
      forgejo-db:
        condition: service_healthy
      # forgejo-runner:
      #   condition: service_started
    profiles:
      - programming
      - forgejo
    networks:
      - t3_proxy
      - forgejo_backend
    ports:
      - "2222:2222"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "1.5"
    mem_limit: "2G"
    mem_reservation: "512M"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/data/forgejo/gitea:/var/lib/gitea
    environment:
      USER_UID: $PUID
      USER_GID: $PGID
      TZ: $TZ
      FORGEJO__server__ROOT_URL: https://git.$DOMAINNAME
      FORGEJO__server__DOMAIN: git.$DOMAINNAME
      FORGEJO__server__SSH_DOMAIN: git.$DOMAINNAME
      FORGEJO__server__LANDING_PAGE: login
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: postgres
      FORGEJO__database__USER: postgres
      FORGEJO__database__PASSWD: postgres
      FORGEJO__service__DISABLE_REGISTRATION: false
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: false
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: false
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: false
      FORGEJO__webhook__ALLOWED_HOST_LIST: doco-cd.$DOMAINNAME
      FORGEJO__cron.cleanup_packages__SCHEDULE: "@every 6h"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.forgejo-rtr.entrypoints: "websecure"
      traefik.http.routers.forgejo-rtr.rule: "Host(`git.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.forgejo-rtr.middlewares: "chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.forgejo-rtr.service: "forgejo-svc"
      traefik.http.services.forgejo-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.forgejo.config.domain: "git.$DOMAINNAME"
      tinyauth.apps.forgejo.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "forgejo"
      homepage.icon: "forgejo.png"
      homepage.href: "https://git.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Self-hosted Git service"
      ####### GLANCE #######
      glance.name: "forgejo"
      glance.icon: "sh:forgejo"
      glance.url: "https://git.$DOMAINNAME"
      glance.description: "Self-hosted Git service"
