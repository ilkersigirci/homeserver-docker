services:
  # NOTE: The upstream entrypoint owns /app/prisma, runs migrations, then drops to nodejs.
  excalidash-db:
    image: zimengxiong/excalidash-backend:0.6.0@sha256:cbdab75f31b21e342b464d6404a454791e5da7452e3614b137021a800fc4cac6
    container_name: excalidash-db
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - root
      - others
      - excalidash
    networks:
      - t3_proxy
    expose:
      - 8000
    read_only: false # NOTE: It doesn't work otherwise
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /app/uploads:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/excalidash:/app/prisma
    environment:
      PORT: 8000
      DATABASE_URL: file:/app/prisma/dev.db
      FRONTEND_URL: https://draw.$DOMAINNAME
      TRUST_PROXY: "1"
      ENFORCE_HTTPS_REDIRECT: false
      NODE_ENV: production
      JWT_SECRET: $EXCALIDASH_JWT_SECRET
      CSRF_SECRET: $EXCALIDASH_CSRF_SECRET
      ## OIDC
      AUTH_MODE: oidc_enforced
      OIDC_PROVIDER_NAME: PocketID
      OIDC_ISSUER_URL: https://pocketid.$BASE_DOMAINNAME
      OIDC_CLIENT_ID: $EXCALIDASH_CLIENT_ID
      OIDC_CLIENT_SECRET: $EXCALIDASH_CLIENT_SECRET
      OIDC_REDIRECT_URI: https://draw.$DOMAINNAME/api/auth/oidc/callback
      OIDC_SCOPES: openid profile email groups
      OIDC_GROUPS_CLAIM: groups
      OIDC_ADMIN_GROUPS: admin
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Others"
      homepage.name: "excalidash-db"
      homepage.icon: "excalidash-db.png"
      homepage.description: "Excalidash prisma database"
      ####### GLANCE #######
      glance.name: "excalidash-db"
      glance.icon: "sh:excalidash-db"
      glance.description: "Excalidash prisma database"

  excalidash:
    image: zimengxiong/excalidash-frontend:0.6.0@sha256:4ec5b20c03034b96d37cfb87b5c39e9cc5958441a3abd8dcc413d11dfb11809c
    container_name: excalidash
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      excalidash-db:
        condition: service_healthy
    profiles:
      - others
      - excalidash
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    entrypoint:
      - /bin/sh
      - /configs/excalidash/frontend-entrypoint.sh
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=755
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/excalidash/frontend-entrypoint.sh:/configs/excalidash/frontend-entrypoint.sh:ro
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BACKEND_URL: excalidash-db:8000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.excalidash-rtr.entrypoints: "websecure"
      traefik.http.routers.excalidash-rtr.rule: "Host(`draw.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.excalidash-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.excalidash-rtr.service: "excalidash-svc"
      traefik.http.services.excalidash-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.excalidash.config.domain: "draw.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Others"
      homepage.name: "excalidash"
      homepage.icon: "excalidash.png"
      homepage.href: "https://draw.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Dashboard for Excalidraw with multi-user collaboration and scoped sharing"
      ####### GLANCE #######
      glance.name: "excalidash"
      glance.icon: "sh:excalidash"
      glance.url: "https://draw.$DOMAINNAME"
      glance.description: "Dashboard for Excalidraw with multi-user collaboration and scoped sharing"
