services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian
    container_name: lazylibrarian
    restart: unless-stopped
    # profiles:
    # - media
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    # ports:
    #  - "$LAZYLIBRARIAN_PORT:5299"
    volumes:
      - $DOCKERDIR/appdata/lazylibrarian:/config
      - $DATADIR/downloads:/data/downloads
      - $DOCKERDIR/appdata/calibre/books:/books:rw
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DOCKER_MODS: linuxserver/calibre-web:calibre # set the path to converter tool to /app/calibre/ebook-convert
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.lazylibrarian-rtr.entrypoints: "websecure"
      traefik.http.routers.lazylibrarian-rtr.rule: "Host(`lazy.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.lazylibrarian-rtr.middlewares: "chain-oauth@file"
      ## HTTP Services
      traefik.http.routers.lazylibrarian-rtr.service: "lazylibrarian-svc"
      traefik.http.services.lazylibrarian-svc.loadbalancer.server.port: "5299"
      ####### TINYAUTH #######
      tinyauth.apps.lazy.config.domain: "lazy.$DOMAINNAME"
      tinyauth.apps.lazy.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "LazyLibrarian"
      homepage.icon: "lazylibrarian.svg"
      homepage.href: "https://lazylibrarian.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Follow Authors and Grab Metadata for All Your Digital Reading Needs"
    profiles:
      - reading
