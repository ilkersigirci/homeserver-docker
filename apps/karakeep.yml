networks:
  karakeep_backend:

services:
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
    container_name: karakeep-chrome
    restart: $RESTART_POLICY_OTHERS
    init: true
    # NOTE: The image entrypoint sets --no-sandbox and the remote debugging flags.
    # https://docs.karakeep.app/administration/chrome-image-migration
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    profiles:
      - reading
      - karakeep
    networks:
      - karakeep_backend
    expose:
      - 9222
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      HOME: /tmp # NOTE: The image user's home is /nonexistent; fontconfig needs a writable cache.
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9222 &&
          printf 'GET /json/version HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 &&
          [[ "$$status" == *' 200 '* ]]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      ####### GLANCE #######
      glance.name: "karakeep-chrome"
      glance.parent: "karakeep"

  # TODO: Harden
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
    container_name: karakeep-meilisearch
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - karakeep
    networks:
      - karakeep_backend
    user: "65534:65534"
    read_only: true
    pre_start:
      - image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        user: root
        command: ["chown", "-R", "65534:65534", "/meili_data"]
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/karakeep/meilisearch:/meili_data
    environment:
      MEILI_NO_ANALYTICS: true
      MEILI_MASTER_KEY: $KARAKEEP_MEILI_MASTER_KEY
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      ####### GLANCE #######
      glance.name: "karakeep-meilisearch"
      glance.parent: "karakeep"

  # TODO: Harden
  # NOTE: The s6 supervisor and application processes currently require the upstream root runtime.
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
    container_name: karakeep
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - root
      - reading
      - karakeep
    depends_on:
      karakeep-meilisearch:
        condition: service_started
      karakeep-chrome:
        condition: service_started
    networks:
      - t3_proxy
      - karakeep_backend
    # user: $PUID:$PGID
    # read_only: true
    # tmpfs:
    #   - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/karakeep/web:/data
    # NOTE: https://docs.karakeep.app/configuration/environment-variables
    environment:
      ## General
      LOG_LEVEL: info
      DATA_DIR: /data
      NEXTAUTH_URL: https://bookmark.$DOMAINNAME
      NEXTAUTH_SECRET: $KARAKEEP_NEXTAUTH_SECRET
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: $KARAKEEP_MEILI_MASTER_KEY
      MAX_ASSET_SIZE_MB: 50
      DISABLE_NEW_RELEASE_CHECK: true
      DB_WAL_MODE: true
      ## Auth
      DISABLE_SIGNUPS: false
      DISABLE_PASSWORD_AUTH: true
      EMAIL_VERIFICATION_REQUIRED: false
      OAUTH_AUTO_REDIRECT: true
      OAUTH_PROVIDER_NAME: PocketID
      OAUTH_WELLKNOWN_URL: https://pocketid.$BASE_DOMAINNAME/.well-known/openid-configuration
      OAUTH_CLIENT_ID: $KARAKEEP_CLIENT_ID
      OAUTH_CLIENT_SECRET: $KARAKEEP_CLIENT_SECRET
      OAUTH_SCOPE: openid profile email
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: false
      ## Inference
      OPENAI_BASE_URL: $AIGATEWAY_BASE_URL
      OPENAI_API_KEY: $AIGATEWAY_API_KEY
      INFERENCE_TEXT_MODEL: gpt-4.1-mini
      INFERENCE_IMAGE_MODEL: gpt-4o-mini
      EMBEDDING_TEXT_MODEL: text-embedding-3-small
      INFERENCE_CONTEXT_LENGTH: 2048
      INFERENCE_USE_MAX_COMPLETION_TOKENS: false
      INFERENCE_LANG: english
      INFERENCE_ENABLE_AUTO_TAGGING: true
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: false
      INFERENCE_OUTPUT_SCHEMA: structured
      ## Crawler
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      CRAWLER_STORE_SCREENSHOT: true
      CRAWLER_FULL_PAGE_SCREENSHOT: false
      CRAWLER_STORE_PDF: false
      CRAWLER_FULL_PAGE_ARCHIVE: true
      CRAWLER_PARSER_MEM_LIMIT_MB: 512
      CRAWLER_VIDEO_DOWNLOAD: false
      CRAWLER_ENABLE_ADBLOCKER: true
      ## OCR
      OCR_LANGS: eng,tur
      OCR_USE_LLM: false
      ## Monitoring
      OTEL_TRACING_ENABLED: false
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: karakeep
      OTEL_SAMPLE_RATE: 1.0
      PROMETHEUS_AUTH_TOKEN: Random
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.karakeep-rtr.entrypoints: "websecure"
      traefik.http.routers.karakeep-rtr.rule: "Host(`bookmark.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.karakeep-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.karakeep-rtr.service: "karakeep-svc"
      traefik.http.services.karakeep-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.karakeep.config.domain: "bookmark.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "karakeep"
      homepage.icon: "karakeep.png"
      homepage.href: "https://bookmark.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "A bookmark-everything app"
      ####### GLANCE #######
      glance.name: "karakeep"
      glance.icon: "sh:karakeep"
      glance.url: "https://bookmark.$DOMAINNAME"
      glance.description: "A bookmark-everything app"
