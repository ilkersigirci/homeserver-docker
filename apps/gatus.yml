networks:
  gatus_backend:

services:
  gatus-db:
    image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    container_name: gatus-db
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - not-used
      # - monitoring
      - gatus
    networks:
      - gatus_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/gatus-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  gatus:
    image: ghcr.io/ilkersigirci/homeserver-gatus:v5.36.0@sha256:2d55aff37a5d7fa8fb8ef540c8456ab6c19afdf0528bcaa0ffdf418108a50329
    container_name: gatus
    restart: $RESTART_POLICY_MAINTENANCE
    # depends_on:
    #   gatus-db:
    #     condition: service_healthy
    profiles:
      - monitoring
      - gatus
    networks:
      - t3_proxy
      - gatus_backend
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/gatus:/config
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      DB_HOST: gatus-db
      DB_PORT: 5432
      GATUS_CONFIG_PATH: /config
      TITLE: $GATUS_TITLE
      DOMAINNAME: $DOMAINNAME
      GOTIFY_NOTIFICATION_TOKEN: $GOTIFY_GATUS_NOTIFICATION_TOKEN
      AIGATEWAY_BASE_URL: $AIGATEWAY_BASE_URL
      AIGATEWAY_API_KEY: $AIGATEWAY_API_KEY
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.gatus-rtr.entrypoints: "websecure"
      traefik.http.routers.gatus-rtr.rule: "Host(`gatus.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.gatus-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.gatus-rtr.service: "gatus-svc"
      traefik.http.services.gatus-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.gatus.config.domain: "gatus.$DOMAINNAME"
      tinyauth.apps.gatus.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "Gatus"
      homepage.icon: "gatus.svg"
      homepage.href: "https://gatus.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Automated developer-oriented status page"
      homepage.widget.type: "gatus"
      homepage.widget.url: "http://gatus:8080"
      ####### GLANCE #######
      glance.name: "gatus"
      glance.icon: "sh:gatus"
      glance.url: "https://gatus.$DOMAINNAME"
      glance.description: "Automated developer-oriented status page"
