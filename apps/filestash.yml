services:
  # NOTE: To fix json parse error: Bitwarden extension → Settings → Autofill → Blocked domains → add: filestash.example.com
  filestash-wopi-server:
    # NOTE: After 24.04.10.2.1, support for custom command with css with root user is removed
    image: collabora/code:26.04.3.1.1@sha256:6b70f91f0b6e9c76f75f162f58ef0a12cf9415d78e14713d33c0318ddc4a2cc0
    container_name: filestash-wopi-server
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - filestash
    networks:
      - t3_proxy
    user: cool
    read_only: false # NOTE: /opt/cool should be writable
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Filestash custom css: https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
    # volumes:
    #   - $REPO_PATH/configs/filestash/filestash_collabora_branding.css:/usr/share/coolwsd/browser/dist/branding-desktop.css:ro
    #   - $REPO_PATH/configs/filestash/filestash_collabora_branding.css:/usr/share/coolwsd/browser/dist/nextcloud/branding-desktop.css:ro
    environment:
      TZ: $TZ
      # username: admin
      # password: admin
      aliasgroup1: https://drive.$DOMAINNAME:443
      DONT_GEN_SSL_CERT: "YES"
      extra_params: |
        --o:ssl.enable=false \
        --o:ssl.ssl_verification=true \
        --o:ssl.termination=true \
        --o:welcome.enable=false \
        --o:net.frame_ancestors=drive.$DOMAINNAME
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.office-rtr.entrypoints: "websecure"
      traefik.http.routers.office-rtr.rule: "Host(`office.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.office-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.office-rtr.service: "office-svc"
      traefik.http.services.office-svc.loadbalancer.server.port: "9980"
      ####### TINYAUTH #######
      tinyauth.apps.office.config.domain: "office.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "collabora"
      homepage.icon: "collabora.png"
      homepage.href: "https://office.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Collaborative Open-Source Document Editing"
      ####### GLANCE #######
      glance.name: "office"
      glance.icon: "sh:office"
      glance.url: "https://office.$DOMAINNAME"
      glance.description: "Collaborative Open-Source Document Editing"

  # NOTE: Selfhosted Version: v0.6.20260617
  filestash:
    image: machines/filestash:latest@sha256:07b1d0e59a313073974cf851e180e008224ef1192eb7439a6ba47be80093ad7c
    container_name: filestash
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - filestash
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      # - $REPO_PATH/configs/filestash/filestash.bin:/app/filestash # NOTE: Enterprise binary v0.6.20260105. should be executable (chmod +x)
      - $REPO_PATH/data/filestash:/app/data/state
    environment:
      APPLICATION_URL: drive.$DOMAINNAME
      ADMIN_CONSOLE: $FILESTASH_ADMIN_PASSWORD_BCRYPT
      CANARY: false
      OFFICE_URL: https://office.$DOMAINNAME
      OFFICE_FILESTASH_URL: https://drive.$DOMAINNAME
      # OFFICE_REWRITE_URL: https://office.$DOMAINNAME
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "3",
          "-o",
          "/dev/null",
          "http://127.0.0.1:8334/",
        ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.filestash-rtr.entrypoints: "websecure"
      traefik.http.routers.filestash-rtr.rule: "Host(`drive.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.filestash-rtr.middlewares: "filestash-wopi-csp,chain-tinyauth@file"
      traefik.http.middlewares.filestash-wopi-csp.headers.customResponseHeaders.Content-Security-Policy:
        >-
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        object-src 'none';
        frame-src 'self' https://*.$DOMAINNAME;
        frame-ancestors 'self' https://*.$DOMAINNAME;
        form-action 'self' https://office.$DOMAINNAME;
        base-uri 'self';
      ## HTTP Services
      traefik.http.routers.filestash-rtr.service: "filestash-svc"
      traefik.http.services.filestash-svc.loadbalancer.server.port: "8334"
      ####### TINYAUTH #######
      tinyauth.apps.filestash.config.domain: "drive.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "filestash"
      homepage.icon: "filestash.png"
      homepage.href: "https://drive.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "File Management Platform / Universal Data Access Layer (without FUSE)"
      ####### GLANCE #######
      glance.name: "filestash"
      glance.icon: "sh:filestash"
      glance.url: "https://drive.$DOMAINNAME"
      glance.description: "File Management Platform / Universal Data Access Layer (without FUSE)"
