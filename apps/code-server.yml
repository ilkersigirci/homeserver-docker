services:
  code-server:
    image: lscr.io/linuxserver/code-server
    container_name: code-server
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    volumes:
      - $REPO_PATH/appdata/code-server:/config
      - $REPO_PATH:/config/workspace/docker
      # - $DIR_NOTES:/config/workspace/notes
      # - $DIR_MYREPOS:/config/workspace/MyRepos
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEFAULT_WORKSPACE: /config/workspace
      # DOCKER_HOST: tcp://docker-socket-proxy:2375
      # PASSWORD: password
      # HASHED_PASSWORD: 
      SUDO_PASSWORD: ilker
      # SUDO_PASSWORD_HASH: 
      # PROXY_DOMAIN: code-server-ls.my.domain
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.code-server-rtr.entrypoints: "websecure"
      traefik.http.routers.code-server-rtr.rule: "Host(`code.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.code-server-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.code-server-rtr.service: "code-server-svc"
      traefik.http.services.code-server-svc.loadbalancer.server.port: "8443"
      ####### TINYAUTH #######
      tinyauth.apps.code-server.config.domain: "code.$DOMAINNAME"
      tinyauth.apps.code-server.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "Vscode"
      homepage.icon: "vscode.svg"
      homepage.href: "https://code.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Vscode Open Source Editor"
