# NOTE: https://docs.immich.app/install/environment-variables/#machine-learning
# NOTE: Change URL in immich settings -> admin/system-settings?isOpen=machine-learning

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5-openvino@sha256:71cd5a681823c4b818f4b24b3f05816eccc3d085559e7615f695bde77e64f1f2
    container_name: immich-machine-learning
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    ports:
      - "3003:3003"
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - $REPO_PATH/appdata/immich-ml/model-cache:/cache
      - $REPO_PATH/appdata/immich-ml/.cache:/.cache
      - $REPO_PATH/appdata/immich-ml/.config:/.config
    environment:
      OMP_NUM_THREADS: 8
      ## General
      IMMICH_ENV: production
      IMMICH_LOG_LEVEL: ${IMMICH_LOG_LEVEL:-error}
      NO_COLOR: false
      ## Port
      IMMICH_HOST: 0.0.0.0
      IMMICH_PORT: 3003
      ## Machine Learning
      MACHINE_LEARNING_MODEL_TTL: 300
      MACHINE_LEARNING_MODEL_TTL_POLL_S: 10
      MACHINE_LEARNING_CACHE_FOLDER: /cache
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      disable: false
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
