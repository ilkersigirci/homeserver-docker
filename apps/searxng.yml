networks:
  searxng_backend:

services:
  searxng:
    image: docker.io/searxng/searxng:2026.4.22-74f1ca203@sha256:37c616a774b90fb5df9239eb143f1b11866ddf7b830cd1ebcca6ba11b38cc2bf
    container_name: searxng
    restart: $RESTART_POLICY_PROGRAMMING
    depends_on:
      - searxng-valkey
    profiles:
      - programming
      - searxng
    networks:
      - t3_proxy
      - searxng_backend
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.5"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: https://searxng.$DOMAINNAME
      UWSGI_WORKERS: 4
      UWSGI_THREADS: 4
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.searxng-rtr.entrypoints: "websecure"
      traefik.http.routers.searxng-rtr.rule: "Host(`searxng.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.searxng-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.searxng-rtr.service: "searxng-svc"
      traefik.http.services.searxng-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.searxng.config.domain: "searxng.$DOMAINNAME"
      tinyauth.apps.searxng.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "searxng"
      homepage.icon: "searxng.png"
      homepage.href: "https://searxng.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Free internet metasearch engine"
      ####### GLANCE #######
      glance.name: "searxng"
      glance.icon: "sh:searxng"
      glance.url: "https://searxng.$DOMAINNAME"
      glance.description: "Free internet metasearch engine"

  searxng-valkey:
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    container_name: searxng-valkey
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
      - searxng
    networks:
      - searxng_backend
    user: $PUID:$PGID
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/searxng-valkey:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
