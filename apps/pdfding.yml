  # FIXME: OIDC NOT WORKING
  pdfding:
    image: mrmn/pdfding:latest
    container_name: pdfding
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
    networks:
      - t3_proxy
    # depends_on:
    #   - pdfding-db
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/pdfding-db:/home/nonroot/pdfding/db
      - $DIR_MEDIA/PDFs/pdfding:/home/nonroot/pdfding/media
    environment:
      DEFAULT_THEME: dark
      DEFAULT_THEME_COLOR: blue
      SECRET_KEY: DUMMY_SECRET_KEY
      HOST_NAME: pdfding.$DOMAINNAME
      LOG_LEVEL: INFO
      DATABASE_TYPE: SQLITE
      ACCOUNT_EMAIL_VERIFICATION: false
      DISABLE_USER_SIGNUP: false
      BACKUP_ENABLE: false
      ## For Postgres
      # - DATABASE_TYPE=POSTGRES
      # - POSTGRES_PASSWORD=pdfding
      # - POSTGRES_HOST=pdfding-db
      ## For OIDC
      OIDC_ENABLE: true
      OIDC_ONLY: true
      OIDC_PROVIDER_NAME: Authelia
      OIDC_CLIENT_ID: pdfding
      OIDC_CLIENT_SECRET: $OIDC_PDFDING_CLIENT_SECRET
      OIDC_AUTH_URL: https://authelia.$DOMAINNAME/.well-known/openid-configuration
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.pdfding-rtr.entrypoints: "websecure"
      traefik.http.routers.pdfding-rtr.rule: "Host(`pdfding.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.pdfding-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.pdfding-rtr.service: "pdfding-svc"
      traefik.http.services.pdfding-svc.loadbalancer.server.port: "8000"
      ####### TINYAUTH #######
      tinyauth.apps.pdfding.config.domain: "pdfding.$DOMAINNAME"
      tinyauth.apps.pdfding.ip.bypass: "$LOCAL_IPS"
      ### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "pdfding"
      homepage.icon: "pdfding.svg"
      homepage.href: "https://pdfding.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "description"
