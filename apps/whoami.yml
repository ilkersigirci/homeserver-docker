services:
  whoami:
    image: traefik/whoami@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    container_name: whoami
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD", "/whoami", "--help"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.whoami-rtr.entrypoints: "websecure"
      traefik.http.routers.whoami-rtr.rule: "Host(`whoaminfo.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.whoami-rtr.middlewares: "chain-tinyauth@file"
      # - "tinyauth.oauth.groups=admins" # NOTE: Not working currently
      ## HTTP Services
      traefik.http.routers.whoami-rtr.service: "whoami-svc"
      traefik.http.services.whoami-svc.loadbalancer.server.port: "80"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "Whoami"
      homepage.icon: "whoami.svg"
      homepage.href: "https://whoaminfo.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Tiny Go webserver that prints OS information and HTTP request to output"
      ####### GLANCE #######
      glance.name: "whoami"
      glance.icon: "sh:whoami"
      glance.url: "https://whoaminfo.$DOMAINNAME"
      glance.description: "Tiny Go webserver that prints OS information and HTTP request to output"
