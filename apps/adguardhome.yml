# TODO: enable strict_sni_check: https://www.reddit.com/r/AdGuardHome/comments/1shenvp/how_i_secured_my_public_adguard_home_instance/
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
    container_name: adguardhome
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.90
    expose:
      - "80"
      - "53"
      - "853"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    #   ## For dockervlan network
    # networks:
    #   dockervlan:
    #      ipv4_address: 192.168.1.19 # IP address inside defined range
    # ports:
    #   - 53/udp
    #   - 53/tcp
    #   - 67/udp
    #   - 68/tcp
    #   - 68/udp
    #   - 80/tcp
    #   - 443/tcp
    #   - 853/tcp
    #   - 3000/tcp
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/adguardhome:/opt/adguardhome/conf:rw # TODO: Find a way to add AdGuardHome.yaml into git tracking.
      - $REPO_PATH/appdata/adguardhome:/opt/adguardhome/work:rw
    environment:
      TZ: $TZ
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.adguardhome-rtr.entrypoints: "websecure"
      traefik.http.routers.adguardhome-rtr.rule: "Host(`adguardhome.$DOMAINNAME`)" # Also used for DoH
      ## Middlewares
      traefik.http.routers.adguardhome-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.adguardhome-rtr.middlewares: "chain-no-auth@file" # NOTE: Needed for AdGuard Home Manager Android app
      ## HTTP Services
      traefik.http.routers.adguardhome-rtr.service: "adguardhome-svc"
      # traefik.http.services.adguardhome-svc.loadbalancer.server.port: "3000" # Initial wizard port
      traefik.http.services.adguardhome-svc.loadbalancer.server.port: "80" # Admin UI port
      ## Dot - DNS over TLS
      # traefik.tcp.routers.adguard-tls.rule: "HostSNI(`dns.$DOMAINNAME`)" # Used for DoT
      # traefik.tcp.routers.adguard-tls.tls: "true"
      # traefik.tcp.routers.adguard-tls.entrypoints: "dot"
      # traefik.tcp.routers.adguard-tls.tls.certresolver: "letsencrypt"
      # traefik.tcp.routers.adguard-tls.service: "adguard-tls"
      # traefik.tcp.services.adguard-tls.loadbalancer.server.port: "53"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "adguardhome"
      homepage.icon: "adguard-home.svg"
      homepage.href: "https://adguardhome.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Network-wide ads & trackers blocking DNS server"
      homepage.widget.type: "adguard"
      homepage.widget.url: "http://adguardhome:80"
      homepage.widget.username: "$ADGUARD_USERNAME"
      homepage.widget.password: "$ADGUARD_PASSWORD"
      ####### GLANCE #######
      glance.name: "adguardhome"
      glance.icon: "sh:adguard-home"
      glance.url: "https://adguardhome.$DOMAINNAME"
      glance.description: "Network-wide ads & trackers blocking DNS server"
