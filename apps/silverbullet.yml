# NOTE: env variables: https://silverbullet.md/Install/Configuration
# NOTE: On a fresh install, disable the DIR_NOTES bind until Dashboard setup completes.
# Automatic setup requires /data to have no non-hidden entries. Then configure a
# space at /data/spaces/notes and re-enable the bind.
services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.12.0@sha256:1b97ce0f7b5085c76e0e9363c88ed97673db62a3b0f78c7bb12868827fff8b37
    container_name: silverbullet
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/silverbullet:/data
      - type: bind
        source: $DIR_NOTES
        target: /data/spaces/notes
        bind:
          create_host_path: false
    environment:
      PUID: $PUID
      PGID: $PGID
      SB_HOSTNAME: 0.0.0.0
      SB_PORT: 3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 --timeout=3 --spider http://127.0.0.1:3000/.instance || exit 1",
        ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.silverbullet-rtr.entrypoints: "websecure"
      traefik.http.routers.silverbullet-rtr.rule: "Host(`notes.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.silverbullet-rtr.middlewares: "chain-silverbullet-no-auth@file"
      ## Fullscreen PWA manifests at the root or under a space prefix
      traefik.http.routers.silverbullet-manifest-rtr.entrypoints: "websecure"
      traefik.http.routers.silverbullet-manifest-rtr.rule: "Host(`notes.$DOMAINNAME`) && PathRegexp(`^/([^/]+/)*[.]client/manifest[.]json$`)"
      traefik.http.routers.silverbullet-manifest-rtr.priority: "100"
      traefik.http.routers.silverbullet-manifest-rtr.middlewares: "chain-silverbullet-tinyauth@file,chain-silverbullet-manifest@file"
      traefik.http.routers.silverbullet-manifest-rtr.service: "silverbullet-svc"
      ## HTTP Services
      traefik.http.routers.silverbullet-rtr.service: "silverbullet-svc"
      traefik.http.services.silverbullet-svc.loadbalancer.server.port: "3000"
      ####### TINYAUTH #######
      tinyauth.apps.silverbullet.config.domain: "notes.$DOMAINNAME"
      tinyauth.apps.silverbullet.oauth.groups: "admin"
      # https://silverbullet.md/Authentication%20Proxy
      tinyauth.apps.silverbullet.path.allow: "^/(service_worker[.]js|[.]client/.*)([?].*)?$"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "silverbullet"
      homepage.icon: "silverbullet.png"
      homepage.href: "https://notes.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Offline first web based Markdown editor, turbo charged with the scripting power of Lua"
      ####### GLANCE #######
      glance.name: "silverbullet"
      glance.icon: "sh:silverbullet"
      glance.url: "https://notes.$DOMAINNAME"
      glance.description: "Offline first web based Markdown editor, turbo charged with the scripting power of Lua"
