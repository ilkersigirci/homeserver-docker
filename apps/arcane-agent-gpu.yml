services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/arcane-headless:v2.4.0@sha256:6fd0306cb914b1e889be97fc136f2dd7537775d9601d6cffd96891dabbbee449
    container_name: arcane-agent
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      - t3_proxy
      - socket_proxy_exec
    ports:
      - "3553:3553"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/arcane-agent:/app/data
    environment:
      AGENT_MODE: true
      AGENT_TOKEN: $ARCANE_AGENT_TOKEN
      ANALYTICS_DISABLED: true
      DOCKER_HOST: tcp://docker-socket-proxy-exec:2375
      EDGE_TRANSPORT: auto
      ENVIRONMENT: production
      GPU_MONITORING_ENABLED: true
      GPU_TYPE: nvidia
      MANAGER_API_URL: https://arcane.gpu.$BASE_DOMAINNAME
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:3553/api/health >/dev/null || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "arcane-agent"
      homepage.icon: "arcane.png"
      homepage.description: "Modern Docker Management Remote Agent"
      ####### GLANCE #######
      glance.name: "arcane-agent"
      glance.icon: "sh:arcane"
      glance.description: "Modern Docker Management Remote Agent"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
