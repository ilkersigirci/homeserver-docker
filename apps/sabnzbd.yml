# TODO: Harden
# Required SABnzbd settings (stored in ignored /config/sabnzbd.ini):
# - download_dir=Downloads/incomplete: use the SSD for download and repair work.
# - download_free=200G: reserve SSD headroom for large jobs and repair data.
# - complete_dir=Downloads/complete: place completed data on the HDD array.
# - direct_unpack=1: unpack to the HDD while downloading to shorten post-processing.
# - host_whitelist=sabnzbd.$DOMAINNAME,sabnzbd: allow proxy and service hostnames.
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.0-ls266@sha256:b0f9755d795913bd26ae3f3a12805668ab0681ab847a7624568559c573fc7cae
    container_name: sabnzbd
    restart: $RESTART_POLICY_MEDIA
    stop_grace_period: 30s
    hostname: sabnzbd.$DOMAINNAME
    profiles:
      - root
      - media
      - arr
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.159
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 2G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/sabnzbd:/config
      # NOTE: Complete files goes to HDD
      - type: bind
        source: $DIR_MEDIA/Downloads/complete
        target: /config/Downloads/complete
        bind:
          create_host_path: false
      # NOTE: Incomplete files goes to SSD
      - type: bind
        source: $DIR_NAS_JET_SERVICES/nas/sabnzbd/incomplete
        target: /config/Downloads/incomplete
        bind:
          create_host_path: false
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8080/api?mode=version"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.sabnzbd-rtr.entrypoints: "websecure"
      traefik.http.routers.sabnzbd-rtr.rule: "Host(`sabnzbd.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.sabnzbd-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.sabnzbd-rtr.service: "sabnzbd-svc"
      traefik.http.services.sabnzbd-svc.loadbalancer.server.port: "8080"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "sabnzbd"
      homepage.icon: "sabnzbd.png"
      homepage.href: "https://sabnzbd.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "The automated Usenet download tool"
      homepage.widget.type: "sabnzbd"
      homepage.widget.url: "http://sabnzbd:8080"
      homepage.widget.key: "$SABNZBD_API_KEY"
      ####### GLANCE #######
      glance.name: "sabnzbd"
      glance.icon: "sh:sabnzbd"
      glance.url: "https://sabnzbd.$DOMAINNAME"
      glance.description: "The automated Usenet download tool"
