# NOTE: After the specified version, Minio Admin UI isn't available anymore.
# NOTE: For OIDC, in pocketid -> users -> custom claims -> Add key=policy value=consoleAdmin
#       Don't add Callback URLs in PocketID, they are added automatically by minio MINIO_BROWSER_REDIRECT_URL.
#       OIDC doesn't work when ui is in a subpath.
services:
  minio:
    # image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1@sha256:8494c615f45cd6726f048dce162da5826582c2ce67d420428200d9d3cccf6e25 # NOTE: For Proxmox VM
    container_name: minio
    restart: $RESTART_POLICY_PROGRAMMING
    command: server /data --console-address ":9001"
    profiles:
      - programming
    networks:
      - t3_proxy
    expose:
      - 9000 # API
      - 9001 # Web UI
    security_opt:
      - no-new-privileges:true
    volumes:
      - $NAS_SERVICES_PATH/gpu_coding/minio:/data
    environment:
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
      MINIO_BROWSER_REDIRECT_URL: https://minio-ui.$DOMAINNAME
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Login with PocketID
      MINIO_IDENTITY_OPENID_CONFIG_URL: https://pocketid.$BASE_DOMAINNAME/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: $MINIO_CLIENT_ID
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: $MINIO_CLIENT_SECRET
      MINIO_IDENTITY_OPENID_SCOPES: "openid,email,profile"
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      ### API Labels ###
      ## HTTP Routers
      traefik.http.routers.minio-api-rtr.entrypoints: "websecure"
      traefik.http.routers.minio-api-rtr.rule: "Host(`minio.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.minio-api-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.minio-api-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.minio-api-rtr.service: "minio-api-svc"
      traefik.http.services.minio-api-svc.loadbalancer.server.port: "9000"
      ####### TINYAUTH #######
      tinyauth.apps.minio.config.domain: "minio.$DOMAINNAME"
      tinyauth.apps.minio.ip.bypass: "$LOCAL_IPS"
      ### Web UI Labels ###
      ## HTTP Routers
      traefik.http.routers.minio-ui-rtr.entrypoints: "websecure"
      traefik.http.routers.minio-ui-rtr.rule: "Host(`minio-ui.$DOMAINNAME`)"
      ## HTTP Services
      traefik.http.routers.minio-ui-rtr.service: "minio-ui-svc"
      traefik.http.services.minio-ui-svc.loadbalancer.server.port: "9001"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "minio"
      homepage.icon: "minio.png"
      homepage.href: "https://minio-ui.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "MinIO is a high-performance, S3 compatible object store"
      ####### GLANCE #######
      glance.name: "minio"
      glance.icon: "sh:minio"
      glance.url: "https://minio-ui.$DOMAINNAME"
      glance.description: "MinIO is a high-performance, S3 compatible object store"
