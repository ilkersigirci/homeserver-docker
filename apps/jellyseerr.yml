# TODO: Rename it to seerr
services:
  # Optional: You can also use postgres as db instead of sqlite, which is the default.
  # NOTE: At the first setup, use jellyfin url as: http://jellyfin:8096
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.0@sha256:d206d9e4056bb90178297df58047791196e7721e6dc19384579b0530702fe086
    container_name: jellyseerr
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      jellyfin:
        condition: service_healthy
    profiles:
      - media
      - jellyfin
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/logs/jellyseerr:/app/config/logs
      - $REPO_PATH/data/jellyseerr:/app/config
    environment:
      TZ: $TZ
      LOG_LEVEL: debug
      PORT: 5055
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5055/api/v1/status"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.jellyseerr-rtr.entrypoints: "websecure"
      traefik.http.routers.jellyseerr-rtr.rule: "Host(`jellyseerr.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.jellyseerr-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.jellyseerr-rtr.middlewares: "chain-no-auth@file"
      ## HTTP Services
      traefik.http.routers.jellyseerr-rtr.service: "jellyseerr-svc"
      traefik.http.services.jellyseerr-svc.loadbalancer.server.port: "5055"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Jellyseerr"
      homepage.icon: "jellyseerr.svg"
      homepage.href: "https://jellyseerr.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Media Request Manager for Jellyfin"
      homepage.widget.type: "jellyseerr"
      homepage.widget.url: "http://jellyseerr:5055"
      homepage.widget.key: "$JELLYSEERR_API_KEY"
      ####### GLANCE #######
      glance.name: "jellyseerr"
      glance.parent: "jellyfin"
      glance.icon: "sh:jellyseerr"
      glance.url: "https://jellyseerr.$DOMAINNAME"
      glance.description: "Media Request Manager for Jellyfin"
