# Official compose: https://github.com/immich-app/immich/blob/main/docker/docker-compose.rootless.yml
# Env variables: https://immich.app/docs/install/environment-variables

networks:
  immich_backend:

services:
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    container_name: immich-redis
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - immich
    networks:
      - immich_backend
    user: $PUID:$PGID
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    volumes:
      - $REPO_PATH/appdata/immich-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - immich
    networks:
      - immich_backend
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    shm_size: 128mb
    pids_limit: 512
    cpus: "3.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/immich-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $IMMICH_DB_PASSWORD
      POSTGRES_USER: $IMMICH_DB_USERNAME
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: "SSD" # Change to "HDD" if your database isn't stored on SSDs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m

  immich-server:
    extends:
      file: ./immich-server.yml
      service: immich-server
    container_name: immich-server
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    networks:
      - t3_proxy
      - immich_backend
    expose:
      - 2283
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.immich-server-rtr.entrypoints: "websecure"
      traefik.http.routers.immich-server-rtr.rule: "Host(`photos.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.immich-server-rtr.middlewares: "chain-tinyauth-relaxed@file" # NOTE: relaxed needed for `Map` tab to work
      ## HTTP Services
      traefik.http.routers.immich-server-rtr.service: "immich-server-svc"
      traefik.http.services.immich-server-svc.loadbalancer.server.port: "2283"
      ####### TINYAUTH #######
      tinyauth.apps.photos.config.domain: "photos.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Immich"
      homepage.icon: "immich.svg"
      homepage.href: "https://photos.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Selfhosted Photo App"
      homepage.widget.type: "immich"
      homepage.widget.url: "http://immich-server:2283"
      homepage.widget.key: "$IMMICH_API_KEY"
      homepage.widget.version: "2"
      ####### GLANCE #######
      glance.name: "Immich"
      glance.icon: "sh:immich-server"
      glance.url: "https://photos.$DOMAINNAME"
      glance.description: "Selfhosted Photo App"

  ##############################################
  # https://github.com/Salvoxia/immich-folder-album-creator
  immich-folder-album-creator:
    image: salvoxia/immich-folder-album-creator:2.0.3@sha256:0bcb08e37a5de9bf2a2d7c1b1b6898351cd4a244306983e1d8126777dc34e789
    container_name: immich-folder-album-creator
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      immich-server:
        condition: service_healthy
    profiles:
      - media
      - immich
    networks:
      - immich_backend
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      API_URL: http://immich-server:2283/api
      API_KEY: $IMMICH_API_KEY
      ROOT_PATH: /mnt/media/Photos/Pictures
      # NOTE: Admin library settings: watching disabled for SMB; scan at "30 * * * *".
      CRON_EXPRESSION: "0 * * * *"
      TZ: Europe/Istanbul
      ALBUM_LEVELS: 1
      LOG_LEVEL: INFO
      SYNC_MODE: "2" # Remove offline assets and delete empty albums after each run
      # RUN_IMMEDIATELY: "true" # Startup dry run; also set UNATTENDED=true to apply changes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pidof supercronic >/dev/null && wget -q --spider --timeout=3 "$${API_URL}/server/ping" || exit 1',
        ]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
