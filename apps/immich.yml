# TODO: Harden
# Env variables: https://immich.app/docs/install/environment-variables
services:
  immich-redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    healthcheck:
      test: redis-cli ping || exit 1

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    volumes:
      - $REPO_PATH/data/immich-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: $IMMICH_DB_PASSWORD
      POSTGRES_USER: $IMMICH_DB_USERNAME
      POSTGRES_DB: $IMMICH_DB_DATABASE_NAME
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PG_DATA: /var/lib/postgresql/data
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      - immich-redis
      - immich-postgres
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    healthcheck:
      disable: false
    volumes:
      - $IMMICH_UPLOAD_LOCATION:/usr/src/app/upload
      - $DIR_PHOTOS/Pictures:/mnt/media/Photos/Pictures
      - $DIR_PHOTOS/Videos:/mnt/media/Photos/Videos:ro
      # - $DIR_PHOTOS/Pictures:/mnt/media/Photos/Pictures
      # - $DIR_PHOTOS/Videos:/mnt/media/Photos/Videos
    environment:
      UPLOAD_LOCATION: $IMMICH_UPLOAD_LOCATION
      IMMICH_LOG_LEVEL: ${IMMICH_LOG_LEVEL:-error}
      REDIS_HOSTNAME: $IMMICH_REDIS_HOSTNAME
      DB_HOSTNAME: $IMMICH_DB_HOSTNAME
      DB_USERNAME: $IMMICH_DB_USERNAME
      DB_PASSWORD: $IMMICH_DB_PASSWORD
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.immich-server-rtr.entrypoints: "websecure"
      traefik.http.routers.immich-server-rtr.rule: "Host(`photos.$DOMAINNAME`)"
      # - "traefik.http.routers.immich-server-rtr.rule=Host(`photos.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      traefik.http.routers.immich-server-rtr.middlewares: "chain-tinyauth-relaxed@file" # NOTE: relaxed needed for `Map` tab to work
      # traefik.http.routers.immich-server-rtr.middlewares: "chain-no-auth-relaxed@file" # NOTE: relaxed needed for `Map` tab to work
      # - "traefik.http.routers.immich-server-rtr.middlewares=add-api"
      # - "traefik.http.middlewares.add-api.stripprefix.prefixes=/api"
      ## HTTP Services
      traefik.http.routers.immich-server-rtr.service: "immich-server-svc"
      traefik.http.services.immich-server-svc.loadbalancer.server.port: "2283"
      ####### TINYAUTH #######
      tinyauth.apps.photos.config.domain: "photos.$DOMAINNAME"
      tinyauth.apps.photos.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Immich"
      homepage.icon: "immich.svg"
      homepage.href: "https://photos.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Selfhosted Photo App"
      homepage.widget.type: "immich"
      homepage.widget.url: "http://immich-server:2283"
      homepage.widget.key: "$IMMICH_API_KEY"
      homepage.widget.version: "2"

  ##############################################
  # https://github.com/Salvoxia/immich-folder-album-creator
  immich-folder-album-creator:
    container_name: immich-folder-album-creator
    image: salvoxia/immich-folder-album-creator:latest@sha256:79b82f9818ded34c8dcfc5df0502126fdaff698b94ddad4b20ac1f0c3a7dcba2
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    restart: "no"
    depends_on:
      - immich-server
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    environment:
      API_URL: http://immich-server:2283/api
      API_KEY: $IMMICH_API_KEY
      ROOT_PATH: /mnt/media/Photos/Pictures
      CRON_EXPRESSION: "0 * * * *"
      TZ: Europe/Istanbul
      ALBUM_LEVELS: 1
      LOG_LEVEL: INFO
      SYNC_MODE: "2" # Remove offline assets and delete empty albums after each run
      # RUN_IMMEDIATELY: "true" # Run the script immediately after start

  # NOTE: On Immich -> Admin -> Settings -> Server Settings -> External Domain
  immich-public-proxy:
    container_name: immich-public-proxy
    image: alangrainger/immich-public-proxy:latest@sha256:add80c37eb2cc6d1e9622f3590ba4ee72c94a765c51a3b5e1afc485a4ec89135
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    restart: $RESTART_POLICY_MEDIA
    depends_on:
      - immich-server
    profiles:
      - media
      - immich
    networks:
      - t3_proxy
    ports:
      - "1003:3000"
    environment:
      IMMICH_URL: http://immich-server:2283
    # healthcheck:
    #   test: curl -s http://localhost:3000/share/healthcheck -o /dev/null || exit 1
    #   start_period: 10s
    #   timeout: 5s
    volumes:
      - $REPO_PATH/configs/immich-public-proxy/config.json:/app/config.json:ro
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Immich-Public-Proxy"
      homepage.icon: "immich.svg"
