# NOTE: https://github.com/rybbit-io/rybbit/blob/master/docker-compose.yml

# After first user creation, disable signup: RYBBIT_DISABLE_SIGNUP=true
networks:
  rybbit_backend:

services:
  rybbit-clickhouse:
    image: clickhouse/clickhouse-server:26.7.1@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    container_name: rybbit-clickhouse
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - monitoring
      - rybbit
    networks:
      - rybbit_backend
    expose:
      - "8123"
      - "9000"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/clickhouse-server:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
      - /var/log/clickhouse-server:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=775
      - /etc/clickhouse-server/users.d:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "4G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/configs/clickhouse-optimized/clickhouse-server:/etc/clickhouse-server/config.d:ro
      - $REPO_PATH/configs/clickhouse-optimized/clickhouse-users/zz_disable_query_logging.xml:/etc/clickhouse-server/users.d/zz_disable_query_logging.xml:ro
      - $REPO_PATH/data/rybbit/clickhouse:/var/lib/clickhouse
    environment:
      TZ: $TZ
      CLICKHOUSE_DB: ${RYBBIT_CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${RYBBIT_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${RYBBIT_CLICKHOUSE_PASSWORD:-frog}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m

  rybbit-postgres:
    image: postgres:18.4@sha256:d129b9577d274bb96cbd44d902bdeb1b935c89247d161241e9154cba64e13df4
    container_name: rybbit-postgres
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - monitoring
      - rybbit
    networks:
      - rybbit_backend
    expose:
      - 5432
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/rybbit/postgres:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${RYBBIT_POSTGRES_USER:-frog}
      POSTGRES_PASSWORD: ${RYBBIT_POSTGRES_PASSWORD:-frog}
      POSTGRES_DB: ${RYBBIT_POSTGRES_DB:-analytics}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  rybbit-backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.8.0@sha256:f729f42575bf018ff97e9f36d49200665b99003a14868acbe56a9b32a9ed6ac7
    container_name: rybbit-backend
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      rybbit-clickhouse:
        condition: service_healthy
      rybbit-postgres:
        condition: service_started
    profiles:
      - monitoring
      - rybbit
    networks:
      - t3_proxy
      - rybbit_backend
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment:
      TZ: $TZ
      NODE_ENV: production
      CLICKHOUSE_HOST: http://rybbit-clickhouse:8123
      CLICKHOUSE_DB: ${RYBBIT_CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_PASSWORD: ${RYBBIT_CLICKHOUSE_PASSWORD:-frog}
      POSTGRES_HOST: rybbit-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${RYBBIT_POSTGRES_DB:-analytics}
      POSTGRES_USER: ${RYBBIT_POSTGRES_USER:-frog}
      POSTGRES_PASSWORD: ${RYBBIT_POSTGRES_PASSWORD:-frog}
      BETTER_AUTH_SECRET: ${RYBBIT_BETTER_AUTH_SECRET:-my_random_auth_secret}
      BASE_URL: https://analytics.$DOMAINNAME
      DISABLE_SIGNUP: ${RYBBIT_DISABLE_SIGNUP:-true}
      DISABLE_TELEMETRY: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.rybbit-api-rtr.entrypoints: "websecure"
      traefik.http.routers.rybbit-api-rtr.rule: "Host(`analytics.$DOMAINNAME`) && Pathprefix(`/api`)"
      ## Middlewares
      # - "traefik.http.routers.rybbit-api-rtr.middlewares=chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.rybbit-api-rtr.service: "rybbit-api-svc"
      traefik.http.routers.rybbit-api-rtr.priority: "2"
      traefik.http.services.rybbit-api-svc.loadbalancer.server.port: "3001"
      ####### TINYAUTH #######
      tinyauth.apps.rybbit-backend.config.domain: "analytics.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "rybbit-api"
      homepage.icon: "rybbit.png"
      homepage.href: "https://analytics.$DOMAINNAME/api"
      homepage.target: "_blank"
      homepage.description: "OSS alternative API to Google Analytics"
      ####### GLANCE #######
      glance.name: "rybbit-api"
      glance.icon: "sh:rybbit"
      glance.url: "https://analytics.$DOMAINNAME/api"
      glance.description: "OSS alternative API to Google Analytics"

  rybbit-client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.8.0@sha256:f384c1f73a0c2fc0794526908a1fdb2ba410a5cdb3f105487af70f067c8f103a
    container_name: rybbit-client
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      - rybbit-backend
    profiles:
      - monitoring
      - rybbit
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment:
      TZ: $TZ
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://analytics.$DOMAINNAME
      NEXT_PUBLIC_DISABLE_SIGNUP: ${RYBBIT_DISABLE_SIGNUP:-true}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "--spider", "http://127.0.0.1:3002/"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.rybbit-rtr.entrypoints: "websecure"
      traefik.http.routers.rybbit-rtr.rule: "Host(`analytics.$DOMAINNAME`)"
      ## Middlewares
      # - "traefik.http.routers.rybbit-rtr.middlewares=chain-no-auth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.rybbit-rtr.service: "rybbit-svc"
      traefik.http.routers.rybbit-rtr.priority: "1"
      traefik.http.services.rybbit-svc.loadbalancer.server.port: "3002"
      ####### TINYAUTH #######
      tinyauth.apps.rybbit-client.config.domain: "analytics.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Monitoring"
      homepage.name: "rybbit"
      homepage.icon: "rybbit.png"
      homepage.href: "https://analytics.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "OSS alternative to Google Analytics"
      ####### GLANCE #######
      glance.name: "rybbit"
      glance.icon: "sh:rybbit"
      glance.url: "https://analytics.$DOMAINNAME"
      glance.description: "OSS alternative to Google Analytics"
