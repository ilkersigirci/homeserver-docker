# NOTE: Default login: username admin, password admin@bichon
# NOTE: Indices benefit from SSD storage; blob storage can use HDD
services:
  bichon:
    image: rustmailer/bichon:2.0.0@sha256:3efde2596833633398c2bba47a8c9520ff40cb05f3632d962a8386df6b327438
    container_name: bichon
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
    networks:
      - t3_proxy
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 512M
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/bichon:/data
    environment:
      ## Required
      BICHON_ROOT_DIR: /data
      BICHON_ENCRYPT_PASSWORD: $BICHON_ENCRYPT_PASSWORD
      ## Server & Networking
      BICHON_HTTP_PORT: 15630
      BICHON_BIND_IP: 0.0.0.0
      BICHON_PUBLIC_URL: https://mailarchive.$DOMAINNAME
      BICHON_WEBUI_TOKEN_EXPIRATION_HOURS: 168 # 7 days
      BICHON_HTTP_COMPRESSION_ENABLED: true
      ## Logging
      BICHON_LOG_LEVEL: info
      ## CORS
      BICHON_CORS_ORIGINS: https://mailarchive.$DOMAINNAME
      ## Storage Paths
      # BICHON_INDEX_DIR: /data/bichon-indices
      # BICHON_DATA_DIR: /data/bichon-storage
      ## Performance
      # BICHON_SYNC_CONCURRENCY: 4
      BICHON_METADATA_CACHE_SIZE: 134217728 # 128MB
      BICHON_ENVELOPE_CACHE_SIZE: 134217728 # 128MB
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--max-time", "3", "http://127.0.0.1:15630/api/status"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.bichon-rtr.entrypoints: "websecure"
      traefik.http.routers.bichon-rtr.rule: "Host(`mailarchive.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.bichon-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.bichon-rtr.service: "bichon-svc"
      traefik.http.services.bichon-svc.loadbalancer.server.port: "15630"
      ####### TINYAUTH #######
      tinyauth.apps.bichon.config.domain: "mailarchive.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Bichon"
      homepage.icon: "bichon.svg"
      homepage.href: "https://mailarchive.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Lightweight mail archiver based on Rust"
      ####### GLANCE #######
      glance.name: "bichon"
      glance.icon: "sh:bichon"
      glance.url: "https://mailarchive.$DOMAINNAME"
      glance.description: "Lightweight mail archiver based on Rust"
