# In initial setup, go to /login/setup
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.6.2@sha256:1cc51e5b36fa7ec31368d3efb24ba362be6dce20f3cc0a2852843527bd5110f0
    container_name: pocket-id
    restart: $RESTART_POLICY_CORE
    profiles:
      - core
    networks:
      - t3_proxy
    ports:
      - "1000:1411"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    volumes:
      - $REPO_PATH/data/pocket-id:/app/data
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: https://pocketid.$BASE_DOMAINNAME
      PORT: 1411
      ENCRYPTION_KEY: $POCKETID_ENCRYPTION_KEY
      DISABLE_RATE_LIMITING: true
      ANALYTICS_DISABLED: true
      TRUST_PROXY: true
      MAXMIND_LICENSE_KEY: $MAXMIND_LICENSE_KEY
      #  STATIC_API_KEY: your_api_key # Useful for declerative installations
    healthcheck:
      test: "curl -f http://localhost:1411/healthz"
      interval: 1m30s
      timeout: 5s
      start_period: 10s
      retries: 2
    labels:
      # traefik.enable: "true"
      # ## HTTP Routers
      # traefik.http.routers.pocket-id-rtr.entrypoints: "websecure"
      # traefik.http.routers.pocket-id-rtr.rule: "Host(`pocketid.$DOMAINNAME`)"
      # ## Middlewares
      # traefik.http.routers.pocket-id-rtr.middlewares: "chain-no-auth@file"
      # ## HTTP Services
      # traefik.http.routers.pocket-id-rtr.service: "pocket-id-svc"
      # traefik.http.services.pocket-id-svc.loadbalancer.server.port: "1411"
      ####### HOMEPAGE #######
      homepage.group: "Core"
      homepage.name: "pocket-id"
      homepage.icon: "pocket-id.svg"
      homepage.href: "https://pocketid.$BASE_DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "OIDC provider using only passkeys"
      ####### GLANCE #######
      glance.name: "pocket-id"
      glance.icon: "sh:pocket-id-dark"
      glance.url: "https://pocketid.$BASE_DOMAINNAME"
      glance.description: "OIDC provider using only passkeys"
