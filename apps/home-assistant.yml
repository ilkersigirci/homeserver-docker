networks:
  home_assistant_backend:

services:
  home-assistant-db:
    image: postgres:18.4@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    container_name: home-assistant-db
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
      - home-assistant
    networks:
      - home_assistant_backend
    expose:
      - 5432
    ports:
      - "127.0.0.1:5400:5432"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/home-assistant-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.5.3@sha256:ff875078181a0383bf3fca9f061be12d6180896dbd531de04e094e25505b0bb9
    container_name: home-assistant
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      home-assistant-db:
        condition: service_healthy
    profiles:
      - root
      - maintenance
      - home-assistant
    network_mode: host
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      # - /run/dbus:/run/dbus:ro
    environment:
      TZ: $TZ
    healthcheck:
      test: >-
        python3 -c "import sys,urllib.request as u;
        No=type('No',(u.HTTPErrorProcessor,),{'http_response':lambda s,req,res:res,'https_response':lambda s,req,res:res});
        r=u.build_opener(No).open('http://127.0.0.1:8123/api/',timeout=3);
        sys.exit(0 if r.status<500 else 1)"
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 3m
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "home-assistant"
      homepage.icon: "home-assistant.png"
      homepage.href: "https://smarthome.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Home automation"
      ####### GLANCE #######
      glance.name: "home-assistant"
      glance.icon: "sh:home-assistant"
      glance.url: "https://smarthome.$DOMAINNAME"
      glance.description: "Home automation"

  home-assistant-proxied:
    image: ghcr.io/home-assistant/home-assistant:2026.5.3@sha256:ff875078181a0383bf3fca9f061be12d6180896dbd531de04e094e25505b0bb9
    container_name: home-assistant-proxied
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      home-assistant-db:
        condition: service_healthy
    profiles:
      - not-used
    networks:
      - t3_proxy
      - home_assistant_backend
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/configs/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      # - /run/dbus:/run/dbus:ro
    environment:
      TZ: $TZ
    healthcheck:
      test: >-
        python3 -c "import sys,urllib.request as u;
        No=type('No',(u.HTTPErrorProcessor,),{'http_response':lambda s,req,res:res,'https_response':lambda s,req,res:res});
        r=u.build_opener(No).open('http://127.0.0.1:8123/api/',timeout=3);
        sys.exit(0 if r.status<500 else 1)"
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 3m
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.home-assistant-rtr.entrypoints: "websecure"
      traefik.http.routers.home-assistant-rtr.rule: "Host(`smarthome.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.home-assistant-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.home-assistant-rtr.service: "home-assistant-svc"
      traefik.http.services.home-assistant-svc.loadbalancer.server.port: "8123"
      ####### TINYAUTH #######
      tinyauth.apps.home-assistant.config.domain: "smarthome.$DOMAINNAME"
      tinyauth.apps.home-assistant.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "home-assistant"
      homepage.icon: "home-assistant.png"
      homepage.href: "https://smarthome.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Home automation"
      ####### GLANCE #######
      glance.name: "home-assistant"
      glance.icon: "sh:home-assistant"
      glance.url: "https://smarthome.$DOMAINNAME"
      glance.description: "Home automation"
