networks:
  home_assistant_backend:

services:
  home-assistant-db:
    image: postgres:18.4@sha256:775a0820dd34e907ec63277e388d145056d427548e461d7953a070edb5de3a3a
    container_name: home-assistant-db
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
      - home-assistant
    networks:
      - home_assistant_backend
    expose:
      - 5432
    ports:
      - "127.0.0.1:5400:5432"
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/home-assistant-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.5.1@sha256:d4fbec16196d5c8bedf32647f0ca7165f654d92a2e81f35a373508d3226cb867
    container_name: home-assistant
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      home-assistant-db:
        condition: service_healthy
    profiles:
      - root
      - maintenance
      - home-assistant
    network_mode: host
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: '1.0'
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/configs/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      # - /run/dbus:/run/dbus:ro
    environment:
      TZ: $TZ
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "home-assistant"
      homepage.icon: "home-assistant.png"
      homepage.href: "https://smarthome.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Home automation"
      ####### GLANCE #######
      glance.name: "home-assistant"
      glance.icon: "sh:home-assistant"
      glance.url: "https://smarthome.$DOMAINNAME"
      glance.description: "Home automation"

  home-assistant-proxied:
    image: ghcr.io/home-assistant/home-assistant:2026.5.1@sha256:d4fbec16196d5c8bedf32647f0ca7165f654d92a2e81f35a373508d3226cb867
    container_name: home-assistant-proxied
    restart: $RESTART_POLICY_MAINTENANCE
    depends_on:
      home-assistant-db:
        condition: service_healthy
    profiles:
      - not-used
    networks:
      - t3_proxy
      - home_assistant_backend
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    volumes:
      - $REPO_PATH/configs/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      # - /run/dbus:/run/dbus:ro
    environment:
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.home-assistant-rtr.entrypoints: "websecure"
      traefik.http.routers.home-assistant-rtr.rule: "Host(`smarthome.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.home-assistant-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.home-assistant-rtr.service: "home-assistant-svc"
      traefik.http.services.home-assistant-svc.loadbalancer.server.port: "8123"
      ####### TINYAUTH #######
      tinyauth.apps.home-assistant.config.domain: "smarthome.$DOMAINNAME"
      tinyauth.apps.home-assistant.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "home-assistant"
      homepage.icon: "home-assistant.png"
      homepage.href: "https://smarthome.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Home automation"
      ####### GLANCE #######
      glance.name: "home-assistant"
      glance.icon: "sh:home-assistant"
      glance.url: "https://smarthome.$DOMAINNAME"
      glance.description: "Home automation"
