services:
  freshrss:
    container_name: freshrss
    image: lscr.io/linuxserver/freshrss
    restart: $RESTART_POLICY_OTHERS
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/freshrss:/config
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.freshrss-rtr.entrypoints: "websecure"
      traefik.http.routers.freshrss-rtr.rule: "Host(`freshrss.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.freshrss-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.freshrss-rtr.service: "freshrss-svc"
      traefik.http.services.freshrss-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.freshrss.config.domain: "freshrss.$DOMAINNAME"
      tinyauth.apps.freshrss.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "FreshRSS"
      homepage.icon: "freshrss.svg"
      homepage.href: "https://freshrss.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "RSS Reader"
    profiles:
      - reading
