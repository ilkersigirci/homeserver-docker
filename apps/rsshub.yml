networks:
  rsshub_backend:

services:
  rsshub-browserless:
    image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
    container_name: rsshub-browserless
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - rsshub
    networks:
      - rsshub_backend
    user: blessuser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      core:
        hard: 0
        soft: 0
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:3000/pressure"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      ####### GLANCE #######
      glance.name: "rsshub-browserless"
      glance.parent: "rsshub"

  rsshub-redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    container_name: rsshub-redis
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - reading
      - rsshub
    networks:
      - rsshub_backend
    user: $PUID:$PGID
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/rsshub-valkey:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      ####### GLANCE #######
      glance.name: "rsshub-redis"
      glance.parent: "rsshub"

  rsshub:
    image: ghcr.io/diygod/rsshub:2026-06-16@sha256:39734ea8535539701bbc9405ba045f0ad12ae2e0a74da1c764e0f9ae91c72d4d
    container_name: rsshub
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      - rsshub-redis
      - rsshub-browserless
    profiles:
      - reading
      - rsshub
    networks:
      - t3_proxy
      - rsshub_backend
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://rsshub-redis:6379/"
      PUPPETEER_WS_ENDPOINT: "ws://rsshub-browserless:3000"
      TWITTER_AUTH_TOKEN: $TWITTER_AUTH_TOKEN
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:1200/healthz"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.rsshub-rtr.entrypoints: "websecure"
      traefik.http.routers.rsshub-rtr.rule: "Host(`rsshub.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.rsshub-rtr.middlewares: "chain-tinyauth@file" # NOTE: use chain-no-auth for https glance access
      ## HTTP Services
      traefik.http.routers.rsshub-rtr.service: "rsshub-svc"
      traefik.http.services.rsshub-svc.loadbalancer.server.port: "1200"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "rsshub"
      homepage.icon: "rsshub.png"
      homepage.href: "https://rsshub.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Everything is RSSible"
      ####### GLANCE #######
      glance.name: "rsshub"
      glance.icon: "sh:rsshub"
      glance.url: "https://rsshub.$DOMAINNAME"
      glance.description: "Everything is RSSible"
      glance.id: "rsshub"
