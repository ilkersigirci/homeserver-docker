networks:
  rsshub_backend:

services:
  rsshub-browserless:
    image: browserless/chrome@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
    container_name: rsshub-browserless
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - custom-user
      - reading
      - rsshub
    networks:
      - rsshub_backend
    user: blessuser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      core:
        hard: 0
        soft: 0
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:3000/pressure >/dev/null || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      ####### GLANCE #######
      glance.name: "rsshub-browserless"
      glance.parent: "rsshub"

  rsshub-redis:
    image: redis:alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
    container_name: rsshub-redis
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - custom-user
      - reading
      - rsshub
    networks:
      - rsshub_backend
    user: redis
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/appdata/rsshub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      ####### GLANCE #######
      glance.name: "rsshub-redis"
      glance.parent: "rsshub"

  rsshub:
    image: ghcr.io/diygod/rsshub:2026-05-01@sha256:20f9fc25a2c52bf701fd55b7d842fa8d17b302caa0eb4b18faa733877be582ed
    container_name: rsshub
    restart: $RESTART_POLICY_OTHERS
    depends_on:
      - rsshub-redis
      - rsshub-browserless
    profiles:
      - custom-user
      - reading
      - rsshub
    networks:
      - t3_proxy
      - rsshub_backend
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "2G"
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: "redis://rsshub-redis:6379/"
      PUPPETEER_WS_ENDPOINT: "ws://rsshub-browserless:3000"
      TWITTER_AUTH_TOKEN: $TWITTER_AUTH_TOKEN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:1200/healthz >/dev/null || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.rsshub-rtr.entrypoints: "websecure"
      traefik.http.routers.rsshub-rtr.rule: "Host(`rsshub.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.rsshub-rtr.middlewares: "chain-tinyauth@file" # NOTE: use chain-no-auth for https glance access
      ## HTTP Services
      traefik.http.routers.rsshub-rtr.service: "rsshub-svc"
      traefik.http.services.rsshub-svc.loadbalancer.server.port: "1200"
      ####### TINYAUTH #######
      tinyauth.apps.rsshub.config.domain: "rsshub.$DOMAINNAME"
      tinyauth.apps.rsshub.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "rsshub"
      homepage.icon: "rsshub.png"
      homepage.href: "https://rsshub.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Everything is RSSible"
      ####### GLANCE #######
      glance.name: "rsshub"
      glance.icon: "sh:rsshub"
      glance.url: "https://rsshub.$DOMAINNAME"
      glance.description: "Everything is RSSible"
      glance.id: "rsshub"
