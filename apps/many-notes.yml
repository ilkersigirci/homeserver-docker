services:
  # NOTE: sudo chown -R 33:33 $REPO_PATH/appdata/many-notes
  many-notes:
    container_name: many-notes
    image: brufdev/many-notes:0.15@sha256:2b40c79e4e68193199f95e2d8773f98fc6a63536de135c46dcea8eb7af20cff0
    # restart: $RESTART_POLICY_OTHERS
    restart: "no"
    profiles:
      - reading
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/many-notes/db:/var/www/html/database/sqlite
      - $REPO_PATH/appdata/many-notes/typesense:/var/www/html/typesense
      - $REPO_PATH/logs/many-notes:/var/www/html/storage/logs
      - $REPO_PATH/appdata/many-notes/private:/var/www/html/storage/app/private
      # FIXME: Not working
      - $DIR_NOTES/Markdown:/var/www/html/storage/app/private/vaults/2/my-vault:ro
    environment:
      APP_URL: https://many-notes.$DOMAINNAME
      APP_TIMEZONE: $TZ
      PHP_POST_MAX_SIZE: 500M
      PHP_UPLOAD_MAX_FILE_SIZE: 500M
      SETTINGS_REGISTRATION_ENABLED: true
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.many-notes-rtr.entrypoints: "websecure"
      traefik.http.routers.many-notes-rtr.rule: "Host(`many-notes.$DOMAINNAME`)"
      ## Middlewares
      # traefik.http.routers.many-notes-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.many-notes-rtr.service: "many-notes-svc"
      traefik.http.services.many-notes-svc.loadbalancer.server.port: "8080"
      ####### TINYAUTH #######
      tinyauth.apps.many-notes.config.domain: "many-notes.$DOMAINNAME"
      tinyauth.apps.many-notes.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "many-notes"
      homepage.icon: "many-notes.svg"
      homepage.href: "https://many-notes.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Markdown note-taking web application designed for simplicity"
