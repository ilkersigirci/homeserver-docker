---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Homeserver Images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfiles/**
      - .github/workflows/homeserver-images.yml
  pull_request:
    paths:
      - Dockerfiles/**
      - .github/workflows/homeserver-images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Validate' || 'Publish' }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gatus
            context: Dockerfiles/Gatus
            repository: homeserver-gatus
            platforms: linux/amd64,linux/arm64
          - name: Jupyter
            context: Dockerfiles/Jupyter
            repository: homeserver-jupyter
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image version
        id: version
        shell: bash
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          version="$(sed -n 's/^ARG IMAGE_VERSION=//p' "$CONTEXT/Dockerfile")"
          if [[ "$version" == "latest" || ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid or missing IMAGE_VERSION in $CONTEXT/Dockerfile" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ steps.version.outputs.value }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}
