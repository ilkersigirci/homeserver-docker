---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Custom Image

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      context:
        required: true
        type: string
      repository:
        required: true
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        type: string
      publish:
        required: true
        type: boolean

jobs:
  build:
    name: ${{ inputs.publish && 'Publish' || 'Validate' }} ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read image version
        id: version
        shell: bash
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          if [[ -x "$CONTEXT/version_tagging.sh" ]]; then
            version="$("$CONTEXT/version_tagging.sh")"
          else
            version="$(sed -n 's/^ARG IMAGE_VERSION=//p' "$CONTEXT/Dockerfile")"
          fi
          if [[ "$version" == "latest" || ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid or missing image version in $CONTEXT" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}:${{ steps.version.outputs.value }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repository }}
