---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Custom Image

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      context:
        required: true
        type: string
      repository:
        required: true
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        type: string
      publish:
        required: true
        type: boolean

jobs:
  build:
    name: ${{ inputs.publish && 'Publish' || 'Validate' }} ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Read image version
        id: version
        shell: bash
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          if [[ -x "$CONTEXT/version_tagging.sh" ]]; then
            version="$("$CONTEXT/version_tagging.sh")"
          else
            version="$(sed -n 's/^ARG IMAGE_VERSION=//p' "$CONTEXT/Dockerfile")"
          fi
          if [[ "$version" == "latest" || ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid or missing image version in $CONTEXT" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}:${{ steps.version.outputs.value }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repository }}
