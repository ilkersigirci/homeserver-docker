---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Custom Image

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      context:
        required: true
        type: string
      repository:
        required: true
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      image: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read image version and select native runners
        id: prepare
        shell: bash
        env:
          CONTEXT: ${{ inputs.context }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [[ -x "$CONTEXT/version_tagging.sh" ]]; then
            version="$("$CONTEXT/version_tagging.sh")"
          else
            version="$(sed -n 's/^ARG IMAGE_VERSION=//p' "$CONTEXT/Dockerfile")"
          fi
          if [[ "$version" == "latest" || ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid or missing image version in $CONTEXT" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          matrix="$(jq -cn --arg platforms "$PLATFORMS" '
            $platforms | split(",") | unique |
            if length == 0 then error("No platforms requested") else . end | map(
              if . == "linux/amd64" then {arch: "amd64", runner: "ubuntu-24.04"}
              elif . == "linux/arm64" then {arch: "arm64", runner: "ubuntu-24.04-arm"}
              else error("Unsupported platform: " + .)
              end
            ) | {include: .}
          ')"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ inputs.name }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.prepare.outputs.image) || 'type=cacheonly' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ inputs.repository }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repository }}-${{ matrix.arch }}

      - name: Export image digest
        if: inputs.publish
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload image digest
        if: inputs.publish
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.repository }}-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ inputs.name }} manifest
    if: inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download image digests
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: ${{ inputs.repository }}-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-platform image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          images=()
          while IFS= read -r arch; do
            digest="$(<"$RUNNER_TEMP/digests/$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            images+=("$IMAGE@$digest")
          done < <(jq -r '.include[].arch' <<< "$MATRIX")
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
