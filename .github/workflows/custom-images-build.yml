---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Custom Image

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      context:
        required: true
        type: string
      repository:
        required: true
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        required: false
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read image version
        id: prepare
        shell: bash
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          if [[ -x "$CONTEXT/version_tagging.sh" ]]; then
            version="$("$CONTEXT/version_tagging.sh")"
          else
            version="$(sed -n 's/^ARG IMAGE_VERSION=//p' "$CONTEXT/Dockerfile")"
          fi
          if [[ "$version" == "latest" || ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Invalid or missing image version in $CONTEXT" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ inputs.publish && 'Publish' || 'Validate' }} ${{ inputs.name }}
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      job-name-prefix: ${{ inputs.name }}
      context: ${{ inputs.context }}
      output: image
      platforms: ${{ inputs.platforms }}
      push: ${{ inputs.publish }}
      meta-images: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}
      meta-tags: type=raw,value=${{ needs.prepare.outputs.version }}
      meta-flavor: latest=false
      sbom: true
      cache: true
      cache-scope: ${{ inputs.repository }}
      cache-mode: max
    secrets:
      # github.token is only available inside steps, not job-level workflow calls.
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
