---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Marimo Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfiles/Marimo/**
  pull_request:
    paths:
      - Dockerfiles/Marimo/**
      - .github/workflows/custom-images-build.yml
      - .github/workflows/custom-images-marimo.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/custom-images-build.yml
    with:
      name: Marimo
      context: Dockerfiles/Marimo
      repository: homeserver-marimo
      publish: false

  publish:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/custom-images-build.yml
    with:
      name: Marimo
      context: Dockerfiles/Marimo
      repository: homeserver-marimo
      publish: true
