---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build LiteLLM Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfiles/LiteLLM/**
  pull_request:
    paths:
      - Dockerfiles/LiteLLM/**
      - .github/workflows/custom-images-build.yml
      - .github/workflows/custom-images-litellm.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/custom-images-build.yml
    with:
      name: LiteLLM
      context: Dockerfiles/LiteLLM
      repository: homeserver-litellm
      platforms: linux/amd64
      publish: false

  publish:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/custom-images-build.yml
    with:
      name: LiteLLM
      context: Dockerfiles/LiteLLM
      repository: homeserver-litellm
      platforms: linux/amd64
      publish: true
