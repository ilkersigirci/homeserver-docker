# TODO: Complete
# From: https://github.com/excalidraw/excalidraw/issues/5188#issuecomment-3848252703
services:
  excalidraw:
    image: excalidraw/excalidraw:latest@sha256:20ffa04668e19616bb0c1b3632849e5cd96e0bc7a1336b73d9d072667f2c2854
    container_name: excalidraw
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - others
    depends_on:
      excalidraw-room:
        condition: service_started
    networks:
      - t3_proxy
    expose:
      - 80
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Replacing WebSocket URL with: $$VITE_APP_WS_SERVER_URL"
        find /usr/share/nginx/html/assets -type f -name "*.js" -exec sed -i 's|https://oss-collab\.excalidraw\.com|'$$VITE_APP_WS_SERVER_URL'|g' {} +
        echo "Starting nginx..."
        nginx -g 'daemon off;'
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      NODE_ENV: production
      VITE_APP_WS_SERVER_URL: https://draw2gether.$DOMAINNAME
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.excalidraw-rtr.entrypoints: "websecure"
      traefik.http.routers.excalidraw-rtr.rule: "Host(`draw.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.excalidraw-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.excalidraw-rtr.service: "excalidraw-svc"
      traefik.http.services.excalidraw-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.excalidraw.config.domain: "draw.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Others"
      homepage.name: "Excalidraw"
      homepage.icon: "excalidraw.svg"
      homepage.href: "https://draw.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Virtual collaborative whiteboard"
      ####### GLANCE #######
      glance.name: "Excalidraw"
      glance.icon: "sh:excalidraw"
      glance.url: "https://draw.$DOMAINNAME"
      glance.description: "Virtual collaborative whiteboard"

  excalidraw-room:
    image: excalidraw/excalidraw-room:latest@sha256:2fe999f9be4379e3ee282fc45d75d84a691a6383dde33544514cc395287c7a70
    container_name: excalidraw-room
    restart: $RESTART_POLICY_OTHERS
    profiles:
      - others
    networks:
      - t3_proxy
    expose:
      - 80
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.excalidraw-room-rtr.entrypoints: "websecure"
      traefik.http.routers.excalidraw-room-rtr.rule: "Host(`draw2gether.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.excalidraw-room-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.excalidraw-room-rtr.service: "excalidraw-room-svc"
      traefik.http.services.excalidraw-room-svc.loadbalancer.server.port: "80"
      ####### TINYAUTH #######
      tinyauth.apps.excalidraw-room.config.domain: "draw2gether.$DOMAINNAME"
