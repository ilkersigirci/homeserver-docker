services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls25@sha256:01d2f3d9722c7958d8d3c3f95773319cfe349753802017ab23f528393b2d4e9e
    container_name: lidarr
    restart: $RESTART_POLICY_MEDIA
    # profiles:
    # - media
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.163
    security_opt:
      - no-new-privileges:true
    # ports:
    #  - "$LIDARR_PORT:8686"
    volumes:
      - $REPO_PATH/appdata/lidarr:/config
      # Optional. See why MediaCover is mounted as volume https://github.com/htpcBeginner/docker-traefik/discussions/147
      - $REPO_PATH/data/lidarr/MediaCover:/config/MediaCover
      - $REPO_PATH/data/downloads:/data/downloads
      - $REPO_PATH/data/media/music:/data/media/music
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      # HTTP Routers Auth Bypass
      traefik.http.routers.lidarr-rtr-bypass.entrypoints: "websecure"
      #- "traefik.http.routers.lidarr-rtr-bypass.rule=Host(`lidarr.$DOMAINNAME`) && (Header(`X-Api-Key`, `$LIDARR_API_KEY`) || Query(`apikey`, `$LIDARR_API_KEY`))"
      traefik.http.routers.lidarr-rtr-bypass.rule: "Host(`lidarr.$DOMAINNAME`) && Header(`traefik-auth-bypass-key`, `$TRAEFIK_AUTH_BYPASS_KEY`)" # Bypass Auth
      traefik.http.routers.lidarr-rtr-bypass.priority: "100"
      # HTTP Routers Auth
      traefik.http.routers.lidarr-rtr.entrypoints: "websecure"
      traefik.http.routers.lidarr-rtr.rule: "Host(`lidarr.$DOMAINNAME`)"
      traefik.http.routers.lidarr-rtr.priority: "99"
      # Middlewares
      traefik.http.routers.lidarr-rtr.middlewares: "chain-tinyauth@file"
      # traefik.http.routers.lidarr-rtr-bypass.middlewares: "chain-no-auth@file"
      # HTTP Services
      traefik.http.routers.lidarr-rtr.service: "lidarr-svc"
      traefik.http.routers.lidarr-rtr-bypass.service: "lidarr-svc"
      traefik.http.services.lidarr-svc.loadbalancer.server.port: "8686"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Lidarr"
      homepage.icon: "lidarr.svg"
      homepage.href: "https://lidarr.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "*rr for Music"
    profiles:
      - media
      - arr
