services:
  jupyterlab:
    image: quay.io/jupyter/base-notebook:2026-06-29@sha256:1b5f7be5d646dff573b0e8275649d954d07a5432597b3e5fe22654148caeec3f
    container_name: jupyterlab
    restart: $RESTART_POLICY_PROGRAMMING
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/jovyan/work
      - --IdentityProvider.token=
      - --PasswordIdentityProvider.hashed_password=
    profiles:
      - programming
    networks:
      - t3_proxy
    expose:
      - 8888
    user: $PUID:$PGID
    group_add:
      - "100"
    read_only: false # NOTE: Jupyter Docker Stacks keep /opt/conda writable for notebook package installs.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 512
    cpus: "2.0"
    mem_limit: "4G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - $REPO_PATH/data/jupyterlab:/home/jovyan/work
      - $REPO_PATH/appdata/jupyterlab:/home/jovyan/.jupyter
    environment:
      TZ: $TZ
      JUPYTER_PORT: 8888
      NB_UMASK: "002"
    healthcheck:
      test: ["CMD", "/etc/jupyter/docker_healthcheck.py"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.jupyterlab-rtr.entrypoints: "websecure"
      traefik.http.routers.jupyterlab-rtr.rule: "Host(`jupyterlab.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.jupyterlab-rtr.middlewares: "chain-tinyauth-relaxed@file"
      ## HTTP Services
      traefik.http.routers.jupyterlab-rtr.service: "jupyterlab-svc"
      traefik.http.services.jupyterlab-svc.loadbalancer.server.port: "8888"
      ####### TINYAUTH #######
      tinyauth.apps.jupyterlab.config.domain: "jupyterlab.$DOMAINNAME"
      tinyauth.apps.jupyterlab.ip.bypass: "$LOCAL_IPS"
      tinyauth.apps.jupyterlab.oauth.groups: "admin"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "JupyterLab"
      homepage.icon: "sh:jupyter"
      homepage.href: "https://jupyterlab.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Browser-based notebooks and Python workspace"
      ####### GLANCE #######
      glance.name: "JupyterLab"
      glance.icon: "sh:jupyter"
      glance.url: "https://jupyterlab.$DOMAINNAME"
      glance.description: "Browser-based notebooks and Python workspace"
