services:
  kavita:
    container_name: kavita
    image: kizaing/kavita:0.7.8.2@sha256:e07017b34ef152bb033d6f804c6ff4bbc92aa348bf32b8ed9808e405d6ffdf64
    # image: ghcr.io/kareadita/kavita:latest
    restart: $RESTART_POLICY_OTHERS
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/appdata/kavita:/kavita/config
      - $DIR_MEDIA/Books:/book
      # - ./manga:/manga
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.kavita-rtr.entrypoints: "websecure"
      traefik.http.routers.kavita-rtr.rule: "Host(`kavita.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.kavita-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.kavita-rtr.service: "kavita-svc"
      traefik.http.services.kavita-svc.loadbalancer.server.port: "5000"
      ####### TINYAUTH #######
      tinyauth.apps.kavita.config.domain: "kavita.$DOMAINNAME"
      tinyauth.apps.kavita.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Reading"
      homepage.name: "Kavita"
      homepage.icon: "kavita.svg"
      homepage.href: "https://kavita.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Fast, feature rich, cross platform reading server"
    profiles:
      - reading
