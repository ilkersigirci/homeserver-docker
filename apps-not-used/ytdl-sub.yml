services:
  # docker exec -u abc -it ytdl-sub /bin/bash
  ytdl-sub:
    image: ghcr.io/jmbannon/ytdl-sub:2026.04.13.post1@sha256:341706369c4b84cd44c9f938181283551185766b16e0894c153f4258396c1520
    container_name: ytdl-sub
    restart: $RESTART_POLICY_MEDIA
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      # - $REPO_PATH/configs/ytdl-sub/config:/config
      - $REPO_PATH/configs/ytdl-sub/config.yaml:/config/config.yaml
      - $REPO_PATH/configs/ytdl-sub/subscriptions.yaml:/config/subscriptions.yaml
      - $REPO_PATH/configs/ytdl-sub/download_yt.sh:/config/download_yt.sh
      - $DIR_MEDIA/Youtube_Sub:/tv_shows
      # - DIR_MEDIA/Movies:/movies # optional
      # - <path/to/music_videos>:/music_videos # optional
      # - DIR_MEDIA/Music:/music # optional
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.ytdl-rtr.entrypoints: "websecure"
      traefik.http.routers.ytdl-rtr.rule: "Host(`ytdl.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.ytdl-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      # - "traefik.http.routers.ytdl-rtr.service=ytdl-svc"
      # - "traefik.http.services.ytdl-svc.loadbalancer.server.port=8081"
      ####### TINYAUTH #######
      tinyauth.apps.ytdl-sub.config.domain: "ytdl.$DOMAINNAME"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "YtdlSub"
      homepage.icon: "youtube-dl.svg"
      homepage.href: "https://ytdl.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Youtube Downloader"
    profiles:
      - media
