services:
  metadata-remote:
    image: ghcr.io/wow-signal-dev/metadata-remote:latest@sha256:4fcc889a80c1f380f275efcecccf8f3826dac2c7ed73eebe0fd0cddc30d527e0
    container_name: metadata-remote
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DIR_MEDIA/Music/Deemix:/music
      # To add multiple music folders, mount them as well like this:
      # - /path/to/music1:/music/Library1
    environment:
      PUID: $PUID
      PGID: $PGID
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.metadata-remote-rtr.entrypoints: "websecure"
      traefik.http.routers.metadata-remote-rtr.rule: "Host(`music-metadata.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.metadata-remote-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.metadata-remote-rtr.service: "metadata-remote-svc"
      traefik.http.services.metadata-remote-svc.loadbalancer.server.port: "8338"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "metadata-remote"
      homepage.icon: "metadata-remote.png"
      homepage.href: "https://music-metadata.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Edit music metadata with ease"
      ####### GLANCE #######
      glance.name: "metadata-remote"
      glance.icon: "sh:metadata-remote"
      glance.url: "https://music-metadata.$DOMAINNAME"
      glance.description: "Edit music metadata with ease"
