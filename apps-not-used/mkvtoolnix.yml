services:
  # Video Editing (Remuxing - changing media container while keeping original source quality)
  mkvtoolnix:
    image: jlesage/mkvtoolnix:v26.04.1@sha256:c4d238f9b38d7ea23ae1df75ef7fee26c751cf3d0ab7631bb9fcb66296f66164
    container_name: mkvtoolnix
    restart: $RESTART_POLICY_MEDIA
    profiles:
      - media
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $REPO_PATH/configs/mkvtoolnix/config:/config:rw
      - $DIR_MEDIA/Downloads:/data/downloads
    environment:
      USER_ID: $PUID
      GROUP_ID: $PGID
      TZ: $TZ
      UMASK: 002
      KEEP_APP_RUNNING: 1
      CLEAN_TMP_DIR: 1
      DISPLAY_WIDTH: 1600
      DISPLAY_HEIGHT: 960
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.mkvtoolnix-rtr.entrypoints: "websecure"
      traefik.http.routers.mkvtoolnix-rtr.rule: "Host(`mkvtoolnix.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.mkvtoolnix-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.mkvtoolnix-rtr.service: "mkvtoolnix-svc"
      traefik.http.services.mkvtoolnix-svc.loadbalancer.server.port: "5800"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Mkvtoolnix"
      homepage.icon: "mkvtoolnix.webp"
      homepage.href: "https://mkvtoolnix.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "Ultimate Tool for Editing and Merging MKV Files"
