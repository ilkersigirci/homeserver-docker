# NOTE: .env.example https://github.com/Aterfax/pbs-client-docker/blob/main/docker-compose/.env.example
services:
  pbs-client:
    image: ghcr.io/aterfax/pbs-client:2026-08-08@sha256:b3a71ea88eb9c7574f4fa8539eb60ee73ac4ddfd4ae0bf293cef6149b037e87d
    container_name: pbs-client
    hostname: pbs-client-$MY_HOSTNAME
    restart: $RESTART_POLICY_MAINTENANCE
    profiles:
      - maintenance
    # Keep this off t3_proxy; enforce PBS-only egress with host firewall rules.
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:exec
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824
      - $REPO_PATH/secrets/pbs-client/$MY_HOSTNAME:/root/.config/proxmox-backup/
      # Note - if you want to restore backups make sure to change to read write below.
      # See the 'restore-backup' command inside the container.
      - $REPO_PATH:/backups/docker:ro
    environment:
      TZ: $TZ
      PBS_ENDPOINT: pbs.home.$BASE_DOMAINNAME
      PBS_DATASTORE: ${PBS_DATASTORE:-FILL_IT}
      PBS_DATASTORE_NS: ${PBS_DATASTORE_NS:-hosts/${MY_HOSTNAME}}
      PBS_ENCRYPTION_PASSWORD: ${PBS_ENCRYPTION_PASSWORD:-FILL_IT}
      # Keep container cron effectively dormant; schedule a host script instead.
      CRON_SCHEDULE: ${PBS_CRON_SCHEDULE:-0 0 1 1 *}
      UNENCRYPTED: 0
      CRON_BACKUP_ONLY: 1 # Skip backup on startup
      PBS_API_KEY_NAME: ${PBS_API_KEY_NAME:-username@pam!test}
      PBS_API_KEY_SECRET: ${PBS_API_KEY_SECRET:-FILL_IT}
      PBS_FINGERPRINT: ${PBS_FINGERPRINT:-}
      PBS_BACKUP_CMD_APPEND_EXTRA_OPTS: "${PBS_BACKUP_CMD_APPEND_EXTRA_OPTS:---change-detection-mode=metadata}"
      # PBS_RESTORE_CMD_APPEND_EXTRA_OPTS: --include-dev
    labels:
      ####### HOMEPAGE #######
      homepage.group: "Maintenance"
      homepage.name: "pbs-client"
      homepage.icon: "pbs-client.png"
      homepage.description: "Proxmox Backup Client"
      ####### GLANCE #######
      glance.name: "pbs-client"
      glance.icon: "sh:pbs-client"
      glance.description: "Proxmox Backup Client"
