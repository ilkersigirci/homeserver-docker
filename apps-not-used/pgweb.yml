services:
  pgweb:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    container_name: pgweb
    command: ["--bind=0.0.0.0", "--listen=8081"]
    restart: $RESTART_POLICY_PROGRAMMING
    profiles:
      - programming
    networks:
      - t3_proxy
      - hatchet_backend
    user: $PUID:$PGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: "1G"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      TZ: $TZ
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8081/"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      ## HTTP Routers
      traefik.http.routers.pgweb-rtr.entrypoints: "websecure"
      traefik.http.routers.pgweb-rtr.rule: "Host(`pgweb.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.pgweb-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.pgweb-rtr.service: "pgweb-svc"
      traefik.http.services.pgweb-svc.loadbalancer.server.port: "8081"
      ####### TINYAUTH #######
      tinyauth.apps.pgweb.config.domain: "pgweb.$DOMAINNAME"
      tinyauth.apps.pgweb.ip.bypass: "$LOCAL_IPS"
      ####### HOMEPAGE #######
      homepage.group: "Programming"
      homepage.name: "pgweb"
      homepage.icon: "pgweb.png"
      homepage.href: "https://pgweb.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "PostgreSQL web client"
      ####### GLANCE #######
      glance.name: "pgweb"
      glance.icon: "sh:pgweb"
      glance.url: "https://pgweb.$DOMAINNAME"
      glance.description: "PostgreSQL web client"
