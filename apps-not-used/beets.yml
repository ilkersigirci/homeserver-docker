services:
  beets:
    image: lscr.io/linuxserver/beets:2.10.0-ls326@sha256:49ba964b32ee7c44256619d5fda3db677072f21a92196846e81960b86604e1ad
    container_name: beets
    restart: $RESTART_POLICY_MEDIA
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      # - $REPO_PATH/configs/beets/config.yaml:/config/config.yaml # FIXME: not working
      - $REPO_PATH/appdata/beets:/config
      - $DIR_MEDIA/Music/Beets_TEST/Music:/music
      - $DIR_MEDIA/Music/Beets_TEST/Downloads:/downloads
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    labels:
      traefik.enable: "true"
      ## HTTP Routers Auth
      traefik.http.routers.beets-rtr.entrypoints: "websecure"
      traefik.http.routers.beets-rtr.rule: "Host(`beets.$DOMAINNAME`)"
      ## Middlewares
      traefik.http.routers.beets-rtr.middlewares: "chain-tinyauth@file"
      ## HTTP Services
      traefik.http.routers.beets-rtr.service: "beets-svc"
      traefik.http.services.beets-svc.loadbalancer.server.port: "8337"
      ####### HOMEPAGE #######
      homepage.group: "Media"
      homepage.name: "Beets"
      homepage.icon: "beets.svg"
      homepage.href: "https://beets.$DOMAINNAME"
      homepage.target: "_blank"
      homepage.description: "General Purpose Music Manager"
    profiles:
      - media
